<!-- 08/10 (titular): botão "voltar ao topo" em todas as páginas -->
<style>#btn-topo{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:none;
background:#0E2A55;color:#fff;font-size:22px;line-height:44px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);
opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999}#btn-topo.ver{opacity:.9;pointer-events:auto}#btn-topo:hover{opacity:1}
@media print{#btn-topo{display:none}}</style>
<button id="btn-topo" type="button" aria-label="Voltar ao topo da página" title="Voltar ao topo">&#8593;</button>
<script>(function(){var b=document.getElementById("btn-topo");if(!b)return;
function v(){b.classList.toggle("ver",(window.scrollY||document.documentElement.scrollTop)>300);}
window.addEventListener("scroll",v,{passive:true});v();
b.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});})();</script>
</body></html>
