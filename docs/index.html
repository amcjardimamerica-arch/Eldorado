<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de captação · A.M.C. Jardim América</title>
<style>
:root{--fundo:#FBFBFA;--cartao:#FFFFFF;--tinta:#23272E;--suave:#68707C;--linha:#E4E1D8;--marca:#1F5B99;--realce:#EEF3F9;
  --ok:#1E7E4B;--okf:#E8F4EC;--alerta:#8A6508;--alertaf:#FBF3DC;--urgente:#B8433A;--urgentef:#FBEAE7;
  --texto:Georgia,'Times New Roman',serif;--dados:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--fundo:#15181D;--cartao:#1D2128;--tinta:#E8E6E1;--suave:#A3AAB5;--linha:#343A44;--marca:#7FB0E6;
  --realce:#22303F;--ok:#6CC596;--okf:#1C3328;--alerta:#E2BC5C;--alertaf:#3A3220;--urgente:#EE8A80;--urgentef:#3D2522;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta)}
body{font-family:var(--texto);font-size:17px;line-height:1.5;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:var(--marca)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.topo{max-width:1120px;margin:0 auto;padding:28px 20px 0}
.casa{font-size:15px;color:var(--suave);margin:0}
h1{font-size:30px;line-height:1.15;margin:4px 0 0;font-weight:normal}
.prox{margin:22px 0 0;padding:20px 22px;background:var(--cartao);border:1px solid var(--linha);border-left:6px solid var(--urgente);border-radius:6px}
.prox p{margin:0}
.prox .quando{font-family:var(--dados);font-size:15px;color:var(--urgente);font-weight:600}
.prox .titulo{font-size:22px;line-height:1.25;margin:6px 0}
.abas{max-width:1120px;margin:26px auto 0;padding:0 20px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--linha)}
.abas button{font:15px var(--dados);background:none;border:0;border-bottom:3px solid transparent;color:var(--suave);padding:10px 12px;cursor:pointer}
.abas button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--marca);font-weight:600}
main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-family:var(--dados);font-size:15px}
.filtros input,.filtros select{font:inherit;color:var(--tinta);background:var(--cartao);border:1px solid var(--linha);border-radius:4px;padding:8px 10px}
.filtros input{flex:1 1 260px}
.conta{font-family:var(--dados);font-size:14px;color:var(--suave);margin:0 0 10px}
.op{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:14px 0;border-top:1px solid var(--linha)}
.op .dia{font-family:var(--dados);font-size:14px;color:var(--suave)}
.op .dia b{display:block;font-size:17px;color:var(--tinta);font-variant-numeric:tabular-nums}
.op .dia .urg{color:var(--urgente)}
.op h3{font-size:18px;font-weight:normal;margin:0 0 4px;line-height:1.3}
.meta{font-family:var(--dados);font-size:14px;color:var(--suave);margin:0}
.links{font-family:var(--dados);font-size:14px;margin:6px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.selo{display:inline-block;font-family:var(--dados);font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--linha);margin-left:6px;vertical-align:2px}
.selo.ouro{background:var(--alertaf);color:var(--alerta);border-color:transparent}.selo.prata{background:var(--realce);color:var(--marca);border-color:transparent}
.selo.bronze{background:var(--urgentef);color:var(--urgente);border-color:transparent}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--dados);font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--linha);vertical-align:top}
th{color:var(--suave);font-weight:600;border-top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mes{font-size:21px;font-weight:normal;margin:28px 0 4px}
.prog{background:var(--cartao);border:1px solid var(--linha);border-radius:6px;padding:18px 20px;margin:0 0 16px}
.prog h3{font-size:20px;font-weight:normal;margin:0 0 6px}
.trecho{color:var(--suave);font-size:13px}
.barra{height:8px;background:var(--marca);border-radius:4px;min-width:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.vazio{color:var(--suave);font-style:italic}
.pag{display:flex;gap:8px;align-items:center;font-family:var(--dados);font-size:14px;margin:14px 0}
.pag button{font:inherit;padding:6px 12px;border:1px solid var(--linha);background:var(--cartao);color:var(--tinta);border-radius:4px;cursor:pointer}
.pag button:disabled{opacity:.45;cursor:default}
.ok{color:var(--ok)}.falha{color:var(--urgente)}
footer{max-width:1120px;margin:0 auto;padding:0 20px 40px;font-family:var(--dados);font-size:13px;color:var(--suave)}
@media (max-width:640px){.op{grid-template-columns:1fr;gap:4px}h1{font-size:25px}body{font-size:16px}}
</style>
</head>
<body>
<header class="topo">
  <p class="casa">A.M.C. Jardim América</p>
  <h1>Painel de captação</h1>
  <div class="prox" id="prox" aria-live="polite"><p class="meta">Carregando as oportunidades…</p></div>
</header>
<nav class="abas" role="tablist" aria-label="Telas do painel">
  <button role="tab" data-tela="abertas">Abertas agora</button>
  <button role="tab" data-tela="calendario">Calendário</button>
  <button role="tab" data-tela="biblioteca">Biblioteca</button>
  <button role="tab" data-tela="programas">Programas de incentivo</button>
  <button role="tab" data-tela="motores">Motores</button>
  <button role="tab" data-tela="sala">Sala</button>
</nav>
<main id="tela" tabindex="-1"></main>
<footer id="rodape"></footer>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let D = null;
const hoje = () => new Date(D.hoje + "T12:00:00");
const dataBR = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("pt-BR") : "sem data";
const quando = iso => iso ? new Date(iso).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) : "—";
const dias = iso => Math.round((new Date(iso.slice(0, 10) + "T12:00:00") - hoje()) / 864e5);
const terr = (a, m) => (D.territorios[a] || "A revisar") + (m ? ` · ${m}` : "");
const selo = e => e && e !== "sem" ? `<span class="selo ${esc(e)}">${esc(e)}</span>` : "";
const links = (of, dv) => {
  const l = [];
  if (of) l.push(`<a href="${esc(of)}" target="_blank" rel="noopener">Edital oficial</a>`);
  if (dv && dv !== of) l.push(`<a href="${esc(dv)}" target="_blank" rel="noopener">Divulgação</a>`);
  return l.length ? `<p class="links">${l.join("")}</p>` : "";
};
const prazo = x => {
  if (!x.inscricao_fim) return `<div class="dia">fluxo contínuo</div>`;
  const n = dias(x.inscricao_fim);
  const txt = n === 0 ? "termina hoje" : n === 1 ? "termina amanhã" : `faltam ${n} dias`;
  return `<div class="dia"><b>${dataBR(x.inscricao_fim)}</b><span class="${n <= 7 ? "urg" : ""}">${txt}</span></div>`;
};
const cartaoOp = x => `<article class="op">${prazo(x)}<div><h3>${esc(x.titulo)}${selo(x.estrela)}</h3>
  <p class="meta">${esc(x.orgao || "órgão não identificado")} · ${esc(terr(x.abrangencia, x.municipio))}${x.valor_max ? ` · até R$ ${Number(x.valor_max).toLocaleString("pt-BR")}` : ""}</p>
  ${links(x.link_oficial, x.link_divulgacao)}</div></article>`;
const seletorTerr = id => `<select id="${id}" aria-label="Território"><option value="">Todos os territórios</option>${
  Object.entries(D.territorios).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>`;

const TELAS = {
  abertas() {
    $("#tela").innerHTML = `<div class="filtros"><input id="f-busca" type="search" placeholder="Procurar por título ou órgão" aria-label="Procurar">${seletorTerr("f-terr")}</div>
      <p class="conta" id="f-conta"></p><div id="f-lista"></div>`;
    const desenhar = () => {
      const q = $("#f-busca").value.toLowerCase(), t = $("#f-terr").value;
      const l = D.abertas.filter(x => (!t || x.abrangencia === t) && (!q || `${x.titulo} ${x.orgao}`.toLowerCase().includes(q)));
      $("#f-conta").textContent = `${l.length} oportunidade${l.length === 1 ? "" : "s"} com inscrição aberta, da que vence primeiro para a última`;
      $("#f-lista").innerHTML = l.map(cartaoOp).join("") || `<p class="vazio">Nenhuma oportunidade aberta com esse filtro. Limpe a busca ou escolha outro território.</p>`;
    };
    $("#f-busca").oninput = desenhar; $("#f-terr").onchange = desenhar; desenhar();
  },
  calendario() {
    const meses = {};
    D.abertas.filter(x => x.inscricao_fim).forEach(x => (meses[x.inscricao_fim.slice(0, 7)] ??= []).push(x));
    const chaves = Object.keys(meses).sort();
    $("#tela").innerHTML = `<p class="conta">Os prazos de inscrição das oportunidades abertas, mês a mês. As de fluxo contínuo estão em “Abertas agora”.</p>` +
      (chaves.map(k => { const [a, m] = k.split("-"); return `<h2 class="mes">${MESES[+m - 1]} de ${a} <span class="conta">(${meses[k].length})</span></h2>` + meses[k].map(cartaoOp).join(""); }).join("")
       || `<p class="vazio">Nenhum prazo de inscrição confirmado nas oportunidades abertas.</p>`);
  },
  biblioteca() {
    const C = D.livros_campos, idx = Object.fromEntries(C.map((c, i) => [c, i]));
    $("#tela").innerHTML = `<div class="filtros"><input id="b-busca" type="search" placeholder="Procurar na Biblioteca" aria-label="Procurar na Biblioteca">${seletorTerr("b-terr")}
      <select id="b-est" aria-label="Estrela"><option value="">Todas as estrelas</option><option>ouro</option><option>prata</option><option>bronze</option><option value="sem">sem estrela</option></select>
      <select id="b-prazo" aria-label="Prazo"><option value="">Todos os prazos</option><option value="aberta">abertas</option><option value="encerrada">encerradas</option><option value="sem prazo">sem prazo</option></select>
      <select id="b-val" aria-label="Validação"><option value="">Validados e a revisar</option><option value="aprovado">validados</option><option value="revisar">a revisar</option></select></div>
      <p class="conta" id="b-conta"></p><div class="tabela"><table><thead><tr><th>Livro</th><th>Território</th><th>Estrela</th><th>Prazo</th></tr></thead><tbody id="b-corpo"></tbody></table></div>
      <div class="pag"><button id="b-ant">Anteriores</button><span id="b-pag"></span><button id="b-prox">Próximos</button></div>`;
    let pagina = 0; const POR = 50;
    const filtrar = () => {
      const q = $("#b-busca").value.toLowerCase(), t = $("#b-terr").value, e = $("#b-est").value, p = $("#b-prazo").value, v = $("#b-val").value;
      return D.livros.filter(r => (!t || r[idx.abrangencia] === t) && (!e || (r[idx.estrela] || "sem") === e) && (!p || r[idx.situacao_prazo] === p)
        && (!v || r[idx.validacao] === v) && (!q || `${r[idx.titulo]} ${r[idx.orgao]} ${r[idx.municipio] || ""}`.toLowerCase().includes(q)));
    };
    const desenhar = () => {
      const l = filtrar(), total = Math.max(1, Math.ceil(l.length / POR)); pagina = Math.min(pagina, total - 1);
      $("#b-conta").textContent = `${l.length.toLocaleString("pt-BR")} livro${l.length === 1 ? "" : "s"}`;
      $("#b-corpo").innerHTML = l.slice(pagina * POR, (pagina + 1) * POR).map(r => `<tr><td>${r[idx.link_oficial] ? `<a href="${esc(r[idx.link_oficial])}" target="_blank" rel="noopener">${esc(r[idx.titulo])}</a>` : esc(r[idx.titulo])}
        <div class="trecho">${esc(r[idx.orgao] || "")}</div></td><td>${esc(terr(r[idx.abrangencia], r[idx.municipio]))}</td><td>${selo(r[idx.estrela]) || "—"}</td>
        <td>${r[idx.situacao_prazo] === "aberta" ? `<span class="ok">aberta${r[idx.inscricao_fim] ? " até " + dataBR(r[idx.inscricao_fim]) : ""}</span>` : esc(r[idx.situacao_prazo] || "")}</td></tr>`).join("")
        || `<tr><td colspan="4" class="vazio">Nenhum livro com esse filtro.</td></tr>`;
      $("#b-pag").textContent = `página ${pagina + 1} de ${total}`; $("#b-ant").disabled = pagina === 0; $("#b-prox").disabled = pagina >= total - 1;
    };
    ["b-busca", "b-terr", "b-est", "b-prazo", "b-val"].forEach(i => $("#" + i).addEventListener("input", () => { pagina = 0; desenhar(); }));
    $("#b-ant").onclick = () => { pagina--; desenhar(); }; $("#b-prox").onclick = () => { pagina++; desenhar(); }; desenhar();
  },
  programas() {
    $("#tela").innerHTML = `<p class="conta">Os mecanismos de incentivo, com a lei que os rege e cada item comprovado no texto oficial (com o trecho e a página).</p>` +
      (D.programas.map(p => `<section class="prog"><h3>${esc(p.titulo)}${selo(p.estrela)}</h3>
        <p class="meta">${p.leis.map(l => l.link_oficial ? `<a href="${esc(l.link_oficial)}" target="_blank" rel="noopener">${esc(l.ementa)}</a>` : esc(l.ementa)).join(" · ")}</p>
        ${p.link_oficial ? `<p class="links"><a href="${esc(p.link_oficial)}" target="_blank" rel="noopener">Página oficial</a></p>` : ""}
        <div class="tabela"><table><thead><tr><th>Item</th><th>O que diz a fonte</th><th>Página</th></tr></thead><tbody>${
          p.certidoes.map(c => `<tr><td>${esc(c.item)}</td><td>${esc(c.valor)}${c.trecho ? `<div class="trecho">“${esc(c.trecho.slice(0, 260))}”</div>` : ""}</td><td class="n">${esc(c.pagina ?? "—")}</td></tr>`).join("")
          || `<tr><td colspan="3" class="vazio">Nenhum item comprovado ainda: o motor relê a norma na próxima mudança.</td></tr>`}</tbody></table></div>
        ${p.relacionados.length ? `<p class="meta" style="margin-top:12px">Publicações ligadas a esta lei:</p><ul class="meta">${p.relacionados.map(x =>
          `<li>${x.link_oficial ? `<a href="${esc(x.link_oficial)}" target="_blank" rel="noopener">${esc(x.titulo)}</a>` : esc(x.titulo)}</li>`).join("")}</ul>` : ""}</section>`).join("")
       || `<p class="vazio">Nenhum programa de incentivo ligado a uma lei ainda.</p>`);
  },
  motores() {
    $("#tela").innerHTML = `<p class="conta">Cada motor, os horários (Brasília), a última leitura e o que ele já trouxe. Os aceitos passaram pelo portão da missão.</p>
      <div class="tabela"><table><thead><tr><th>Motor</th><th>Horários</th><th>Última leitura</th><th class="n">Achados</th><th class="n">Aceitos</th><th>Situação</th></tr></thead><tbody>${
      D.motores.map(m => { const falhas = m.fontes.filter(f => f.falhas > 0 && f.ultimo_erro);
        return `<tr><td>${esc(m.id)}</td><td>${esc(m.horarios.join(", "))}</td><td>${m.ultima ? quando(m.ultima.inicio) : "ainda não rodou"}</td>
        <td class="n">${m.achados}</td><td class="n">${m.aceitos}</td><td>${falhas.length ? `<span class="falha">${esc(falhas[0].nome)}: ${esc(String(falhas[0].ultimo_erro).slice(0, 120))}</span>` : `<span class="ok">funcionando</span>`}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  },
  sala() {
    const r = D.resumo, maxT = Math.max(...Object.values(r.territorio));
    $("#tela").innerHTML = `<div class="grade"><section><h2 class="mes">A Biblioteca</h2>
        <p class="meta">${r.livros.toLocaleString("pt-BR")} livros validados · ${r.abertas} com inscrição aberta · ${r.revisar} a revisar</p>
        <table><tbody>${Object.entries(r.territorio).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td>
          <td style="width:45%"><div class="barra" style="width:${(100 * v / maxT).toFixed(1)}%"></div></td></tr>`).join("")}</tbody></table></section>
      <section><h2 class="mes">As passagens</h2><table><thead><tr><th>Início</th><th>Duração</th><th>Situação</th></tr></thead><tbody>${
        D.passagens.map(p => `<tr><td>${quando(p.inicio)}</td><td class="n">${p.fim ? Math.round((new Date(p.fim) - new Date(p.inicio)) / 1000) + " s" : "—"}</td>
        <td class="${p.estado === "concluida" ? "ok" : "falha"}">${esc(p.estado)}</td></tr>`).join("")}</tbody></table></section>
      <section><h2 class="mes">Alarmes abertos</h2>${D.alarmes.length ? `<table><tbody>${D.alarmes.map(a => `<tr><td>${esc(a.gravidade)}</td><td>${esc(a.modulo)}: ${esc(a.mensagem)}</td></tr>`).join("")}</tbody></table>`
        : `<p class="vazio">Nenhum alarme aberto.</p>`}</section></div>`;
  },
};

function abrir(nome) {
  if (!TELAS[nome]) nome = "abertas";
  document.querySelectorAll(".abas button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tela === nome)));
  TELAS[nome]();
  if (location.hash.slice(1) !== nome) history.replaceState(null, "", "#" + nome);
}

document.querySelectorAll(".abas button").forEach(b => b.onclick = () => { abrir(b.dataset.tela); $("#tela").focus({preventScroll: true}); });
window.addEventListener("hashchange", () => abrir(location.hash.slice(1)));

fetch("dados/painel.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  D = d;
  const p = D.abertas.find(x => x.inscricao_fim && dias(x.inscricao_fim) >= 0);
  $("#prox").innerHTML = p ? `<p class="quando">${dias(p.inscricao_fim) === 0 ? "Termina hoje" : `Termina em ${dias(p.inscricao_fim)} dia${dias(p.inscricao_fim) === 1 ? "" : "s"}`}, ${dataBR(p.inscricao_fim)}</p>
    <p class="titulo">${esc(p.titulo)}</p><p class="meta">${esc(p.orgao || "")} · ${esc(terr(p.abrangencia, p.municipio))} · ${D.resumo.abertas} oportunidades abertas no total</p>${links(p.link_oficial, p.link_divulgacao)}`
    : `<p class="meta">Nenhuma oportunidade com prazo de inscrição confirmado neste momento.</p>`;
  document.querySelector('[data-tela="abertas"]').textContent = `Abertas agora (${D.resumo.abertas})`;
  $("#rodape").textContent = `Atualizado em ${quando(D.gerado_em)} · última passagem ${D.resumo.ultima_passagem ? quando(D.resumo.ultima_passagem.inicio) : "—"}`;
  abrir(location.hash.slice(1));
}).catch(e => { $("#prox").innerHTML = `<p class="falha">Os dados do painel não carregaram (${esc(e.message)}). Recarregue a página; se continuar, a última passagem pode não ter gravado o painel.</p>`; });
</script>
</body>
</html>
