name: 01 · Eldorado — varredura profunda segunda e quarta
on:
  schedule:
    - cron: "0 9 * * 1,5" # 06:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
    inputs:
      fontes:
        description: "IDs dos pontos de captação a rodar (separados por vírgula). Vazio = escala normal do dia."
        required: false
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: eldorado-varredura-diaria   # grupo próprio: não pode ser cancelada pela carga histórica
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      FAROL_AI_API_KEY: ${{ secrets.FAROL_AI_API_KEY }}
      MOTORES_FONTES: ${{ github.event.inputs.fontes }}
      ACESSO_MASTER: ${{ secrets.ACESSO_MASTER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Testes antes da coleta
        run: |
          # o resultado fica no repositório (estado/ultimo_teste_ci.txt) para
          # diagnóstico mesmo quando o log do Actions não é acessível
          set +e
          timeout 1200 python -m unittest discover -s tests -v > /tmp/testes.log 2>&1
          rc=$?
          { echo "commit: $GITHUB_SHA"; echo "em: $(date -u +%FT%TZ)"; echo "rc: $rc";
            tail -5 /tmp/testes.log; echo "---- falhas ----";
            grep -A30 -E "^(FAIL|ERROR):" /tmp/testes.log | head -300; } > estado/ultimo_teste_ci.txt
          exit $rc
      - name: Coletar, verificar, acionar Farol e publicar painel
        run: python -m src.executar_diario
      - name: Carga de parlamentares (apenas em outubro e novembro)
        if: always()
        run: |
          MES=$(date -u +%m)
          if [ "$MES" = "10" ] || [ "$MES" = "11" ]; then
            python -m src.parlamentares || echo "carga de parlamentares falhou; area declara pendencia"
          else
            echo "Fora da janela de emendas (outubro/novembro) - carga nao executada." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Busca ativa de resultados, prorrogacoes e recursos
        if: always()
        run: python -m src.resultados || true

      - name: Dados do dashboard interativo
        if: always()
        run: |
          pip install pypdf --quiet
          python -m src.completude | tee completude.json
          timeout 600 python -m src.historico || echo "src.historico: encerrado no orçamento de 600s ou falhou — registrado"
          timeout 300 python -m src.historico_parecer || echo "src.historico_parecer: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 300 python -m src.confirmacao || echo "src.confirmacao: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 120 python -m src.destinacao || echo "destinacao: registrado"
          timeout 180 python -m src.pertinencia || echo "pertinencia: registrado" || echo "src.destinacao: encerrado no orçamento de 120s ou falhou — registrado"
          python -m src.emendas
          python -m src.emendas_docs
          timeout 1500 python -m src.sensores || echo "src.sensores: encerrado no orçamento de 1500s ou falhou — registrado"
          timeout 600 python -m src.investigacao || echo "src.investigacao: encerrado no orçamento de 600s ou falhou — registrado"
          timeout 300 python -m src.regramentos || echo "src.regramentos: encerrado no orçamento de 300s ou falhou — registrado"
          python -m src.previsao
          timeout 300 python -c "from src.janelas import verificar_por_sensor; verificar_por_sensor()" || echo "janelas: sem rede"
          python -m src.fontes260
          timeout 900 python -m src.edicao || echo "src.edicao: encerrado no orçamento de 900s ou falhou — registrado"
          timeout 300 python -m src.completude_biblioteca || echo "src.completude_biblioteca: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 300 python -m src.auditoria || echo "src.auditoria: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 300 python -m src.dossie_fontes || echo "src.dossie_fontes: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 300 python -m src.motores || echo "src.motores: encerrado no orçamento de 300s ou falhou — registrado"
          timeout 120 python -m src.parecer_prazos || echo "src.parecer_prazos: encerrado no orçamento de 120s ou falhou — registrado"
          python -m src.banco
          python -m src.biblioteca
          python -m src.arquivamento
          python -m src.fluxo || echo "fluxo 4-5: sem editais completos"
          python -m src.farol_parecer || echo "parecer: sem credencial ou sem pedidos"
          python -m src.dashboard_dados | tee dash.json
          python -m src.banco
          pip install cryptography --quiet
          python scripts/acesso.py proteger || true
          {
            echo '## Dashboard interativo atualizado'
            echo 'Painel vivo: docs/dashboard.html (GitHub Pages ou local)'
            echo '```json'
            cat dash.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f dash.json
      - name: Rotas dos 260 pontos e cobertura do acervo
        if: always()
        run: |
          timeout 300 python -m src.rota_monitoramento || echo "src.rota_monitoramento: encerrado no orçamento de 300s ou falhou — registrado"
          python scripts/cobertura_catalogo.py
      - name: Relatorio de amplitude (canais, tokens, testes, padroes)
        if: always()
        run: python -m src.relatorio_amplitude
      - name: Resumo e decisão de alerta
        if: always()
        run: python -m src.resumo_execucao >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar somente alterações produzidas
        if: always()
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add biblioteca_alexandria -A dados estado docs
          git diff --cached --quiet && exit 0
          git commit -m "dados: varredura profunda $(date -u +%F)"
          git push
      - name: Abrir issue quando houver alerta
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const caminho = 'estado/alerta.json';
            if (!fs.existsSync(caminho)) return;
            const alerta = JSON.parse(fs.readFileSync(caminho, 'utf8'));
            if (!alerta.abrir_issue) return;
            const {data} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'alerta-operacao'});
            if (data.some(i => i.title === alerta.titulo)) return;
            await github.rest.issues.create({...context.repo, title: alerta.titulo, body: alerta.corpo, labels: ['alerta-operacao']});

      - name: Abrir issue de prazos a vencer
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const caminho = 'estado/alerta_prazos.json';
            if (!fs.existsSync(caminho)) return;
            const alerta = JSON.parse(fs.readFileSync(caminho, 'utf8'));
            if (!alerta.abrir_issue) return;
            const {data} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'prazo'});
            if (data.some(i => i.title === alerta.titulo)) return;
            await github.rest.issues.create({...context.repo, title: alerta.titulo, body: alerta.corpo, labels: ['prazo']});
