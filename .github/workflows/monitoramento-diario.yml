name: 01 · Eldorado — varredura profunda segunda e quarta
on:
  schedule:
    - cron: "0 9 * * 1,3" # 06:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: eldorado-repo-writes
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Testes antes da coleta
        run: python -m unittest discover -s tests -v
      - name: Coletar, verificar pistas e publicar painel Eldorado
        run: python -m src.executar_diario
      - name: Registrar somente alterações produzidas
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          git add dados/oportunidades dados/editais dados/financiadores dados/doadores dados/associacoes estado docs
          git diff --cached --quiet && exit 0
          git commit -m "dados: varredura profunda $(date -u +%F)"
          git push
