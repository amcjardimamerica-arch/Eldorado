name: 01 · Eldorado — motores por hora (00h–06h BRT)
on:
  schedule:
    - cron: "0 3 * * *"   # 00h BRT · diários oficiais
    - cron: "0 4 * * *"   # 01h BRT · justiça e legislativo
    - cron: "0 5 * * *"   # 02h BRT · plataformas e API
    - cron: "0 6 * * 1-6" # 03h BRT · completude, edições, regramentos (seg–sáb)
    - cron: "0 7 * * *"   # 04h BRT · Motores Opressores ativos
    - cron: "0 9 * * *"   # 06h BRT · relatório e painel
    - cron: "0 6 * * 0"   # 03h BRT de DOMINGO · motor de empresas (semanal)
    - cron: "30 6 1 * *"  # 03h30 BRT do DIA 1 · documentos das associações (certidões mensais, expurgo > 90 dias)
  workflow_dispatch:
    inputs:
      fontes:
        description: "IDs dos pontos de captação a rodar (separados por vírgula). Vazio = escala normal do dia."
        required: false
        default: ""
      bloco:
        description: "Bloco a executar: diarios | justica_legislativo | plataformas_api | completude | opressores | relatorio | empresas | regulares | documentos | completo"
        required: false
        default: "completo"
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: eldorado-varredura-diaria   # grupo próprio: não pode ser cancelada pela carga histórica
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      FAROL_AI_API_KEY: ${{ secrets.FAROL_AI_API_KEY }}
      MOTORES_FONTES: ${{ github.event.inputs.fontes }}
      MOTORES_BLOCO_INPUT: ${{ github.event.inputs.bloco }}
      AGENDA_CRON: ${{ github.event.schedule }}
      ACESSO_MASTER: ${{ secrets.ACESSO_MASTER }}
    steps:
      - uses: actions/checkout@v4
      - name: Saída pelo Brasil (túnel WireGuard até servidor do titular, se configurado)
        env:
          WG_CONFIG_BR: ${{ secrets.WG_CONFIG_BR }}
        run: |
          if [ -n "$WG_CONFIG_BR" ]; then
            sudo apt-get install -y -qq wireguard-tools resolvconf >/dev/null 2>&1 || sudo apt-get install -y -qq wireguard-tools >/dev/null 2>&1
            echo "$WG_CONFIG_BR" | sudo tee /etc/wireguard/br.conf >/dev/null
            sudo chmod 600 /etc/wireguard/br.conf
            sudo wg-quick up br && echo "túnel BR ativo — IP de saída: $(curl -s --max-time 10 https://api.ipify.org || echo desconhecido)" | tee estado/saida_brasil.txt
          else
            echo "sem WG_CONFIG_BR: robô sai pelos EUA (GitHub); portais que bloqueiam IP estrangeiro continuam fechados" | tee estado/saida_brasil.txt
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Decidir o bloco da hora (00h–06h BRT)
        id: bloco
        run: |
          case "$AGENDA_CRON" in
            "0 3 * * *") B=diarios;;
            "0 4 * * *") B=justica_legislativo;;
            "0 5 * * *") B=plataformas_api;;
            "0 6 * * *") B=completude;;
            "0 7 * * *") B=opressores;;
            "0 9 * * *") B=relatorio;;
            "0 6 * * 0") B=empresas;;
            "30 6 1 * *") B=documentos;;
            *) B="${MOTORES_BLOCO_INPUT:-completo}";;
          esac
          [ -n "$MOTORES_FONTES" ] && B=manual
          echo "bloco=$B" >> "$GITHUB_OUTPUT"; echo "MOTORES_BLOCO=$B" >> "$GITHUB_ENV"
          echo "Bloco desta saída: $B"
      - name: Testes antes da coleta
        run: |
          # o resultado fica no repositório (estado/ultimo_teste_ci.txt) para
          # diagnóstico mesmo quando o log do Actions não é acessível
          set +e
          timeout 1200 python -m unittest discover -s tests -v > /tmp/testes.log 2>&1
          rc=$?
          { echo "commit: $GITHUB_SHA"; echo "em: $(date -u +%FT%TZ)"; echo "rc: $rc";
            tail -5 /tmp/testes.log; echo "---- falhas ----";
            grep -A30 -E "^(FAIL|ERROR):" /tmp/testes.log | head -300; } > estado/ultimo_teste_ci.txt
          # O PORTÃO SÓ FECHA PARA TESTE CRÍTICO (24/09). Antes, qualquer falha barrava a coleta
          # inteira: nos 20 dias anteriores, falhas de texto de painel, data fixa apodrecida e
          # um import de yaml impediram TODOS os motores de rodar na maioria dos dias. Agora a
          # coleta só para se falhar teste de privacidade, segredo, injeção de prompt ou data
          # inventada — o que põe em risco o que se publica. O resto fica registrado e avisado.
          if [ "$rc" != "0" ]; then
            CRIT=$(grep -E "^(FAIL|ERROR):" /tmp/testes.log | grep -iE "privacidade|segredo|token|injection|injecao|injeção|inventad" || true)
            if [ -n "$CRIT" ]; then echo "falha CRÍTICA — a coleta não roda:"; echo "$CRIT"; exit 1; fi
            echo "::warning::testes não críticos falharam (ver estado/ultimo_teste_ci.txt); a coleta segue"
          fi
          exit 0
      - name: Coletar, verificar, acionar Farol e publicar painel
        run: |
          if [ "$MOTORES_BLOCO" = "diarios" ] || [ "$MOTORES_BLOCO" = "completo" ] || [ "$MOTORES_BLOCO" = "manual" ]; then
            timeout 1500 python -m src.executar_diario || echo "executar_diario registrado com falha"
          fi
      - name: Carga de parlamentares (apenas em outubro e novembro)
        if: always()
        run: |
          MES=$(date -u +%m)
          if [ "$MES" = "10" ] || [ "$MES" = "11" ]; then
            timeout 900 python -m src.parlamentares || echo "carga de parlamentares falhou; area declara pendencia"
          else
            echo "Fora da janela de emendas (outubro/novembro) - carga nao executada." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Busca ativa de resultados, prorrogacoes e recursos
        if: always()
        run: python -m src.resultados || true

      - name: MOTORES DE BUSCA — coleta dos sensores (passo próprio, com log)
        if: always()
        run: |
          echo "bloco=$MOTORES_BLOCO" | tee estado/log_sensores.txt
          case "$MOTORES_BLOCO" in
            diarios|justica_legislativo|plataformas_api|opressores|manual|regulares|completo)
              timeout 1500 python -m src.sensores 2>&1 | tee -a estado/log_sensores.txt || echo "src.sensores: falhou ou estourou 1500s" | tee -a estado/log_sensores.txt
              ;;
            *)
              echo "bloco $MOTORES_BLOCO nao coleta sensores" | tee -a estado/log_sensores.txt
              ;;
          esac
          python -c "import json;e=json.load(open('estado/esquadra.json'));u=e.get('ultima_execucao',{});print('ultima_execucao:',u.get('em'),'bloco',u.get('bloco'),'sensores',u.get('sensores_executados'),'achados',u.get('achados'))" | tee -a estado/log_sensores.txt
      - name: Coleta dirigida dos editais do modo completo (documento na fonte oficial)
        if: always()
        run: |
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 900 python -m src.coleta_editais 2>&1 | tee estado/log_coleta_editais.txt || echo "coleta_editais: registrado" | tee -a estado/log_coleta_editais.txt
          fi
      - name: Dados do dashboard interativo
        if: always()
        run: |
          pip install pypdf --quiet pyyaml
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 900 python -m src.completude | tee completude.json
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.historico || echo "src.historico: encerrado no orçamento de 600s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.historico_parecer || echo "src.historico_parecer: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.confirmacao || echo "src.confirmacao: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 120 python -m src.destinacao || echo "destinacao: registrado"
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 180 python -m src.pertinencia || echo "pertinencia: registrado" || echo "src.destinacao: encerrado no orçamento de 120s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.emendas || echo 'emendas: registrado'
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.emendas_docs || echo 'emendas_docs: registrado'
          fi
          if [ "$MOTORES_BLOCO" = "opressores" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.opressores || echo "disjuntores: registrado"
          fi
          if [ "$MOTORES_BLOCO" = "plataformas_api" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.investigacao || echo "src.investigacao: encerrado no orçamento de 600s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.regramentos || echo "src.regramentos: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.previsao || echo 'previsao: registrado'
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -c "from src.janelas import verificar_por_sensor; verificar_por_sensor()" || echo "janelas: sem rede"
          fi
          timeout 600 python -m src.fontes260 || echo 'fontes260: registrado'
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 900 python -m src.edicao || echo "src.edicao: encerrado no orçamento de 900s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.completude_biblioteca || echo "src.completude_biblioteca: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.auditoria || echo "src.auditoria: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 300 python -m src.dossie_fontes || echo "src.dossie_fontes: encerrado no orçamento de 300s ou falhou — registrado"
          fi
          timeout 600 python -m src.motores || { echo "src.motores FALHOU — o monitor da Bússola não atualiza sem este passo" | tee -a estado/log_motores.txt; python -m src.motores 2>&1 | tail -20 >> estado/log_motores.txt; }
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 120 python -m src.parecer_prazos || echo "src.parecer_prazos: encerrado no orçamento de 120s ou falhou — registrado"
          fi
          timeout 600 python -m src.banco || echo 'banco: registrado'
          timeout 600 python -m src.biblioteca || echo 'biblioteca: registrado'
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.arquivamento || echo 'arquivamento: registrado'
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 900 python -m src.fluxo || echo "fluxo 4-5: sem editais completos"
          fi
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            echo "farol_parecer: fase 3 por rotina externa (agente Claude) — não roda no GitHub"
          fi
          timeout 600 python -m src.dashboard_dados | tee dash.json
          timeout 600 python -m src.banco || echo 'banco: registrado'
          pip install cryptography --quiet
          python scripts/acesso.py proteger || true
          {
            echo '## Dashboard interativo atualizado'
            echo 'Painel vivo: docs/dashboard.html (GitHub Pages ou local)'
            echo '```json'
            cat dash.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f dash.json
      - name: Documentos das associações (certidões mensais, registrados, dossiê e parecer)
        if: always()
        run: |
          pip install pypdf --quiet
          if [ "$MOTORES_BLOCO" = "documentos" ] || [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 600 python -m src.documentos || echo "documentos: registrado"
          fi
      - name: Enquadramento — parte determinística (fase 2 → aguarda a fase 3 externa; fase 4 segue)
        if: always()
        run: |
          if [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            timeout 900 python -m src.enquadramento || echo "enquadramento: registrado"
            timeout 300 python -m src.enquadramento fila || echo "fila de verificacao: registrado"
            timeout 300 python -m src.parametros_motores || echo "parametros dos motores: registrado"
            timeout 300 python -m src.fluxo_verificacao || echo "fluxo de verificacao: registrado"
            timeout 300 python -m src.auditoria_motores || echo "auditoria dos motores: registrada"
            timeout 600 python -m src.retroativo || echo "varredura retroativa: registrada"
            timeout 300 python -m src.achados_dia || echo "achados do dia: registrado"
            timeout 300 python -m src.empresas_rotas || echo "rotas de empresas: registradas"
            timeout 300 python -m src.finalidade_motores || echo "finalidade/recorrencia: registrada"
            timeout 300 python -m src.aprendizado_lexico || echo "lexico aprendido: registrado"
            timeout 600 python -m src.acervo_compacto construir || echo "acervo compacto: construido"
            timeout 300 python -m src.alerta_motores || echo "alerta dos motores: registrado"
            timeout 300 python -m src.pacote_desktop || echo "pacote do desktop: gerado"
          fi
      - name: Busca imediata de prazo por IA (chamamentos sem prazo confirmado)
        if: always()
        run: |
          if [ "$MOTORES_BLOCO" = "completude" ] || [ "$MOTORES_BLOCO" = "relatorio" ] || [ "$MOTORES_BLOCO" = "completo" ]; then
            echo "prazos_ia: fase 3 por rotina externa (agente Claude) — não roda no GitHub"
          fi
      - name: Motor de empresas com afinidade com o terceiro setor (por estado)
        if: always()
        run: |
          pip install pypdf --quiet
          echo "bloco=$MOTORES_BLOCO" > estado/log_empresas.txt
          if [ "$MOTORES_BLOCO" = "empresas" ]; then
            # SEMANAL (domingo 03h BRT): reavalia toda a base + agrega pelo menos 5 empresas novas
            # escolhidas por potencial, com histórico de 5 anos; parcerias declaradas em sites de
            # associações, Sebrae e entidades empresariais do estado. O log vai para o repositório.
            { timeout 2400 python -m src.empresas semanal GO; echo "rc_semanal=$?"; } 2>&1 | tail -c 30000 >> estado/log_empresas.txt
            { timeout 900 python -m src.patrocinios; echo "rc_patrocinios=$?"; } 2>&1 | tail -c 20000 >> estado/log_empresas.txt
          fi
      - name: Exportar o acervo do banco (volta pelo Git para a próxima saída)
        if: always()
        run: |
          python -c "from src.banco import exportar; import json; print(json.dumps(exportar(), ensure_ascii=False))" || echo "export: registrado"
      - name: Relatório de funcionamento do bloco
        if: always()
        run: |
          timeout 900 python -m src.relatorio_diario || echo "relatorio registrado com falha"
      - name: Rotas dos 260 pontos e cobertura do acervo
        if: always()
        run: |
          timeout 300 python -m src.rota_monitoramento || echo "src.rota_monitoramento: encerrado no orçamento de 300s ou falhou — registrado"
          python scripts/cobertura_catalogo.py
      - name: Relatorio de amplitude (canais, tokens, testes, padroes)
        if: always()
        run: |
          timeout 300 python -m src.relatorio_amplitude || echo "amplitude registrado com falha"
      - name: Resumo e decisão de alerta
        if: always()
        run: python -m src.resumo_execucao >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar somente alterações produzidas
        if: always()
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          # registra o produzido SEM perder nada, mesmo se a main avançou durante a saída:
          # commit local → rebase preferindo o que a saída produziu → push com até 3 tentativas
          # PROTEÇÃO DO PAINEL (22/09): docs/dashboard.html e os arquivos do Piloto são de autoria
          # do titular/Claude — o job de dados nunca os sobrescreve com a árvore que clonou no início.
          # PROTEÇÃO DE CÓDIGO (23/09): este job produz DADOS. Nenhuma linha de código é dele.
          # A árvore que ele clonou no início envelhece durante a execução, e ao commitar
          # levava junto versões velhas de src/, tests/ e do painel — foi assim que o
          # catálogo de leis sumiu do ranking e a coluna da destinação tributária ficou vazia.
          # Antes de commitar, tudo que é código volta a ser o da main.
          git checkout origin/main -- src tests scripts config docs/dashboard.html docs/mapa-brasil.js docs/mapa-arte.js .github 2>/dev/null || true
          git reset -q -- src tests scripts config docs/dashboard.html docs/mapa-brasil.js docs/mapa-arte.js .github 2>/dev/null || true
          git add biblioteca_alexandria -A dados estado docs
          git diff --cached --quiet && exit 0
          git commit -m "dados: varredura ${MOTORES_BLOCO:-completo} $(date -u +%F)"
          for i in 1 2 3; do
            # sem -X theirs: a cópia do job não pode vencer o que a main recebeu durante a
            # execução. Conflito em arquivo de dados resolve-se pela versão do job; em
            # qualquer outro, pela da main.
            if git pull --rebase origin main 2>/dev/null || \
               { for f in $(git diff --name-only --diff-filter=U); do
                   case "$f" in dados/*|estado/*|docs/dados/*|biblioteca_alexandria/*) git checkout --theirs -- "$f";;
                                *) git checkout --ours -- "$f";; esac; git add "$f"; done
                 GIT_EDITOR=true git rebase --continue; }; then
              if git push; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --soft origin/main
            # PROTEÇÃO (21/09): restaura do origin o que o Piloto/conselho gravaram enquanto este job rodava —
            # sem isto, a árvore antiga do job marcava esses arquivos como deletados (foi assim que o benchmark sumiu)
            for P in estado/piloto estado/ia_local config/piloto.json estado/rotas_sugeridas_ia.json estado/pacote_conselho.md estado/pacote_conselho.json docs/dados/piloto.json docs/dados/pacote_conselho.md; do
              git checkout origin/main -- "$P" 2>/dev/null || true
            done
            git add biblioteca_alexandria -A dados estado docs && git commit -m "dados: varredura ${MOTORES_BLOCO:-completo} $(date -u +%F) (reaplicada)" || true
            sleep 15
          done
          git push || echo "REGISTRO FALHOU apos 3 tentativas — os dados desta saida ficam no log"
      - name: Abrir issue quando houver alerta
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const caminho = 'estado/alerta.json';
            if (!fs.existsSync(caminho)) return;
            const alerta = JSON.parse(fs.readFileSync(caminho, 'utf8'));
            if (!alerta.abrir_issue) return;
            const {data} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'alerta-operacao'});
            if (data.some(i => i.title === alerta.titulo)) return;
            await github.rest.issues.create({...context.repo, title: alerta.titulo, body: alerta.corpo, labels: ['alerta-operacao']});

      - name: Abrir issue de prazos a vencer
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const caminho = 'estado/alerta_prazos.json';
            if (!fs.existsSync(caminho)) return;
            const alerta = JSON.parse(fs.readFileSync(caminho, 'utf8'));
            if (!alerta.abrir_issue) return;
            const {data} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'prazo'});
            if (data.some(i => i.title === alerta.titulo)) return;
            await github.rest.issues.create({...context.repo, title: alerta.titulo, body: alerta.corpo, labels: ['prazo']});
      - name: Acionar o Piloto quando houver edital novo (nivel 1 imediato)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOVOS=$(python - <<'PY'
          import json, pathlib
          e = json.load(open("estado/esquadra.json")) if pathlib.Path("estado/esquadra.json").exists() else {}
          print(int((e.get("ultima_execucao") or {}).get("novos_na_base") or 0))
          PY
          )
          echo "editais novos nesta saida: $NOVOS"
          if [ "${NOVOS:-0}" -gt 0 ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/piloto.yml/dispatches" \
              -d '{"ref":"main","inputs":{"modo":"ciclo"}}' -w "piloto acionado: %{http_code}\n"
          fi
