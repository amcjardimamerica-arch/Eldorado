name: 04 · Publicar painel Eldorado
on:
  schedule:
    - cron: "45 */6 * * *"   # a cada 6 horas: o monitor dos motores nunca fica mais de 6h defasado
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
