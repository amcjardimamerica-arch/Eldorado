name: TEMPORÁRIO · motor 04 — leitura real (removido antes do merge)
on:
  push:
    branches: ['claude/motor-04-pncp-v2']
    paths: ['.github/workflows/motor04-verificacao-temporaria.yml']
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt || true
      - name: Leitura real do motor 04
        run: |
          python3 - <<'PY'
          import json, sys, time, traceback
          sys.path.insert(0, ".")
          rel = {"em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          try:
              from src.pncp_osc import ler_motor, ESTADO
              r = ler_motor()
              rel["diagnostico"] = r.get("diagnostico"); rel["falhas"] = (r.get("falhas") or [])[:20]
              rel["achados"] = [{k: a.get(k) for k in ("id", "titulo", "url", "fim", "orgao", "fonte_nome", "data_publicacao", "documento_oficial", "pdf", "regime")} for a in (r.get("achados") or [])]
              try:
                  est = json.load(open(ESTADO)); rel["ultima"] = est.get("ultima")
              except Exception:
                  pass
              print(json.dumps(r.get("diagnostico"), ensure_ascii=False, indent=2, default=str)[:6000]); print(len(r.get("achados") or []), "oportunidades")
          except Exception:
              rel["erro"] = traceback.format_exc()[-3000:]; print(rel["erro"])
          json.dump(rel, open("/tmp/motor04_leitura_real.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - name: Guardar só o relatório (o estado do motor não é gravado)
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          git checkout -- . && git clean -fdq
          mkdir -p docs/relatorios && cp /tmp/motor04_leitura_real.json docs/relatorios/motor04_leitura_real_2026-10-02.json
          git add docs/relatorios/motor04_leitura_real_2026-10-02.json
          git commit -q -m "motor 04: relatorio da leitura real (verificacao antes do merge)"
          for i in 1 2 3 4; do git pull -q --rebase origin claude/motor-04-pncp-v2 && git push -q origin HEAD:claude/motor-04-pncp-v2 && break; sleep 4; done
