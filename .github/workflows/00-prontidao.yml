name: 00 · Verificar prontidão
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v
      - name: Resumo
        run: |
          echo "# Eldorado" >> "$GITHUB_STEP_SUMMARY"
          echo "Testes passaram. O monitoramento Eldorado está agendado para 6h de Brasília; o Farol é um segundo estágio separado." >> "$GITHUB_STEP_SUMMARY"
