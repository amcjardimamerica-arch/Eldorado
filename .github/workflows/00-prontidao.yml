name: 00 · Verificar prontidão
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependencia de verificacao de imagem (somente testes)
        run: pip install pillow --quiet
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verificar_privacidade.py
      - name: Resumo
        run: |
          echo "# Eldorado" >> "$GITHUB_STEP_SUMMARY"
          echo "Testes passaram. A sentinela é diária; a varredura profunda do Eldorado ocorre às segundas e quartas, às 6h de Brasília. O Farol é um segundo estágio condicionado." >> "$GITHUB_STEP_SUMMARY"
