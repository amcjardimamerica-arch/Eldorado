name: 00 · Verificar prontidão
# 27/09: rodava a CADA gravação (os Pilotos gravam a cada poucos minutos: centenas de execuções/dia, todas
# falhando e escondendo falha real). Agora: só quando código, testes, configuração ou workflows mudam, e 1×/dia.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 9 * * *"
  push:
    paths: ["src/**", "tests/**", "scripts/**", "config/**", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04   # 17/10: fixo (o ubuntu-latest vira Ubuntu 26 em 19/10)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: "Dependências do projeto (14/10 — sem o pypdf, todo PDF vinha sem texto e os testes do Cartório falhavam)"
        run: pip install -r requirements.txt pillow pyyaml --quiet   # pyyaml: os testes que conferem se todo fluxo é YAML válido
      # 17/10: a bateria roda numa CÓPIA temporária (scripts/testar.py) e nunca no checkout; a trava em tests/__init__.py
      # recusa rodar no repositório real. Quarentena preservada: o comando é o mesmo rodador de antes, dentro da cópia.
      - run: python scripts/testar.py --comando "python scripts/rodar_testes.py"   # 14/10: sem os módulos em quarentena
      - run: python scripts/verificar_privacidade.py
      - name: Resumo
        run: |
          echo "# Eldorado" >> "$GITHUB_STEP_SUMMARY"
          echo "Testes passaram. A sentinela é diária; a varredura profunda do Eldorado ocorre às segundas e quartas, às 6h de Brasília. O Farol é um segundo estágio condicionado." >> "$GITHUB_STEP_SUMMARY"
