name: 07 · Síndico — IA local da Biblioteca (benchmark e ciclos)
on:
  schedule:
    - cron: "0 */2 * * *"     # rede de segurança a cada 2h; o normal é o próprio Piloto encadear o voo seguinte
  workflow_dispatch:
    inputs:
      modo:
        description: "ciclo (o ocupante trabalha) | avaliar (mede um reserva e troca se for melhor) | benchmark (todos)"
        default: "ciclo"
      encadeado:
        description: "true quando o voo anterior chamou este (uso interno)"
        default: "false"
      candidato:
        description: "avaliar: id do reserva (qwen3-1.7b, llama-3.2-1b, gemma-2-2b, phi-3.5-mini)"
        default: "qwen3-1.7b"
      limite_gabarito:
        description: "quantos itens do gabarito (vazio = todos)"
        default: "120"
permissions:
  contents: write
  actions: write
concurrency:
  group: sindico
  cancel-in-progress: false
jobs:
  sindico:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # teto duro: UMA pesquisa por execução, nunca mais que 30 min
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependências
        run: pip install -q -r requirements.txt
      - name: Motor llama.cpp (17 MB, release fixa)
        run: |
          mkdir -p ia_local/motor ia_local/modelos
          curl -sL -o /tmp/l.tgz https://github.com/ggml-org/llama.cpp/releases/download/b11064/llama-b11064-bin-ubuntu-x64.tar.gz
          tar xzf /tmp/l.tgz -C /tmp && cp -r /tmp/llama-b11064/* ia_local/motor/
          echo "LLAMA_SERVER=$PWD/ia_local/motor/llama-server" >> $GITHUB_ENV
          ia_local/motor/llama-server --version 2>&1 | head -2
      - name: Modelo(s) — cache do Actions (10 GB por repositório)
        uses: actions/cache@v4
        with:
          path: ia_local/modelos
          key: modelos-gguf-v1-${{ hashFiles('config/sindico.json') }}
          restore-keys: modelos-gguf-v1-
      - name: Baixar modelos que faltam (curl -L, com retentativas; falha de um modelo não derruba o job)
        env:
          MODO: ${{ github.event.inputs.modo || 'ciclo' }}
          CANDIDATO: ${{ github.event.inputs.candidato }}
        run: |
          python - <<'PY' > /tmp/alvos.txt
          import json, os
          from src.sindico import CANDIDATOS
          cfg = json.load(open("config/sindico.json"))
          modo = os.environ.get("MODO", "ciclo")
          from src.cargo_sindico import cargo
          cg = cargo(); oc = cg["ocupante_atual"]
          if modo == "benchmark":
              alvo = CANDIDATOS
          elif modo == "avaliar":
              cid = os.environ.get("CANDIDATO") or ""
              res = [dict(r, arquivo=r.get("arquivo") or r["url"].split("/")[-1]) for r in cg["banco_de_reserva"] if r["id"] == cid]
              alvo = [oc] + res                      # o ocupante também, para a comparação ser justa
          else:
              alvo = [oc]                            # dia a dia: só o ocupante (2 GB)
          for c in alvo:
              print(c["arquivo"], c["url"])
          PY
          while read -r ARQ URL; do
            DEST="ia_local/modelos/$ARQ"
            if [ -s "$DEST" ] && [ "$(stat -c%s "$DEST")" -gt 500000000 ]; then echo "cache: $ARQ"; continue; fi
            echo "baixando $ARQ …"
            curl -L --retry 4 --retry-delay 10 --fail --silent --show-error -o "$DEST" "$URL" \
              && echo "  ok: $(du -h "$DEST" | cut -f1)" \
              || { echo "  FALHOU: $ARQ (HTTP/rede) — o benchmark marcará 'modelo não disponível'"; rm -f "$DEST"; }
          done < /tmp/alvos.txt
          ls -la ia_local/modelos/ || true
          df -h / | tail -1
      - name: Avaliar um reserva (troca o ocupante se for melhor)
        if: ${{ github.event.inputs.modo == 'avaliar' }}
        env:
          CANDIDATO: ${{ github.event.inputs.candidato }}
          LIMITE: ${{ github.event.inputs.limite_gabarito }}
        run: |
          timeout 12000 python -m src.cargo_sindico avaliar "$CANDIDATO" "${LIMITE:-120}" || echo "avaliação: registrado o que deu"
      - name: Benchmark de todos (só quando pedido)
        if: ${{ github.event.inputs.modo == 'benchmark' }}
        env:
          LIMITE: ${{ github.event.inputs.limite_gabarito }}
        run: |
          timeout 20000 python -m src.sindico benchmark $LIMITE || echo "benchmark: registrado o que deu"
      - name: Ciclo do síndico (entender → curar → afiar → minerar → anunciar)
        if: ${{ (github.event.inputs.modo || 'ciclo') == 'ciclo' }}
        run: |
          python - <<'PY'
          import json, subprocess, os, time, urllib.request, sys
          cfg = json.load(open("config/sindico.json"))
          from src.sindico import CANDIDATOS
          from src.cargo_sindico import ocupante
          c = ocupante()
          print("ocupante do cargo:", c["nome"], c["gb"], "GB")
          env = dict(os.environ, LD_LIBRARY_PATH=os.path.abspath("ia_local/motor"))
          srv = subprocess.Popen(["ia_local/motor/llama-server", "-m", f"ia_local/modelos/{c['arquivo']}", "--port", str(cfg.get("porta", 8081)),
                                  "--host", "127.0.0.1", "-c", "4096", "--jinja", "-t", str(os.cpu_count() or 4)], env=env)
          for _ in range(180):
              try:
                  if urllib.request.urlopen(f"http://127.0.0.1:{cfg.get('porta', 8081)}/health", timeout=2).status == 200: break
              except Exception: time.sleep(1)
          from src.sindico import ciclo
          print(json.dumps(ciclo(porta=cfg.get("porta", 8081)), ensure_ascii=False, indent=1))
          srv.kill()
          PY
      - name: Pousar 3 segundos e decolar de novo
        if: ${{ always() && (github.event.inputs.modo || 'ciclo') == 'ciclo' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O LUGAR DO PILOTO É NO AR. Cada voo é uma execução SEPARADA e curta (teto de 30 min).
          # Terminou, ele fica 3 segundos no pátio e decola de novo — não existe tarefa eterna
          # segurando um executor, o que estouraria o limite do GitHub. É uma corrente de voos curtos.
          if [ -f estado/piloto_pausado ]; then echo "pausado pelo titular — o Piloto fica em terra"; exit 0; fi
          VOOS=$(python - <<'PY'
          import json, pathlib, datetime
          p = pathlib.Path("estado/sindico/voos.json")
          d = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print(int(d.get(datetime.date.today().isoformat(), 0)))
          PY
          )
          TETO=$(python -c "import json;print(json.load(open('config/sindico.json')).get('voos_por_dia',40))" 2>/dev/null || echo 40)
          echo "voo ${VOOS} de ${TETO} hoje"
          if [ "${VOOS:-0}" -ge "${TETO:-40}" ]; then echo "teto do dia atingido — retoma amanhã"; exit 0; fi
          # nunca dois voos no ar ao mesmo tempo: se já há um na fila ou rodando, este não chama outro
          EMVOO=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sindico.yml/runs?per_page=12" \
            | python -c "import json,sys;print(sum(1 for r in (json.load(sys.stdin).get('workflow_runs') or []) if r.get('status') in ('queued','in_progress','waiting') and str(r.get('id'))!='${{ github.run_id }}'))")
          if [ "${EMVOO:-0}" -gt 0 ]; then echo "já há ${EMVOO} voo(s) no ar — este não chama outro"; exit 0; fi
          echo "3 segundos no pátio..."; sleep 3
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sindico.yml/dispatches" \
            -d '{"ref":"main","inputs":{"modo":"ciclo","encadeado":"true"}}' -w "decolou o próximo: %{http_code}\n"
      - name: Guardar o resultado como ARTEFATO (independe de push — nunca mais se perde)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindico-${{ github.run_id }}
          path: |
            estado/sindico/
            config/sindico.json
          retention-days: 90
      - name: Regenerar painel e commitar — a prova de conflito, os arquivos do Sindico mandam nos seus caminhos
        if: always()
        env:
          MODO: ${{ github.event.inputs.modo || 'ciclo' }}
        run: |
          timeout 300 python -m src.dashboard_dados || true
          # 1) guarda o que o Síndico produziu
          rm -rf /tmp/sind && mkdir -p /tmp/sind
          for P in estado/sindico config/sindico.json docs/dados/sindico.json estado/rotas_sugeridas_ia.json config/lexico_aprendido.json dados/editais/extraidos docs/dashboard-dados.js docs/dados; do
            [ -e "$P" ] && mkdir -p "/tmp/sind/$(dirname $P)" && cp -r "$P" "/tmp/sind/$P" || true
          done
          # 2) volta para o origin atual (sem rebase, sem conflito) e reaplica por cima
          git config user.name "sindico-eldorado" && git config user.email "sindico@eldorado"
          git fetch -q origin main && git reset -q --hard origin/main
          cp -r /tmp/sind/. .
          # PROTEÇÃO DO PAINEL: arquivos de autoria nunca são sobrescritos por job de dados
          git checkout origin/main -- docs/dashboard.html 2>/dev/null || true
          git add -A estado/sindico config/sindico.json docs/dados/sindico.json estado/rotas_sugeridas_ia.json config/lexico_aprendido.json dados/editais/extraidos docs/dashboard-dados.js docs/dados 2>/dev/null || git add -A
          git status --short | head -20
          git commit -q -m "sindico: $(date -u +%F) ${MODO:-ciclo}" || echo "nada a commitar"
          for i in 1 2 3; do git push -q origin main && break; echo "push $i falhou; recompondo…"; git fetch -q origin main; git reset -q --soft origin/main; cp -r /tmp/sind/. .; git add -A; git commit -q -m "sindico: $(date -u +%F) ${MODO:-ciclo}" || true; sleep 10; done
          git log --oneline -1
