name: 22 · Motores da vez — cada passagem calcula sozinha o que está pendente (agenda + maestro)
# 03/10/2026 (teste dos motores 01–21, conferido no GitHub pelo navegador do titular): a agenda e o maestro disparavam o
# fluxo 01 com a lista de motores no pedido. O fluxo 01 dura de 45 min a 1h50 e só admite UMA execução em espera:
# cada disparo novo cancelava o que esperava (20 execuções canceladas) e os motores daquele pedido nunca rodavam.
# Este fluxo é LEVE (só os motores, sem os testes e sem a coleta geral) e NÃO recebe lista: calcula no início, a
# partir do estado real (maestro: pendentes e parciais do dia; agenda: no horário ou com horário perdido; adiados da
# passagem anterior). Uma execução substituída não perde nada — a seguinte recalcula.
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
permissions:
  actions: write         # 15/10: o comando dispara a própria próxima passagem; 11/10: a sala lê as execuções
  contents: write
concurrency:
  group: eldorado-varredura-diaria     # o mesmo do fluxo 01: os dois gravam a esquadra, nunca ao mesmo tempo
  cancel-in-progress: false
jobs:
  motores:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 15/10: comando único (coleta + cadeia completa até o Farol); 03/10: a rotina semanal de empresas pode entrar aqui quando o domingo for pulado
    env:
      MOTORES_BLOCO: manual
      ELDORADO_PONTE_URL: ${{ secrets.ELDORADO_PONTE_URL }}
      ELDORADO_PONTE_CHAVE: ${{ secrets.ELDORADO_PONTE_CHAVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt pypdf || true
      - name: Comando · coleta (a rede neural decide, o maestro aciona, a rede avalia e reaciona)
        # 15/10/2026 (titular): maestro e rede neural são UMA coisa — src/comando.py. Decide quais motores e em que ordem
        # (necessidade + valor esperado), aciona, mede a completude, reaciona na mesma passagem e manda ao Chrome o que
        # só o Brasil/humano lê. Recibo em estado/comando/ciclo_atual.json.
        run: |
          set +e
          COMANDO_PRAZO_COLETA_S=1500 timeout 2100 python -m src.comando coleta 2>&1 | tail -c 6000
          echo "comando coleta: código ${PIPESTATUS[0]}"
      - name: Empresas — leitura DIÁRIA dos sites (patrocínio privado e incentivos), uma vez por dia
        if: always()
        run: |
          # 10/10 (titular): todo motor ativo lê diariamente. A base pesada do ICMS segue semanal (passo seguinte);
          # a leitura dos sites (patrocínio privado e empresas incentivadas) passa a ser diária.
          D=$(TZ=America/Sao_Paulo date +%F)
          if [ "$(cat estado/empresas_leitura_diaria.txt 2>/dev/null)" != "$D" ]; then
            { timeout 600 python -m src.patrocinios; echo "rc_patrocinios=$?"; } 2>&1 | tail -c 6000 > estado/log_empresas_diario.txt
            { MOTORES_FONTES=empresas-incentivadas SENSORES_PRAZO_S=600 timeout 660 python -m src.sensores; echo "rc_sites_icms=$?"; } 2>&1 | tail -c 6000 >> estado/log_empresas_diario.txt
            { timeout 300 python -m src.biblioteca_empresas; echo "rc_biblioteca=$?"; } 2>&1 | tail -c 4000 >> estado/log_empresas_diario.txt
            # 11/10 (titular): a página de empresas é ATUAL todos os dias — catálogo de incentivos, ranking de apoiadores,
            # dossiês, radar de captação e o painel de empresas (sem nova coleta na internet) passam a ser diários
            { timeout 300 python -m src.catalogo_incentivos >/dev/null; echo "rc_catalogo_incentivos=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas_diario.txt
            { timeout 300 python -m src.ranking_apoiadores >/dev/null; echo "rc_ranking_apoiadores=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas_diario.txt
            { timeout 300 python -m src.dossies >/dev/null; echo "rc_dossies=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas_diario.txt
            { timeout 300 python -m src.radar_piloto >/dev/null; echo "rc_radar=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas_diario.txt
            { timeout 300 python -m src.empresas painel GO; echo "rc_painel_empresas=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas_diario.txt
            echo "$D" > estado/empresas_leitura_diaria.txt
          fi
      - name: Empresas (motores 20 e 21) — só quando a rotina semanal venceu
        if: always()
        run: |
          # 03/10 (teste do motor 20): o domingo do fluxo 01 foi pulado em 27/09 e nada recuperava. Aqui roda UMA vez
          # quando a última rotina semanal tem mais de 7,5 dias; a passagem seguinte já a vê em dia.
          if [ "$(python scripts/empresas_devidas.py | tail -1)" = "sim" ]; then
            { timeout 1800 python -m src.empresas semanal GO; echo "rc_semanal=$?"; } 2>&1 | tail -c 20000 > estado/log_empresas.txt
            { timeout 300 python -m src.empresas painel GO; echo "rc_painel_empresas=$?"; } 2>&1 | tail -c 2000 >> estado/log_empresas.txt
            { timeout 600 python -m src.patrocinios; echo "rc_patrocinios=$?"; } 2>&1 | tail -c 8000 >> estado/log_empresas.txt
            { timeout 300 python -m src.biblioteca_empresas; timeout 300 python -m src.incentivos_empresas; echo "rc_incentivos=$?"; } 2>&1 | tail -c 8000 >> estado/log_empresas.txt
            # motor ÚNICO de incentivos (02/10): também os sites das maiores contribuintes do ICMS
            { MOTORES_FONTES=empresas-incentivadas SENSORES_PRAZO_S=840 timeout 900 python -m src.sensores; echo "rc_sites_icms=$?"; } 2>&1 | tail -c 8000 >> estado/log_empresas.txt
          else
            echo "empresas: rotina semanal em dia"
          fi
      - name: Histórico de 3 anos (motores 03, 11 e 18) — o que couber, do mais recente para o mais antigo
        if: always()
        run: |
          # 03/10 (titular): oportunidades abertas nos últimos 3 anos → livros para validação; encerradas → arquivo da
          # análise preditiva. Fracionado: cada passagem continua do cursor (estado/historico_3_anos/).
          timeout 960 python -m src.historico_3_anos dou judiciario-cnj plat-gife --minutos 4 2>&1 | tail -c 6000 || echo "histórico de 3 anos: registrado"
      - name: Comando · sequência (a rede direciona cada fase, com recibo e portão)
        if: always()
        # painel dos motores → treino da rede (se precisar) → biblioteca (1×/dia) → documento oficial → mapa (se houver
        # coleta nova) → fichas → legislativo → sala de controle → diagnóstico. Fase pulada fica registrada com o motivo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          timeout 3000 python -m src.comando sequencia 2>&1 | tail -c 4000
          echo "comando sequência: código ${PIPESTATUS[0]}"
      - name: Registrar somente alterações produzidas (só os arquivos deste fluxo, por cima do main mais recente)
        if: always()
        # 15/10/2026 (ciclo 5): a reaplicação antiga gravava a árvore inteira do job e podia apagar o que outro fluxo
        # gravou enquanto este rodava; agora só os arquivos alterados por ESTA passagem vão ao main atual
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          python scripts/gravar_somente_alterados.py salvar
          python scripts/gravar_somente_alterados.py aplicar "dados: motores da vez $(date -u +%F\ %H:%M)"
      - name: Comando · veredito (etapa com erro deixa o fluxo vermelho)
        if: always()
        run: python -m src.comando veredito
      - name: Comando · próxima passagem (premissa de 100% das informações do dia)
        # 15/10/2026 (análise do sistema, ciclo 3): o agendamento do GitHub descartou passagens (12:47 → nenhuma até 14:00)
        # e a cobertura parou em 4%. Enquanto a cobertura do dia não chega a 98%, o comando dispara a passagem seguinte.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COB=$(python -c "import json;d=json.load(open('docs/dados/maestro.json'));print(100 if d.get('dia_fechado') else (d.get('cobertura_percentual') or 0))" 2>/dev/null || echo 0)
          echo "cobertura do dia: $COB%"
          # 16/10/2026: o comando faz MAIS que a coleta (migrações, expurgo, Cartório, livros, índice) — roda sempre,
          # sem depender do horário do GitHub (às 15:13 o dia 'fechou' a 84% e nada mais rodou por 2 horas)
          if true; then
            curl -s -o /dev/null -w "próxima passagem disparada: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/motores-da-vez.yml/dispatches" -d '{"ref":"main"}'
          else
            echo "dia coberto — a próxima passagem fica com o horário"
          fi
