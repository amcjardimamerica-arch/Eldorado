name: TEMPORÁRIO · sondagem do Prosas (removido antes do merge)
on:
  push:
    branches: ['claude/prosas-unificado']
    paths: ['.github/workflows/prosas-sondagem-temporaria.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/sondar_prosas.py
      - name: Guardar
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          mkdir -p docs/relatorios && cp /tmp/sondagem_prosas.json docs/relatorios/prosas_sondagem_2026-10-02.json
          git add docs/relatorios/prosas_sondagem_2026-10-02.json && git commit -q -m "sondagem do Prosas"
          for i in 1 2 3; do git pull -q --rebase origin claude/prosas-unificado && git push -q origin HEAD:claude/prosas-unificado && break; sleep 4; done
