name: 36 · Análise do sistema (diagnóstico único e correção)

# 14/10/2026 (titular): quando a titular pede "Analise o sistema", o Claude dispara este fluxo. Ele roda o diagnóstico
# único (src/diagnostico_sistema.py) — sistemas, oportunidade por oportunidade (livro, validação, site, prazo, tela,
# ficha) e integração — e, com corrigir=sim, corrige em sequência (decisões → livros → repositório → tela → fichas →
# sala de controle → saúde) e diagnostica de novo. Resultado em estado/diagnostico_sistema.md e .json (backend).

on:
  workflow_dispatch:
    inputs:
      corrigir:
        description: "corrigir o que tiver correção automática"
        required: false
        default: "sim"
        type: choice
        options: [sim, nao]

permissions:
  contents: write
  actions: write       # 15/10/2026: interromper e retomar os demais fluxos durante a análise

concurrency:
  group: analise-sistema     # 14/10: grupo próprio — no do ciclo dos motores ela era substituída na fila e cancelada antes de começar
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 15/10: inclui a espera dos processos em andamento e a amostra de 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interromper os demais fluxos e aguardar os que estão rodando
        # 15/10/2026 (titular): a análise roda sozinha — nada regrava nem sobrescreve dados por cima dela
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pausa_analise.py interromper
          timeout 3000 python scripts/pausa_analise.py aguardar 45
      - name: Atualizar com o que os processos gravaram enquanto a análise aguardava
        # 15/10/2026 (ciclo 4): a análise lia a cópia do início (antes da passagem do comando gravar) e via dados velhos
        run: |
          cp estado/analise_pausa.json /tmp/pausa.json
          git fetch -q origin main && git reset -q --hard origin/main
          cp /tmp/pausa.json estado/analise_pausa.json
          git log -1 --format="dados atualizados até: %h %cI %s"
      - name: Testes da própria análise (procedimento assistido)
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          python scripts/pausa_analise.py testes
      - name: Diagnóstico (e correção)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORRIGIR: ${{ inputs.corrigir }}
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          if [ "$CORRIGIR" = "sim" ]; then timeout 1500 python -m src.diagnostico_sistema --corrigir --ciclo; else timeout 300 python -m src.diagnostico_sistema --ciclo; fi   # 15/10: cada "Analise o sistema" é um ciclo
          cat estado/diagnostico_sistema.md
      - name: Amostra de 20 oportunidades para a validação do Claude
        run: timeout 1500 python scripts/amostra_validacao.py 20 || echo "amostra incompleta"
      - name: Registrar (código sempre da main; conflito em dado resolve pela versão do job)
        run: |
          git config user.name "analise-sistema" && git config user.email "analise@eldorado"
          git fetch -q origin main
          git checkout origin/main -- src tests scripts config docs/dashboard.html .github 2>/dev/null || true
          git reset -q -- src tests scripts config docs/dashboard.html .github 2>/dev/null || true
          git add -A biblioteca_alexandria dados estado docs/dados 2>/dev/null || true
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          MSG="análise do sistema: diagnóstico$( [ "${{ inputs.corrigir }}" = "sim" ] && echo ' e correção') $(date -u +%F)"; git commit -q -m "$MSG"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main 2>/dev/null || \
               { for f in $(git diff --name-only --diff-filter=U); do
                   case "$f" in dados/*|estado/*|docs/dados/*|biblioteca_alexandria/*) git checkout --theirs -- "$f";;
                                *) git checkout --ours -- "$f";; esac; git add "$f"; done
                 GIT_EDITOR=true git rebase --continue; }; then
              git push -q && { echo "gravado ($i)"; exit 0; }
            fi
            git rebase --abort 2>/dev/null || true
            # reserva (como no monitoramento): parte da main mais nova e grava de novo só os dados do job
            git fetch -q origin main && git reset -q --mixed origin/main
            git checkout origin/main -- src tests scripts config docs/dashboard.html .github 2>/dev/null || true
            git add -A biblioteca_alexandria dados estado docs/dados 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "$MSG (reaplicada)"
            git push -q && { echo "gravado pela reserva ($i)"; exit 0; }     # 14/10: a reserva envia na hora (antes voltava ao conflito)
            sleep 15
          done
          echo "REGISTRO FALHOU após 6 tentativas"; exit 1
      - name: Retomar os fluxos interrompidos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pausa_analise.py retomar
          git config user.name "analise-sistema" && git config user.email "analise@eldorado"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/pausa_analise.py retomar >/dev/null 2>&1 || true
            git add estado/analise_pausa.json 2>/dev/null; git diff --cached --quiet && exit 0
            git commit -q -m "análise do sistema: fluxos retomados $(date -u +%F\ %H:%M)" && git push -q && exit 0; sleep 5
          done
