# O Eldorado rodando: de hora em hora (e quando acionado à mão).
# Cada execução parte do último banco gravado, reaplica os eventos pendentes (o gravador é idempotente), roda a
# passagem e grava de volta: os eventos novos sempre (texto, pequeno); o banco uma vez por dia ou quando acionado à mão
# (o Git guarda uma cópia inteira do binário a cada gravação: gravar a cada hora faria o repositório crescer centenas de
# MB por dia). Uma execução nunca atropela a outra.
name: Eldorado
on:
  schedule:
    - cron: "41 * * * *"   # minuto alterado em 22/10 para o GitHub registrar de novo o agendamento
  workflow_dispatch:
    inputs:
      gravar_banco:
        description: "Gravar o banco nesta execução"
        type: boolean
        default: true
      acionar_todos:
        description: "Acionar todos os motores agora (fora da agenda)"
        type: boolean
        default: false
concurrency:
  group: eldorado-sistema
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  passagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (versões fixadas)
        run: pip install -e ".[leitura,acesso,descoberta]"
      - name: Abrir os bancos (e aplicar as migrações do esquema)
        run: eldorado iniciar
      - name: Reaplicar os eventos pendentes
        run: eldorado aplicar
      - name: Passagem
        env:
          ELDORADO_FORCAR: ${{ inputs.acionar_todos && '1' || '0' }}
        run: eldorado executar workflows/passagem.toml
      - name: Aplicar os últimos eventos da passagem (o recibo do passo final e o fechamento)
        if: always()
        run: eldorado aplicar
      - name: Consolidar os bancos
        if: always()
        run: eldorado fechar
      - name: Gerar o painel (as visões e a página, em docs/, publicada pelo GitHub Pages)
        if: always()
        run: eldorado painel --saida docs
      - name: Gravar no repositório
        if: always()
        run: |
          git config user.name "Eldorado"
          git config user.email "eldorado@users.noreply.github.com"
          git add eventos/ docs/
          ultimo=$(git log -1 --format=%ct -- dados/ 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gravar_banco }}" = "true" ] || [ $(( $(date +%s) - ${ultimo:-0} )) -gt 72000 ]; then
            git add dados/
            echo "banco incluído (instantâneo)"
          fi
          if git diff --cached --quiet; then echo "nada a gravar"; exit 0; fi
          git commit -q -m "Eldorado: passagem de $(date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep $((i * 10)); done
          exit 1
