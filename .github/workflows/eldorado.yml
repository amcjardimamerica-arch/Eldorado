# O Eldorado em FUNCIONAMENTO PERMANENTE (titular, 22/10/2026): sem horário fixo, sem trabalho e descanso. Cada execução
# roda "eldorado permanente": uma passagem depois da outra enquanto houver fila (motores com leitura devida, livros
# esperando a rede neural); sem fila, espera só até a próxima ação prevista pelo Cérebro. Grava o trabalho a cada 30
# minutos (os eventos sempre; o banco uma vez por dia) e, perto do limite de 6 horas do GitHub, aciona a sua própria
# continuação, que retoma do ponto exato. Um vigia na Sala de controle do Eldorado0 religa a cadeia se ela parar.
name: Eldorado
on:
  workflow_dispatch:
    inputs:
      gravar_banco:
        description: "Gravar o banco nesta execução"
        type: boolean
        default: true
      acionar_todos:
        description: "Acionar todos os motores agora (fora da agenda)"
        type: boolean
        default: false
concurrency:
  group: eldorado-sistema
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  passagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 705
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (versões fixadas)
        run: bash scripts/instalar.sh
        timeout-minutes: 70
      - name: Abrir os bancos (e aplicar as migrações do esquema)
        run: eldorado iniciar
      - name: Reaplicar os eventos pendentes
        run: eldorado aplicar
      - name: IA local — o motor llama.cpp (versão fixada)
        continue-on-error: true
        run: |
          mkdir -p ia_local/motor ia_local/modelos
          URL=$(python3 -c "import tomllib;print(tomllib.load(open('config/ia_local.toml','rb'))['motor']['download'])")
          curl -sL --retry 3 -o /tmp/llama.tgz "$URL" && tar xzf /tmp/llama.tgz -C /tmp && cp -r /tmp/llama-*/* ia_local/motor/
          ls ia_local/motor | head -5
      - name: IA local — o modelo no cache do GitHub (chave fixa pelo nome do modelo)
        uses: actions/cache@v4
        with:
          path: ia_local/modelos
          key: modelos-gguf-Qwen3-8B-Q4_K_M
      - name: IA local — baixar o modelo pelos espelhos, se faltar
        continue-on-error: true
        run: |
          ARQ=$(python3 -c "import tomllib;print(tomllib.load(open('config/ia_local.toml','rb'))['modelo']['arquivo'])"); DEST="ia_local/modelos/$ARQ"
          if [ -s "$DEST" ] && [ "$(stat -c%s "$DEST")" -gt 1000000000 ]; then echo "no cache: $(du -h "$DEST" | cut -f1)"; exit 0; fi
          for U in $(python3 -c "import tomllib;print(' '.join(tomllib.load(open('config/ia_local.toml','rb'))['modelo']['espelhos']))"); do
            if curl -L --retry 3 --retry-delay 10 --fail --silent --show-error -o "$DEST" "$U"; then echo "baixado: $(du -h "$DEST" | cut -f1)"; exit 0; fi
            rm -f "$DEST"
          done
          echo "::warning::o modelo não foi baixado; os pilotos seguem sem IA"
      - name: IA local — subir o modelo (sem ele, os pilotos seguem sem IA; nada é simulado)
        continue-on-error: true
        run: |
          ARQ=$(python3 -c "import tomllib;print(tomllib.load(open('config/ia_local.toml','rb'))['modelo']['arquivo'])")
          [ -s "ia_local/modelos/$ARQ" ] || { echo "sem o modelo"; exit 0; }
          LD_LIBRARY_PATH=ia_local/motor nohup ia_local/motor/llama-server -m "ia_local/modelos/$ARQ" -c 8192 -t 3 --cache-type-k q8_0 --cache-type-v q8_0 --port 8082 --jinja --host 127.0.0.1 \
            > /tmp/llama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8082/health > /dev/null && { echo "modelo no ar em ${i}x2 s"; exit 0; }; sleep 2; done
          tail -20 /tmp/llama.log; echo "::warning::o modelo não respondeu; os pilotos seguem sem IA"
      - name: Funcionamento permanente (uma passagem depois da outra enquanto houver fila)
        env:
          ELDORADO_FORCAR: ${{ inputs.acionar_todos && '1' || '0' }}
          ELDORADO_IA_URL: http://127.0.0.1:8082
        run: eldorado permanente --limite-min 320 --gravar-min 30
      - name: Aplicar os últimos eventos da passagem (o recibo do passo final e o fechamento)
        if: always()
        run: eldorado aplicar
      - name: Consolidar os bancos
        if: always()
        run: eldorado fechar
      - name: Gravar no repositório
        if: always()
        run: bash scripts/gravar.sh "${{ inputs.gravar_banco }}"
      - name: Continuar (o funcionamento é permanente)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then echo "execução com falha: pausa de 5 minutos antes de continuar"; sleep 300; fi
          curl -s -o /dev/null -w "continuação acionada: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/eldorado.yml/dispatches" \
            -d '{"ref":"main","inputs":{"gravar_banco":"false","acionar_todos":"false"}}'
