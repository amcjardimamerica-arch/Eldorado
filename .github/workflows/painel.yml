# O painel (titular, 23/10/2026): a imagem atual do sistema. A página é a do Eldorado0 (o HTML, os scripts e as imagens,
# copiados para eldorado/base/painel/pagina/), mas NENHUM dado do Eldorado0: os dados são gerados do sistema novo
# (eldorado/base/painel/dados.py), a partir do banco da Biblioteca, dos motores e do estado do funcionamento; a seção sem
# dado no sistema fica vazia. Os eventos mais recentes são aplicados antes, para o site refletir o estado de agora.
# As gravações automáticas não acionam outros fluxos (regra do GitHub): o painel roda a cada 30 minutos e ao fim de cada
# execução do sistema.
name: Painel
on:
  workflow_run:
    workflows: ["Eldorado"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Os eventos mais recentes no banco (o estado de agora)
        run: eldorado aplicar
      - name: Gerar o site do sistema (nenhum dado do Eldorado0)
        run: |
          eldorado site --saida _site
          echo "site: $(find _site -type f | wc -l) arquivos, $(du -sh _site | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
