# Experimentar motor (orientação de criação, passo 8): roda o motor inteiro no GitHub, com a internet de verdade, e grava
# o que ele entregou e o relatório em testes/paginas/<motor>/experimento.json. Valida as cadeias que dependem de sessão
# (formulário com cookie e código), que a gravação simples de páginas não reproduz.
name: Experimentar motor
on:
  workflow_dispatch:
    inputs:
      motor:
        description: "O id do motor (ou vários, separados por espaço: um depois do outro)"
        required: true
permissions:
  contents: write
concurrency:
  group: gravar-paginas
jobs:
  experimentar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: "A instalação completa (scripts/instalar.sh, todas as ferramentas do plano)"
        run: bash scripts/instalar.sh
        timeout-minutes: 70
      - name: Experimentar
        env:
          MOTORES: ${{ inputs.motor }}
        run: |
          for m in $MOTORES; do
            echo "::group::$m"
            timeout 1500 eldorado motor experimentar "$m" --saida "testes/paginas/$m/experimento.json" | head -c 2000 || echo "o experimento de $m falhou ou passou de 25 minutos"
            echo "::endgroup::"
          done
      - name: Guardar no repositório
        run: |
          git config user.name "Eldorado"; git config user.email "eldorado@users.noreply.github.com"
          git add testes/paginas/
          git diff --cached --quiet && exit 0
          git commit -q -m "Experimento dos motores: ${{ inputs.motor }}"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0; sleep $((i * 10)); done
          exit 1
