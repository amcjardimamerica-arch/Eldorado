name: Estudo das IAs (parte 2)
# O arranjo decidido pela titular (uma IA do Comandante e uma dos pilotos, em paralelo) e as ferramentas de contexto.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: O motor e os modelos
        run: |
          mkdir -p ia_local/motor ia_local/modelos
          URL=$(python3 -c "import tomllib;print(tomllib.load(open('config/ia_local.toml','rb'))['motor']['download'])")
          curl -sL --retry 3 -o /tmp/llama.tgz "$URL" && tar xzf /tmp/llama.tgz -C /tmp && cp -r /tmp/llama-*/* ia_local/motor/
      - uses: actions/cache@v4
        with:
          path: ia_local/modelos
          key: modelos-gguf-Qwen3-8B-Q4_K_M
      - name: O 8B e o 0,6B (o rascunho da decodificação especulativa)
        run: |
          D=ia_local/modelos/Qwen3-8B-Q4_K_M.gguf; [ -s $D ] || for U in $(python3 -c "import tomllib;print(' '.join(tomllib.load(open('config/ia_local.toml','rb'))['modelo']['espelhos']))"); do curl -L --retry 3 --fail -s -o $D "$U" && break; done
          curl -L --retry 3 --fail -s -o /tmp/rascunho.gguf "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf" || curl -L --retry 3 --fail -s -o /tmp/rascunho.gguf "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"; ls -la /tmp/rascunho.gguf
      - name: "O arranjo decidido — a IA do Comandante (1 vaga) e a dos pilotos (2 vagas), com os núcleos divididos 1 + 3"
        run: |
          A=ia_local/modelos/Qwen3-8B-Q4_K_M.gguf; export LD_LIBRARY_PATH=ia_local/motor
          ia_local/motor/llama-server -m $A -c 8192 -np 1 -t 1 --cache-type-k q8_0 --cache-type-v q8_0 --port 9001 --host 127.0.0.1 > /tmp/c.log 2>&1 &
          ia_local/motor/llama-server -m $A -c 16384 -np 2 -t 3 --cache-type-k q8_0 --cache-type-v q8_0 --port 9002 --host 127.0.0.1 > /tmp/p.log 2>&1 &
          for p in 9001 9002; do for i in $(seq 1 120); do curl -sf http://127.0.0.1:$p/health >/dev/null && break; sleep 2; done; done
          python3 estudos/bench_ia2.py decidido "núcleos 1 + 3"; pkill -f llama-server; sleep 5
      - name: "O arranjo decidido — núcleos divididos 2 + 2"
        run: |
          A=ia_local/modelos/Qwen3-8B-Q4_K_M.gguf; export LD_LIBRARY_PATH=ia_local/motor
          ia_local/motor/llama-server -m $A -c 8192 -np 1 -t 2 --cache-type-k q8_0 --cache-type-v q8_0 --port 9001 --host 127.0.0.1 > /tmp/c.log 2>&1 &
          ia_local/motor/llama-server -m $A -c 16384 -np 2 -t 2 --cache-type-k q8_0 --cache-type-v q8_0 --port 9002 --host 127.0.0.1 > /tmp/p.log 2>&1 &
          for p in 9001 9002; do for i in $(seq 1 120); do curl -sf http://127.0.0.1:$p/health >/dev/null && break; sleep 2; done; done
          python3 estudos/bench_ia2.py decidido "núcleos 2 + 2"; pkill -f llama-server; sleep 5
      - name: "O reaproveitamento do contexto e a geração sem e com a decodificação especulativa"
        run: |
          A=ia_local/modelos/Qwen3-8B-Q4_K_M.gguf; export LD_LIBRARY_PATH=ia_local/motor
          ia_local/motor/llama-server -m $A -c 8192 -np 1 -t 3 --cache-type-k q8_0 --cache-type-v q8_0 --port 9001 --host 127.0.0.1 > /tmp/s.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:9001/health >/dev/null && break; sleep 2; done
          python3 estudos/bench_ia2.py contexto; python3 estudos/bench_ia2.py especulativa "sem rascunho"; pkill -f llama-server; sleep 5
          ia_local/motor/llama-server -m $A -md /tmp/rascunho.gguf --draft-max 8 --draft-min 2 -c 8192 -np 1 -t 3 --cache-type-k q8_0 --cache-type-v q8_0 --port 9001 --host 127.0.0.1 > /tmp/e.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:9001/health >/dev/null && break; sleep 2; done
          python3 estudos/bench_ia2.py especulativa "com o rascunho 0,6B" || tail -5 /tmp/e.log; pkill -f llama-server
