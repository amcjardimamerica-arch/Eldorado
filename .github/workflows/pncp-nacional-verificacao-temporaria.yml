name: TEMPORÁRIO · PNCP nacional — leitura real (removido antes do merge)
on:
  push:
    branches: ['claude/pncp-nacional']
    paths: ['.github/workflows/pncp-nacional-verificacao-temporaria.yml']
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt || true
      - name: Leitura real do PNCP no Brasil inteiro
        run: |
          python3 - <<'PY'
          import json, sys, time, traceback, collections
          sys.path.insert(0, ".")
          rel = {"em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          t0 = time.time()
          try:
              from src.pncp_osc import ler_motor
              r = ler_motor()
              rel["segundos"] = round(time.time() - t0)
              rel["diagnostico"] = r.get("diagnostico")
              rel["achados"] = [{k: a.get(k) for k in ("titulo", "url", "fim", "orgao", "uf", "territorio", "url_documento")} for a in (r.get("achados") or [])]
              rel["por_uf"] = dict(collections.Counter(a.get("uf") for a in r.get("achados") or []).most_common())
              print(json.dumps(r.get("diagnostico"), ensure_ascii=False, indent=1, default=str)[:5000]); print(len(r.get("achados") or []), "oportunidades em", rel["segundos"], "s")
          except Exception:
              rel["erro"] = traceback.format_exc()[-3000:]; print(rel["erro"])
          json.dump(rel, open("/tmp/pncp_nacional.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - name: Guardar só o relatório
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          git checkout -- . && git clean -fdq
          mkdir -p docs/relatorios && cp /tmp/pncp_nacional.json docs/relatorios/pncp_nacional_leitura_real_2026-10-02.json
          git add docs/relatorios/pncp_nacional_leitura_real_2026-10-02.json
          git commit -q -m "PNCP nacional: relatorio da leitura real (verificacao antes do merge)"
          for i in 1 2 3 4; do git pull -q --rebase origin claude/pncp-nacional && git push -q origin HEAD:claude/pncp-nacional && break; sleep 4; done
