name: 10 · Histórico de doações da Rouanet (empresa por empresa) — retoma sozinho até completar
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"        # a cada 6 h enquanto houver empresa sem histórico
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta-rouanet
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Coletar (95 min de orçamento; retoma de onde parou)
        run: python3 scripts/coleta_rouanet.py 95
      - name: Guardar na Biblioteca e no painel
        if: always()
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          git add biblioteca_alexandria/base/incentivos docs/dados/doadoras || true
          git commit -q -m "base: histórico de doações da Rouanet $(date -u +%F\ %H:%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push -q origin main && break; sleep 5; done
      - name: Se ainda falta, continua na próxima execução
        if: success()
        run: |
          python3 -c "import json;s=json.load(open('biblioteca_alexandria/base/incentivos/rouanet_status.json'));exit(0 if (s.get('b') or {}).get('completo') else 1)" && { echo "histórico completo"; exit 0; }
          curl -s -o /dev/null -w "continua: %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/coleta-rouanet.yml/dispatches" -d '{"ref":"main"}'
