name: 07 · Piloto — IA local da Biblioteca (benchmark e ciclos)
on:
  schedule:
    - cron: "0 */2 * * *"     # rede de segurança a cada 2h; o normal é o próprio Piloto encadear o voo seguinte
  workflow_dispatch:
    inputs:
      modo:
        description: "ciclo (o ocupante trabalha) | avaliar (mede um reserva e troca se for melhor) | benchmark (todos)"
        default: "ciclo"
      diagnostico:
        description: "true testa os buscadores a partir do servidor e para"
        default: "false"
      encadeado:
        description: "true quando o voo anterior chamou este (uso interno)"
        default: "false"
permissions:
  contents: write
  actions: write
concurrency:
  group: piloto
  cancel-in-progress: false
jobs:
  piloto:
    runs-on: ubuntu-latest
    # TETO POR MODO. Os 30 minutos foram desenhados para o VOO: uma pesquisa por execução,
    # para que nenhum voo monopolize o runner. O benchmark é outra coisa — cinco modelos
    # contra 120 itens em 4 CPUs — e em 23/09 foi cancelado no meio por esse mesmo teto,
    # depois de 30 minutos de trabalho perdidos. Cada modo passa a ter o seu.
    timeout-minutes: 30
    # (o comentário original) teto duro: UMA pesquisa por execução, nunca mais que 30 min
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependências
        run: pip install -q -r requirements.txt
      - name: Motor llama.cpp (17 MB, release fixa)
        run: |
          mkdir -p ia_local/motor ia_local/modelos
          curl -sL -o /tmp/l.tgz https://github.com/ggml-org/llama.cpp/releases/download/b11064/llama-b11064-bin-ubuntu-x64.tar.gz
          tar xzf /tmp/l.tgz -C /tmp && cp -r /tmp/llama-b11064/* ia_local/motor/
          echo "LLAMA_SERVER=$PWD/ia_local/motor/llama-server" >> $GITHUB_ENV
          ia_local/motor/llama-server --version 2>&1 | head -2
      - name: Modelo(s) — cache do Actions (10 GB por repositório)
        uses: actions/cache@v4
        with:
          path: ia_local/modelos
          key: modelos-gguf-v1-${{ hashFiles('config/piloto.json') }}
          restore-keys: modelos-gguf-v1-
      - name: SONDAR os enderecos dos GGUF (nao baixa; mede o cabecalho)
        if: ${{ github.event.inputs.modo == 'sondar' }}
        run: |
          # Uma requisicao de cabecalho por endereco: diz se o arquivo existe e o tamanho,
          # sem gastar os minutos de um download. E o que faltava em 23/09, quando a avaliacao
          # do Qwen3 morreu sem dizer se era URL errada, nome mudado na origem ou rede.
          mkdir -p estado/piloto
          echo "modelo	url	http	tamanho_bytes" > estado/piloto/sondagem_gguf.tsv
          python3 -c "import json;d=json.load(open('config/espelhos_gguf.json'))['espelhos'];[print(k+'	'+u) for k,us in d.items() for u in us]" > /tmp/urls.tsv
          while IFS=$'\t' read -r MOD URL; do
            [ -z "$URL" ] && continue
            R=$(curl -sIL --max-time 45 -o /dev/null -w "%{http_code}	%{size_download}	%{content_type}" "$URL" || echo "sem-resposta	0	-")
            COD=$(echo "$R" | cut -f1)
            LEN=$(curl -sIL --max-time 45 "$URL" 2>/dev/null | grep -i "^content-length:" | tail -1 | tr -d " \r" | cut -d: -f2)
            printf '%s\t%s\t%s\t%s\n' "$MOD" "$URL" "$COD" "${LEN:-0}" >> estado/piloto/sondagem_gguf.tsv
            echo "  $MOD  HTTP $COD  ${LEN:-0} bytes  $URL"
          done < /tmp/urls.tsv
          git config user.name "piloto" && git config user.email "piloto@eldorado"
          git add estado/piloto/sondagem_gguf.tsv
          git commit -q -m "sondagem dos enderecos GGUF $(date -u +%H:%M)" || true
          git pull --rebase -q origin main || true
          git push -q origin main || true
      - name: Baixar modelos que faltam (curl -L, com retentativas; falha de um modelo não derruba o job)
        env:
          MODO: ${{ github.event.inputs.modo || 'ciclo' }}
          CANDIDATO: ${{ github.event.inputs.candidato }}
        run: |
          python - <<'PY' > /tmp/alvos.txt
          import json, os
          from src.piloto import CANDIDATOS
          cfg = json.load(open("config/piloto.json"))
          modo = os.environ.get("MODO", "ciclo")
          from src.cargo_piloto import cargo
          cg = cargo(); oc = cg["ocupante_atual"]
          alvo = [oc]                                # só o ocupante: sem benchmark nem avaliação (titular, 24/09)
          # CARGO VAGO NÃO TEM ARQUIVO. Desde 23/09 o posto pode estar vago, e o ocupante
          # vira um registro sem url nem arquivo. Ler esses campos direto quebrava o passo
          # inteiro — o download falhava antes de tentar baixar coisa alguma, e a avaliação
          # do reserva morria junto, por um motivo que nada tinha a ver com ela.
          vistos = set()
          for c in alvo:
              u = (c or {}).get("url")
              if not u:
                  continue
              a = c.get("arquivo") or u.rsplit("/", 1)[-1]
              if a in vistos:
                  continue
              vistos.add(a)
              print(a, u)
          PY
          while read -r ARQ URL; do
            DEST="ia_local/modelos/$ARQ"
            if [ -s "$DEST" ] && [ "$(stat -c%s "$DEST")" -gt 500000000 ]; then echo "cache: $ARQ"; continue; fi
            echo "baixando $ARQ …"
            # ESPELHOS: se o endereço principal cair, tenta os outros antes de desistir.
            # Um endereço só é ponto único de falha — foi o que matou a avaliação do Qwen3.
            # DOIS BUGS MEUS, corrigidos: $ID não existia neste laço (que lê ARQ e URL), e a
            # cadeia com && devolvia erro justamente quando o PRIMEIRO endereço funcionava.
            MID=$(python3 -c "import json,sys,os;d=json.load(open('config/espelhos_gguf.json'))['espelhos'];a=sys.argv[1];print(next((k for k,us in d.items() if any(u.rsplit('/',1)[-1]==a for u in us)),''))" "$ARQ" 2>/dev/null || echo "")
            ESPELHOS=$(python3 -c "import json,sys;d=json.load(open('config/espelhos_gguf.json'))['espelhos'];print(' '.join(d.get(sys.argv[1],[])))" "$MID" 2>/dev/null || echo "")
            BAIXOU=""
            for U in "$URL" $ESPELHOS; do
              if [ -n "$BAIXOU" ]; then break; fi
              if curl -L --retry 3 --retry-delay 8 --fail --silent --show-error -o "$DEST" "$U"; then
                BAIXOU="$U"
                if [ "$U" != "$URL" ]; then echo "  (pelo espelho: $U)"; fi
              fi
            done
            [ -n "$BAIXOU" ] \
              && echo "  ok: $(du -h "$DEST" | cut -f1)" \
              || { COD=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 40 "$URL" || echo "sem-resposta"); mkdir -p estado/piloto; printf '%s\t%s\t%s\n' "$ARQ" "$COD" "$URL" >> estado/piloto/downloads_falhos.tsv; echo "  FALHOU: $ARQ — HTTP $COD em $URL"; rm -f "$DEST"; }
          done < /tmp/alvos.txt
          ls -la ia_local/modelos/ || true
          df -h / | tail -1
      - name: Diagnóstico dos buscadores (de onde o Piloto realmente está)
        if: ${{ github.event.inputs.diagnostico == 'true' }}
        run: |
          python - <<'PY'
          import json, pathlib
          from src.piloto_busca import diagnostico
          d = diagnostico()
          pathlib.Path("estado/piloto").mkdir(parents=True, exist_ok=True)
          pathlib.Path("estado/piloto/diagnostico_busca.json").write_text(json.dumps(d, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps(d, ensure_ascii=False, indent=1))
          PY
          git config user.name "piloto" && git config user.email "piloto@eldorado"
          git add estado/piloto/diagnostico_busca.json && git commit -q -m "piloto: diagnóstico dos buscadores" && git push -q origin main || true
      - name: BATIMENTO — avisar que o voo COMEÇOU, antes de decolar
        run: |
          # Sem isto o painel só sabia do voo quando ele terminava, e entre um commit e outro
          # dizia "em terra" com 16 voos no dia. Um sinal no início custa um commit leve e
          # torna o estado verdadeiro: quem olha vê o voo em curso, não o silêncio dele.
          python - <<'PY'
          import json, pathlib, datetime
          a = pathlib.Path("docs/dados/piloto_ao_vivo.json")
          d = json.loads(a.read_text(encoding="utf-8")) if a.exists() else {}
          agora = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          d.update({"estado": "em_voo", "frase": "voo em curso", "sinal_em": agora,
                    "decolou_em": agora, "minutos_sem_sinal": 0.0,
                    "missao_atual": {"tipo": "decolando", "motor": None, "inicio": agora, "ha_minutos": 0},
                    "batimento": "início do voo"})
          a.parent.mkdir(parents=True, exist_ok=True)
          a.write_text(json.dumps(d, ensure_ascii=False, indent=1), encoding="utf-8")
          PY
          git config user.name "piloto" && git config user.email "piloto@eldorado"
          git add docs/dados/piloto_ao_vivo.json
          git commit -q -m "piloto: decolou $(date -u +%H:%M)" && git push -q origin main || true
      - name: Ciclo do piloto (entender → curar → afiar → minerar → anunciar)
        env:
          GH_TOKEN: ${{ github.token }}   # posição ao vivo no ramo piloto-ao-vivo
          ELDORADO_VOO_REAL: "1"            # só o voo real conta no desempenho do ocupante
          BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        if: ${{ (github.event.inputs.modo || 'ciclo') == 'ciclo' }}
        run: |
          python - <<'PY'
          import json, subprocess, os, time, urllib.request, sys
          cfg = json.load(open("config/piloto.json"))
          from src.piloto import CANDIDATOS
          from src.cargo_piloto import ocupante
          c = ocupante()
          print("ocupante do cargo:", c["nome"], c["gb"], "GB")
          env = dict(os.environ, LD_LIBRARY_PATH=os.path.abspath("ia_local/motor"))
          srv = subprocess.Popen(["ia_local/motor/llama-server", "-m", f"ia_local/modelos/{c['arquivo']}", "--port", str(cfg.get("porta", 8081)),
                                  "--host", "127.0.0.1", "-c", "8192", "--jinja", "-t", str(os.cpu_count() or 4)], env=env)
          for _ in range(180):
              try:
                  if urllib.request.urlopen(f"http://127.0.0.1:{cfg.get('porta', 8081)}/health", timeout=2).status == 200: break
              except Exception: time.sleep(1)
          from src.piloto import ciclo
          import traceback
          # O ERRO FICA NO REPOSITÓRIO. Em 24/09 voos alternados quebravam no fechamento, depois
          # das missões, e o log do Actions não é legível de fora. O traceback vai para
          # estado/piloto/erro_do_voo.json, que o passo de commit leva junto.
          etapa = "ciclo"
          try:
              r = ciclo(porta=cfg.get("porta", 8081))
              etapa = "json.dumps do relatório"
              print(json.dumps(r, ensure_ascii=False, indent=1))
          except Exception:
              tb = traceback.format_exc()
              print(tb)
              os.makedirs("estado/piloto", exist_ok=True)
              json.dump({"em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "etapa": etapa,
                         "erro": tb[-6000:]}, open("estado/piloto/erro_do_voo.json", "w"),
                        ensure_ascii=False, indent=1)
              srv.kill()
              sys.exit(1)
          srv.kill()
          PY
      - name: Pousar 3 segundos e decolar de novo
        if: ${{ always() && (github.event.inputs.modo || 'ciclo') == 'ciclo' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O LUGAR DO PILOTO É NO AR. Cada voo é uma execução SEPARADA e curta (teto de 30 min).
          # Terminou, ele fica 3 segundos no pátio e decola de novo — não existe tarefa eterna
          # segurando um executor, o que estouraria o limite do GitHub. É uma corrente de voos curtos.
          if [ -f estado/piloto_pausado ]; then echo "pausado pelo titular — o Piloto fica em terra"; exit 0; fi
          # SEM TETO DIÁRIO (titular, 24/09): o Piloto voa o tempo todo. Cada voo é uma rotina nova e
          # independente; ao pousar, 3 segundos de pátio e decola de novo. O teto de 40 contava também as
          # execuções que falharam e, às 16h01 de 24/09, parou a corrente por 210 minutos.
          # nunca dois voos no ar ao mesmo tempo: se já há um na fila ou rodando, este não chama outro
          EMVOO=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/piloto.yml/runs?per_page=12" \
            | python -c "import json,sys;print(sum(1 for r in (json.load(sys.stdin).get('workflow_runs') or []) if r.get('status') in ('queued','in_progress','waiting') and str(r.get('id'))!='${{ github.run_id }}'))")
          if [ "${EMVOO:-0}" -gt 0 ]; then echo "já há ${EMVOO} voo(s) no ar — este não chama outro"; exit 0; fi
          echo "3 segundos no pátio..."; sleep 3
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/piloto.yml/dispatches" \
            -d '{"ref":"main","inputs":{"modo":"ciclo","encadeado":"true"}}' -w "decolou o próximo: %{http_code}\n"
      - name: Guardar o resultado como ARTEFATO (independe de push — nunca mais se perde)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-${{ github.run_id }}
          path: |
            estado/piloto/
            config/piloto.json
          retention-days: 90
      - name: Regenerar painel e commitar — a prova de conflito, os arquivos do Piloto mandam nos seus caminhos
        if: always()
        env:
          MODO: ${{ github.event.inputs.modo || 'ciclo' }}
        run: |
          timeout 300 python -m src.dashboard_dados || true
          # 1) guarda o que o Piloto produziu
          BASE_DO_VOO=$(git rev-parse HEAD)          # onde a cópia do voo começou
          rm -rf /tmp/sind && mkdir -p /tmp/sind
          for P in estado/piloto docs/dados/piloto.json estado/rotas_sugeridas_ia.json config/lexico_aprendido.json dados/editais/extraidos docs/dashboard-dados.js docs/dados; do
            # cp -r PASTA DESTINO copia PARA DENTRO quando o destino ja existe (gerava docs/dados/dados).
            # Com diretorio, copiamos o CONTEUDO; com arquivo, o arquivo.
            if [ -d "$P" ]; then mkdir -p "/tmp/sind/$P" && cp -r "$P/." "/tmp/sind/$P/" || true
            elif [ -e "$P" ]; then mkdir -p "/tmp/sind/$(dirname $P)" && cp "$P" "/tmp/sind/$P" || true; fi
          done
          # 2) volta para o origin atual (sem rebase, sem conflito) e reaplica por cima
          git config user.name "piloto-eldorado" && git config user.email "piloto@eldorado"
          git fetch -q origin main && git reset -q --hard origin/main
          # O QUE FOI APAGADO NA MAIN DURANTE O VOO CONTINUA APAGADO (24/09). A cópia do voo ainda
          # tinha arquivos que a limpeza apagou enquanto ele voava; o 'cp -r' os devolvia — foi assim
          # que as avaliações de ensaio e as empresas fictícias voltaram. Tira-se da cópia guardada
          # tudo o que a main apagou desde o começo do voo, antes de reaplicar. --no-renames: renomear é apagar
          # o nome velho — sem isso o git chama de 'renomeado' e o nome velho voltava (25/09, 406 arquivos).
          git diff --no-renames --name-only --diff-filter=D "$BASE_DO_VOO" origin/main | while read -r f; do rm -f "/tmp/sind/$f"; done
          cp -r /tmp/sind/. .
          # PROTEÇÃO DO PAINEL: arquivos de autoria nunca são sobrescritos por job de dados
          git checkout origin/main -- docs/dashboard.html 2>/dev/null || true
          # PROTEGER O ORCAMENTO: teto_minutos e o encadeamento sao decisao do titular,
          # nao estado de execucao — o voo nao pode reescreve-los.
          python - <<'PY' || true
          import json, subprocess
          orig = json.loads(subprocess.run(["git","show","origin/main:config/piloto.json"],capture_output=True,text=True).stdout or "{}")
          try: atual = json.load(open("config/piloto.json"))
          except Exception: atual = {}
          for c in ("orcamento","encadeamento","regra","motor_de_inferencia"):
              if c in orig: atual[c] = orig[c]
          json.dump(atual, open("config/piloto.json","w"), ensure_ascii=False, indent=1)
          PY
          git add -A estado/piloto docs/dados/piloto.json estado/rotas_sugeridas_ia.json config/lexico_aprendido.json dados/editais/extraidos docs/dashboard-dados.js docs/dados 2>/dev/null || git add -A
          git status --short | head -20
          git commit -q -m "piloto: $(date -u +%F) ${MODO:-ciclo}" || echo "nada a commitar"
          for i in 1 2 3; do git push -q origin main && break; echo "push $i falhou; recompondo…"; git fetch -q origin main; git reset -q --soft origin/main; cp -r /tmp/sind/. .; git add -A; git commit -q -m "piloto: $(date -u +%F) ${MODO:-ciclo}" || true; sleep 10; done
          git log --oneline -1
