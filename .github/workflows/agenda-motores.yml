name: 08 · Agenda dos motores — cada motor na hora em que sua fonte publica
# Roda aos minutos :23 e :53, nunca na virada da hora (quando o GitHub atrasa e descarta
# execuções agendadas). Dispara a coleta só com os motores da vez (config/agenda_motores.json).
on:
  # 15/10/2026 (titular): a agenda foi incorporada ao comando único (src/comando.py): todo motor é lido todo dia; este fluxo fica só para disparo manual
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  agenda:
    runs-on: ubuntu-24.04   # 17/10: fixo (o ubuntu-latest vira Ubuntu 26 em 19/10)
    steps:
      - uses: actions/checkout@v4
      - name: Motores da vez
        run: |
          IDS=$(python3 scripts/agenda_motores.py)
          echo "motores da vez: ${IDS:-nenhum}"
          if [ -n "$IDS" ]; then
            curl -s -o /dev/null -w "coleta disparada: %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/motores-da-vez.yml/dispatches" \
              -d '{"ref":"main"}'
            # 03/10: dispara o fluxo 22 SEM lista — ele calcula os motores da vez sozinho; disparar o fluxo 01 com a lista
            # perdia os motores quando o pedido em espera era substituído (20 execuções canceladas)
          fi
