name: TEMPORÁRIO · motor estadual — primeira leitura (removido antes do merge)
on:
  push:
    branches: ['claude/motor-estaduais-go']
    paths: ['.github/workflows/estaduais-go-primeira-leitura.yml']
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt || true
      - name: Primeira leitura (mapeamento, histórico de 5 anos, oportunidades)
        env:
          ESTADUAIS_SEM_LIVROS: "1"
        run: |
          python3 - <<'PY'
          import json, sys, time, traceback
          sys.path.insert(0, ".")
          rel = {"em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          try:
              from src.estaduais_go import ler_motor
              r = ler_motor(orcamento=2700)
              rel["diagnostico"] = r["diagnostico"]; rel["achados"] = [{k: a.get(k) for k in ("titulo", "url", "fim", "orgao", "data_publicacao")} for a in r["achados"]]
              print(json.dumps(r["diagnostico"], ensure_ascii=False, indent=1, default=str)[:4000]); print(len(r["achados"]), "aberta(s)")
          except Exception:
              rel["erro"] = traceback.format_exc()[-3000:]; print(rel["erro"])
          json.dump(rel, open("/tmp/estaduais_rel.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - name: Guardar o mapeamento, o histórico e o relatório no ramo
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          mkdir -p /tmp/g && cp estado/estaduais_go.json docs/dados/estaduais_go.json /tmp/g/ 2>/dev/null || true
          git checkout -- . && git clean -fdq
          mkdir -p estado docs/dados docs/relatorios
          cp /tmp/g/estaduais_go.json estado/estaduais_go.json 2>/dev/null || true
          [ -e /tmp/g/estaduais_go.json ] && python3 -c "import shutil; shutil.copy('/tmp/g/estaduais_go.json','estado/estaduais_go.json')"
          cp /tmp/estaduais_rel.json docs/relatorios/estaduais_go_primeira_leitura_2026-10-02.json
          python3 -c "import sys; sys.path.insert(0,'.'); from src.estaduais_go import painel; print(painel())" || true
          git add estado/estaduais_go.json docs/dados/estaduais_go.json docs/relatorios/estaduais_go_primeira_leitura_2026-10-02.json 2>/dev/null || true
          git commit -q -m "motor estadual: primeira leitura (mapeamento e historico de 5 anos)" || true
          for i in 1 2 3 4; do git pull -q --rebase origin claude/motor-estaduais-go && git push -q origin HEAD:claude/motor-estaduais-go && break; sleep 4; done
