name: 34 · Motores de empresas (semanal, com recuperação)

# 12/10/2026 (conselho): os motores Incentivos Fiscais (motor-gife) e Patrocínio Privado (motor-patrocinio) rodavam no
# bloco "empresas" do monitoramento diário, aos domingos. Esse fluxo divide o grupo de concorrência com o ciclo dos
# motores (a cada 30 min) e o GitHub guarda uma só execução esperando por grupo: o domingo era substituído antes de
# começar (11/10) e não havia recuperação. Aqui: grupo próprio e verificação diária — roda quando a leitura semanal
# está vencida (7 dias ou mais), recuperando um domingo perdido.

on:
  schedule:
    - cron: "23 6 * * *"     # 03h23 em Brasília, todos os dias (só roda se a leitura semanal venceu)
  workflow_dispatch:
    inputs:
      forcar:
        description: "rodar mesmo sem vencimento"
        required: false
        default: "nao"
        type: choice
        options: [nao, sim]

permissions:
  contents: write

concurrency:
  group: motores-empresas
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leitura semanal vencida?
        id: vence
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          S = json.load(open("docs/dados/status_motores.json")).get("motores") or []
          ult = [m.get("ultima_leitura") for m in S if m.get("id") in ("motor-gife", "motor-patrocinio")]
          def h(v):
              try: return (datetime.now(timezone.utc) - datetime.fromisoformat(str(v).replace("Z", "+00:00"))).total_seconds() / 3600
              except Exception: return 9999
          idade = min((h(v) for v in ult), default=9999)
          vence = os.environ.get("FORCAR") == "sim" or idade >= 7 * 24 - 6
          print(f"rodar={'sim' if vence else 'nao'}")
          print(f"idade_h={int(idade)}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Motores de empresas (mesmos passos do antigo bloco de domingo)
        if: steps.vence.outputs.rodar == 'sim'
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip install pypdf --quiet
          echo "bloco=empresas (fluxo 34)" > estado/log_empresas.txt
          { timeout 2400 python -m src.empresas semanal GO; echo "rc_semanal=$?"; } 2>&1 | tail -c 30000 >> estado/log_empresas.txt
          { timeout 900 python -m src.patrocinios; echo "rc_patrocinios=$?"; } 2>&1 | tail -c 20000 >> estado/log_empresas.txt
          { timeout 300 python -m src.biblioteca_empresas; timeout 300 python -m src.incentivos_empresas; echo "rc_incentivos=$?"; } 2>&1 | tail -c 20000 >> estado/log_empresas.txt
          { MOTORES_FONTES=empresas-incentivadas SENSORES_PRAZO_S=840 timeout 900 python -m src.sensores; echo "rc_sites_icms=$?"; } 2>&1 | tail -c 8000 >> estado/log_empresas.txt
          grep -o "rc_[a-z_]*=[0-9]*" estado/log_empresas.txt || true
      - name: Registrar (código sempre da main; conflito em dado resolve pela versão do job)
        if: steps.vence.outputs.rodar == 'sim'
        run: |
          git config user.name "motores-empresas" && git config user.email "empresas@eldorado"
          git fetch -q origin main
          git checkout origin/main -- src tests scripts config docs/dashboard.html .github 2>/dev/null || true
          git reset -q -- src tests scripts config docs/dashboard.html .github 2>/dev/null || true
          git add -A biblioteca_alexandria dados estado docs/dados 2>/dev/null || true
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          git commit -q -m "empresas: leitura semanal $(date -u +%F) (fluxo 34)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main 2>/dev/null || \
               { for f in $(git diff --name-only --diff-filter=U); do
                   case "$f" in dados/*|estado/*|docs/dados/*|biblioteca_alexandria/*|go/*) git checkout --theirs -- "$f";;
                                *) git checkout --ours -- "$f";; esac; git add "$f"; done
                 GIT_EDITOR=true git rebase --continue; }; then
              git push -q && { echo "gravado ($i)"; exit 0; }
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "REGISTRO FALHOU após 4 tentativas"; exit 1
