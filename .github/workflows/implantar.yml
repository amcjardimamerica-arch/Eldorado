name: Implantar (parar, implantar e religar)
# A regra R09 da titular (25/10/2026, a segunda forma): nunca o meio-termo. Ou o sistema AGUARDA os processos em andamento
# terminarem e GRAVA tudo, ou PARA e PERDE tudo o que estava em andamento; ao religar, RECOMEÇA DO ZERO (nada de uma
# passagem pela metade é gravado nem reaplicado).
#   1. o pedido de implantação: o ciclo o vê em até 2 minutos, termina a passagem em andamento, os pilotos concluem o
#      livro ou a missão atual, grava tudo e para;
#   2. a espera, até 45 minutos;
#   3. passado o limite, a parada à força: a passagem cortada não é gravada (a gravação só envia passagens concluídas);
#   4. religa com o código novo (se o próprio ciclo ainda não se religou) e republica o painel.
# Uma implantação nunca cancela a outra: a mais nova espera na fila.
on:
  push:
    branches: [main]
    paths: ["eldorado/**", "config/**", "workflows/**", "scripts/**", "skills/**", "pyproject.toml", ".github/workflows/eldorado.yml"]
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: implantar
  cancel-in-progress: false
jobs:
  implantar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: 0. O ciclo em funcionamento já tem este código? (então não há o que implantar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 29/10/2026: a implantação pedia a parada de um ciclo que JÁ tinha o código (religado com a versão mais nova);
          # o ciclo ignorava o pedido e a implantação esperava os 45 min inteiros, prendendo a fila (os vereditos e a Sala
          # não entravam). Se todo ciclo em funcionamento contém este código, nada a fazer.
          vivos=$(gh run list -R "$GITHUB_REPOSITORY" -w eldorado.yml --json headSha,status -q '.[] | select(.status!="completed") | .headSha')
          ja=sim; [ -z "$vivos" ] && ja=nao
          for h in $vivos; do
            s=$(gh api "repos/$GITHUB_REPOSITORY/compare/${GITHUB_SHA}...${h}" -q .status 2>/dev/null || echo erro)
            case "$s" in ahead|identical) ;; *) ja=nao;; esac
          done
          echo "JA_TEM=$ja" >> "$GITHUB_ENV"
          [ "$ja" = sim ] && echo "::notice::o ciclo em funcionamento já tem ${GITHUB_SHA::7}: nada a implantar (sem pedido, sem espera, sem parada)" || true
      - name: 1. O pedido de implantação (o ciclo termina a passagem, grava e para)
        if: env.JA_TEM != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Eldorado"; git config user.email "eldorado@users.noreply.github.com"
          echo "PARADOS=$(gh run list -R "$GITHUB_REPOSITORY" -w eldorado.yml --json databaseId,status -q '.[] | select(.status!="completed") | .databaseId' | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "PEDIDO_EM=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p implantar; echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > implantar/pedido.txt
          git add implantar/pedido.txt; git commit -q -m "Pedido de implantação ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin main && break; sleep $((i * 5)); done
      - name: 2. Aguardar os processos terminarem e gravarem (até 45 minutos)
        if: env.JA_TEM != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vivo() { for id in $PARADOS; do [ "$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status -q .status)" != "completed" ] && return 0; done; return 1; }
          for i in $(seq 1 90); do vivo || { echo "o ciclo terminou os processos, gravou e parou"; echo "FORCADA=nao" >> "$GITHUB_ENV"; exit 0; }; sleep 30; done
          echo "FORCADA=sim" >> "$GITHUB_ENV"; echo "::warning::o ciclo não terminou em 45 minutos: parada à força (a passagem em andamento se perde inteira)"
      - name: 3. A parada à força, se o limite passou (a passagem cortada não é gravada)
        if: env.FORCADA == 'sim' && env.JA_TEM != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $PARADOS; do gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true; done
          for i in $(seq 1 40); do n=0; for id in $PARADOS; do [ "$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status -q .status)" != "completed" ] && n=1; done; [ $n = 0 ] && break; sleep 15; done
      - name: 4. Religar do zero com o código novo
        if: env.JA_TEM != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          novos=$(gh run list -R "$GITHUB_REPOSITORY" -w eldorado.yml --json createdAt,status -q "[.[] | select(.createdAt > \"$PEDIDO_EM\") | select(.status!=\"completed\")] | length")
          if [ "$novos" = "0" ]; then gh workflow run eldorado.yml -R "$GITHUB_REPOSITORY" --ref main -f gravar_banco=false -f acionar_todos=false && echo "religado com ${GITHUB_SHA::7}"
          else echo "o ciclo já se religou com o código novo ($novos)"; fi
      - name: 5. Republicar o painel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run painel.yml -R "$GITHUB_REPOSITORY" --ref main && echo "painel republicado"
