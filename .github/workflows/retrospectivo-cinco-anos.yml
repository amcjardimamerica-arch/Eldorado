name: 03 · Eldorado — carga histórica de cinco anos (mês a mês)
on:
  schedule:
    - cron: "35 9 * * 0" # domingos 06:35 America/Sao_Paulo, até concluir todas as janelas
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eldorado-repo-writes
  cancel-in-progress: false
jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Consumir janelas mensais pendentes (PNCP + Querido Diário + domínios)
        run: |
          python -m src.retrospectivo | tee retro.json
          echo '## Carga histórica' >> "$GITHUB_STEP_SUMMARY"
          tail -40 retro.json >> "$GITHUB_STEP_SUMMARY"
          rm -f retro.json
      - name: Dossiês, aprendizado e painel
        run: |
          python -m src.dossies
          python -m src.aprendizado
          python -m src.painel
      - name: Versionar resultados
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A dados estado docs
          git diff --cached --quiet && exit 0
          git commit -m "dados: carga histórica mensal $(date -u +%F)"
          git push
