name: 05 · Busca ativa (a cada 3 dias)

on:
  # sem agendamento (27/09): cancelada por tempo em 8 execuções seguidas; o Piloto - Interceptador faz esse trabalho
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldorado-escrita
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 15/10: estourava 25 min e era cancelado; a busca tem teto interno de 20 min
    # 02/10 (titular): sem IA Claude nos fluxos do GitHub — a chave FAROL_AI_API_KEY não é mais passada
    # 03/10: o "env:" vazio deixava o arquivo INVÁLIDO para o GitHub (falha a cada push desde 02/10)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Busca ativa dos indícios (órgão publicador + IA econômica)
        run: |
          pip install pypdf --quiet
          # 15/10/2026 (ciclo 6): o job estourava 50 min (passos sem limite) e era cancelado sem gravar; cada passo tem teto
          BUSCA_ATIVA_SEGUNDOS=1080 timeout 1260 python -m src.busca_ativa | tee busca.json || echo "busca: parou no teto"
          timeout 420 python -m src.completude | tee completude.json || echo "completude: parou no teto"
          { timeout 360 python -m src.alternativas && timeout 180 python -c "from src.alternativas import run_localizacao; print(run_localizacao())"; } || echo "alternativas: registrado"
          timeout 240 python -m src.dashboard_dados | tee dash.json || echo "painel: parou no teto"
      - name: Registrar
        if: always()          # 15/10: o trabalho parcial nunca se perde; só os arquivos deste fluxo, por cima do main atual
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          python scripts/gravar_somente_alterados.py salvar
          python scripts/gravar_somente_alterados.py aplicar "busca ativa: $(date -u +%F\ %H:%M)"
