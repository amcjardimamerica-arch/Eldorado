name: 15 · Sondagem dos agregadores de editais
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sondar
        run: python3 scripts/sondar_agregadores.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          cp biblioteca_alexandria/base/sondagem_agregadores.json /tmp/s.json 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p biblioteca_alexandria/base && cp /tmp/s.json biblioteca_alexandria/base/sondagem_agregadores.json
            git add biblioteca_alexandria/base/sondagem_agregadores.json
            git commit -q -m "sondagem dos agregadores de editais $(date -u +%F\ %H:%M)" || break
            git push -q origin main && break; sleep 5
          done
