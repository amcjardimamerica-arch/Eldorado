name: 21 · Status dos motores (a cada 6 horas)
# Titular, 01/10/2026: a cada 6 horas, a data da última leitura e o status de cada motor, com três luzes —
# verde (coletou hoje), vermelho (erro ou falha na coleta), cinza (não rodou). Antes, dispara os motores cuja leitura
# do dia ficou pendente, para o painel refletir o dia real.
on:
  schedule:
    - cron: "47 10,14,19 * * *"      # 02/10 itinerário: maestro depois de cada janela — 07h47, 11h47 e 16h47 em Brasília
    - cron: "17 1 * * *"             # e 22h17 em Brasília (fechamento do dia)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: status-motores
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt || true
      - name: Disparar os motores com leitura do dia pendente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 02/10: o MAESTRO (rede neural) mede a cobertura do dia de cada motor e dispara de novo os pendentes e os
          # parciais (até 3 vezes por dia) — a busca do dia não fica parcial. Inclui os pendentes da agenda.
          IDS=$(python3 -m src.maestro --ids 2>/dev/null | tail -1 || true)   # 03/10: só consulta; quem conta a tentativa é o fluxo 22
          echo "pendentes: ${IDS:-nenhum}"
          if [ -n "$IDS" ]; then
            curl -s -o /dev/null -w "monitoramento disparado: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/motores-da-vez.yml/dispatches" \
              -d '{"ref":"main"}'   # 03/10: o fluxo 22 recalcula os pendentes sozinho
          fi
      - name: Regenerar o painel dos motores e o status
        run: |
          timeout 120 python -m src.previsao_livros || echo "previsão dos livros falhou"   # 02/10: ativação 30 dias antes
          timeout 120 python -m src.chaves_livros || echo "chaves dos livros falharam"     # 02/10: léxico temporário de 30 dias
          timeout 300 python -c "import src.motores as M; M.run()" || echo "gerador dos motores falhou"
          python -m src.status_motores
      - name: Gravar
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          mkdir -p /tmp/st && cp docs/dados/status_motores.json docs/dados/motores.json /tmp/st/ && cp docs/dados/previsao_livros.json /tmp/st/ 2>/dev/null || true; cp estado/lexico_temporario_livros.json /tmp/st/ 2>/dev/null || true; cp docs/dados/maestro.json /tmp/st/ 2>/dev/null || true; mkdir -p /tmp/st/maestro && cp estado/maestro/*.json /tmp/st/maestro/ 2>/dev/null || true; cp docs/dados/relatorio_etapas.json /tmp/st/ 2>/dev/null || true; mkdir -p /tmp/st/rel && cp docs/relatorios/maestro/*.md /tmp/st/rel/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/st/status_motores.json /tmp/st/motores.json docs/dados/; cp /tmp/st/previsao_livros.json docs/dados/ 2>/dev/null || true; mkdir -p estado/maestro; cp /tmp/st/lexico_temporario_livros.json estado/ 2>/dev/null || true; cp /tmp/st/maestro.json docs/dados/ 2>/dev/null || true; cp /tmp/st/maestro/*.json estado/maestro/ 2>/dev/null || true; cp /tmp/st/relatorio_etapas.json docs/dados/ 2>/dev/null || true; mkdir -p docs/relatorios/maestro && cp /tmp/st/rel/*.md docs/relatorios/maestro/ 2>/dev/null || true
            git add docs/dados/status_motores.json docs/dados/motores.json; [ -e docs/dados/previsao_livros.json ] && git add docs/dados/previsao_livros.json; [ -e estado/lexico_temporario_livros.json ] && git add estado/lexico_temporario_livros.json; git add docs/dados/maestro.json estado/maestro docs/dados/relatorio_etapas.json docs/relatorios/maestro 2>/dev/null || true
            git commit -q -m "status dos motores (a cada 6 horas)" || break
            git push -q origin HEAD:main && break
            sleep 6
          done
