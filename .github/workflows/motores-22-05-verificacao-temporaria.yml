name: TEMPORÁRIO · motores GIFE e Câmara — leitura real (removido antes do merge)
on:
  push:
    branches: ['claude/motores-22-gife-e-05-camara']
    paths: ['.github/workflows/motores-22-05-verificacao-temporaria.yml']
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt || true
      - name: Leitura real dos dois motores
        run: |
          python3 - <<'PY'
          import json, sys, time, traceback, importlib
          sys.path.insert(0, ".")
          rel = {"em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          for nome, mod in (("gife", "src.gife_editais"), ("camara", "src.camara_goiania")):
              t0 = time.time()
              try:
                  M = importlib.import_module(mod); r = M.ler_motor()
                  est = {}
                  try: est = json.load(open(M.ESTADO))
                  except Exception: pass
                  rel[nome] = {"segundos": round(time.time() - t0), "pulado_exige_brasil": r.get("pulado_exige_brasil"), "diagnostico": r.get("diagnostico"),
                               "falhas": (r.get("falhas") or [])[:10],
                               "achados": [{k: a.get(k) for k in ("titulo", "url", "fim", "orgao", "data_publicacao")} for a in (r.get("achados") or [])],
                               "estado_resumo": {k: (v if not isinstance(v, (list, dict)) else (v if len(json.dumps(v, default=str)) < 1500 else f"{type(v).__name__} ({len(v)})")) for k, v in est.items()}}
                  print(nome, json.dumps(r.get("diagnostico"), ensure_ascii=False, default=str)[:2500]); print(len(r.get("achados") or []), "achado(s)")
              except Exception:
                  rel[nome] = {"erro": traceback.format_exc()[-2500:]}; print(nome, rel[nome]["erro"])
          json.dump(rel, open("/tmp/m22_05.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - name: Guardar só o relatório
        run: |
          git config user.name "eldorado-bot" && git config user.email "bot@eldorado"
          git checkout -- . && git clean -fdq
          mkdir -p docs/relatorios && cp /tmp/m22_05.json docs/relatorios/motores_22_05_leitura_real_2026-10-02.json
          git add docs/relatorios/motores_22_05_leitura_real_2026-10-02.json
          git commit -q -m "motores GIFE e Camara: relatorio da leitura real (verificacao antes do merge)"
          for i in 1 2 3 4; do git pull -q --rebase origin claude/motores-22-gife-e-05-camara && git push -q origin HEAD:claude/motores-22-gife-e-05-camara && break; sleep 4; done
