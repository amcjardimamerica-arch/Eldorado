# Qualidade: a cada gravação, instala as dependências fixadas, roda o verificador e a bateria inteira.
name: Qualidade

on:
  push:
    paths-ignore: ["dados/**", "eventos/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: false   # 25/10/2026: a bateria completa leva mais de 20 min; cancelar a em andamento deixava sem resultado

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 25/10/2026: com as bibliotecas da produção, a instalação e a bateria passam de 20 min (a execução era encerrada como "cancelada")
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar (versões fixadas)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testes,leitura,acesso,descoberta]" "ruff==0.16.10" "pytest-timeout==2.4.0"
          # as mesmas bibliotecas da produção (25/10/2026: a qualidade instalava só uma parte, e os testes do Comandante,
          # do idioma e das datas falhavam aqui sem falhar na produção)
          pip install -q uv && python scripts/instalar_bibliotecas.py
      - name: Verificador
        run: ruff check eldorado testes
      - name: Bateria
        # cada teste que falhar vira uma anotação (25/10/2026: o registro detalhado não é lido de fora; a anotação é)
        run: |
          set -o pipefail
          # 26/10/2026: um teste que trava não pode mais esconder a bateria inteira atrás do limite de 1 h (desde 25/10 toda
          # Qualidade terminava "cancelada"): cada teste tem 4 minutos; o que travar falha com o ponto onde parou
          pytest -q -p no:cacheprovider -rfE --timeout=240 --timeout-method=signal --durations=15 2>&1 | tee /tmp/bateria.txt && exit 0
          s=$?
          set +e +o pipefail   # 26/10/2026: o filtro que não acha nada encerrava o passo antes de anotar
          grep -E "^(FAILED|ERROR)[ :]" /tmp/bateria.txt | head -25 | while read -r l; do echo "::error title=teste::${l:0:900}"; done
          grep -E "^E  " /tmp/bateria.txt | head -15 | while read -r l; do echo "::warning title=detalhe::${l:0:600}"; done
          grep -E "Timeout|^  File .*testes/" /tmp/bateria.txt | head -20 | while read -r l; do echo "::warning title=parou em::${l:0:600}"; done
          grep -E "^[0-9.]+s (call|setup)" /tmp/bateria.txt | head -15 | while read -r l; do echo "::notice title=lento::${l:0:300}"; done
          tail -12 /tmp/bateria.txt | while read -r l; do [ -n "$l" ] && echo "::warning title=fim da bateria::${l:0:500}"; done
          exit $s
