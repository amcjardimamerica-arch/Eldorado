name: 41 · Diagnóstico da ponte Brasil

# 15/10/2026 (titular): a ponte funciona? Compara ponte × acesso direto da nuvem nos portais que passam por ela.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELDORADO_PONTE_URL: ${{ secrets.ELDORADO_PONTE_URL }}
      ELDORADO_PONTE_CHAVE: ${{ secrets.ELDORADO_PONTE_CHAVE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnosticar
        run: timeout 600 python scripts/diagnostico_ponte.py
      - name: Gravar (só o diagnóstico)
        run: |
          git config user.name "diagnostico-ponte" && git config user.email "ponte@eldorado"
          cp estado/ponte/diagnostico.json /tmp/d.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p estado/ponte && cp /tmp/d.json estado/ponte/diagnostico.json
            git add estado/ponte/diagnostico.json
            git diff --cached --quiet && exit 0
            git commit -q -m "diagnóstico da ponte $(date -u +%F)" && git push -q && exit 0
            sleep 5
          done
