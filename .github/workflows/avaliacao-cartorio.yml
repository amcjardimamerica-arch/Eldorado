name: 39 · Avaliação do Cartório com gabarito

# 15/10/2026 (titular): baixa os documentos dos casos já comprovados por leitura humana, roda a extração atual e mede
# o acerto de cada um dos 12 itens, com onde e por que cada um falha. Grava só os arquivos da avaliação.

on:
  schedule:
    - cron: "41 9 * * 1"     # segunda, 06h41 em Brasília (depois do treino dos motores)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avaliacao-cartorio
  cancel-in-progress: false

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências (as mesmas do Cartório)
        run: pip install -q -r requirements.txt
      - name: Baixar e medir
        run: timeout 3000 python scripts/avaliar_cartorio.py --baixar --medir --segundos 2700 --rotulo "fluxo 39"
      - name: Gravar a avaliação (só estes arquivos)
        run: |
          git config user.name "avaliacao-cartorio" && git config user.email "avaliacao@eldorado"
          mkdir -p /tmp/a && cp -r biblioteca_alexandria/livros/anexos/cartorio_avaliacao /tmp/a/ && cp docs/relatorios/avaliacao-cartorio-*.md /tmp/a/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p estado/cartorio docs/relatorios && cp -r /tmp/a/avaliacao estado/cartorio/ && cp /tmp/a/*.md docs/relatorios/ 2>/dev/null || true
            git add biblioteca_alexandria/livros/anexos/cartorio_avaliacao docs/relatorios/avaliacao-cartorio-*.md 2>/dev/null || true
            git diff --cached --quiet && { echo "nada mudou"; exit 0; }
            git commit -q -m "avaliação do Cartório com gabarito $(date -u +%F)" && git push -q && { echo "gravado ($i)"; exit 0; }
            sleep 5
          done
