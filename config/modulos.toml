# Os módulos ligados. Cada motor é um arquivo de configuração do motor genérico (eldorado/motores/canal/config/).
# O registro confere o contrato de cada um antes de aceitá-lo. O estado de cada motor fica em dados/motores/.

[[modulo]]
classe = "eldorado.motores.canal.motor:MotorCanal"
parametros = { configuracao = "eldorado/motores/canal/config/dou.toml", dados = "dados/motores" }

