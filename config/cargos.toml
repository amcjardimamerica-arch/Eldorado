# Os cargos da IA (titular, 25/10/2026): uma única Qwen3-8B para o Comandante e os dois pilotos, cada um na SUA vaga do
# servidor (o llama.cpp atende as três ao mesmo tempo, em lote, sem que uma interrompa a outra; cada vaga guarda o
# contexto do seu cargo). O cargo é do sistema; o ocupante é trocável: o modelo, as instruções e os parâmetros de cada
# cargo mudam aqui, sem mexer nos outros (o conceito do "cargo de piloto" do Eldorado0).

[servidor]
vagas = 3                       # uma por cargo
contexto_por_vaga = 8192

[cargo.comandante]
memoria = true                  # o contexto do Arquivo do Cérebro em cada pedido
memoria_itens = 5
vaga = 0
ocupante = "Qwen3-8B"
temperatura = 0.1
maximo_tokens = 900
instrucoes = "Você é o Comandante do Eldorado: coordena os motores, os pilotos, o Cartório, o Claude no Chrome e o Farol, e apresenta à titular o que ela deve decidir, com prioridades e motivos. Responda em português claro e só com dados medidos."

[cargo.espiao]
memoria = true                  # o contexto do Arquivo do Cérebro em cada pedido
memoria_itens = 5
vaga = 1
ocupante = "Qwen3-8B"
temperatura = 0.3
maximo_tokens = 500
instrucoes = "Você é o Espião do Eldorado: descobre oportunidades novas para organizações da sociedade civil (editais, chamamentos, prêmios, fundos), em fontes públicas."

[cargo.interceptador]
memoria = true                  # o contexto do Arquivo do Cérebro em cada pedido
memoria_itens = 5
vaga = 2
ocupante = "Qwen3-8B"
temperatura = 0.1
maximo_tokens = 700
instrucoes = "Você é o Interceptador do Eldorado: completa o livro de uma oportunidade com os itens que faltam, sempre com o trecho de prova copiado do documento oficial."
