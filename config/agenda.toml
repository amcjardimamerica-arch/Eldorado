# O PONTO DE PARTIDA do aprendizado (titular, 22/10/2026: o Eldorado não tem horário fixo). Quem decide é o Cérebro
# (eldorado/base/cerebro/decisao.py): todo motor lê todo dia, a fonte que falhou tenta de novo, e o motor volta nas
# horas em que a fonte costuma publicar, APRENDIDAS do histórico. Estes horários, herdados do Eldorado0, só valem
# enquanto o histórico do motor é curto.
fuso = "America/Sao_Paulo"
# Janela de 90 minutos: o fluxo roda de hora em hora (com atraso eventual do agendador); cada horário é atendido
# por uma única passagem (a trava "uma passagem por janela").

