# SITUAÇÃO (sondagem de 22/10/2026, a partir do GitHub): a API está fora do ar do lado da fonte. O endereço
# queridodiario.ok.org.br/api responde erro 500 até na consulta mais simples (só o código de Goiânia), e
# api.queridodiario.ok.org.br não completa a conexão segura (TLS). O motor segue tentando e volta sozinho com a API.
#
# Querido Diário: os diários oficiais municipais de Goiânia, Aparecida de Goiânia e das capitais (a regra de território
# inclui as capitais dos outros estados). Lição de 10/10: em Goiás, só Goiânia e Aparecida têm busca.
[motor]
id = "querido-diario"
nome = "Querido Diário — diários municipais de Goiânia, Aparecida e das capitais"
categoria = "Diários oficiais"
finalidade = "chamamentos e editais municipais de Goiânia, Aparecida de Goiânia e das capitais"
canal = "api"

[[fonte]]
# Como o motor do Eldorado0 que funcionava: o país inteiro, sem lista de municípios; o portão aplica a regra do
# território (município de outro estado só fica se for capital).
nome = "Querido Diário — busca nos diários"
url = "{base}/gazettes?querystring={consulta}&published_since={hoje-5:%Y-%m-%d}&published_until={hoje:%Y-%m-%d}&excerpt_size=500&number_of_excerpts=1&size=50"
tipo = "api"

[fonte.valores]
# A API respondeu erro 500 em 22/10: tenta os dois endereços que o Eldorado0 usava e a consulta com e sem aspas.
base = ["https://queridodiario.ok.org.br/api", "https://api.queridodiario.ok.org.br"]
consulta = ["chamamento%20p%C3%BAblico%20organiza%C3%A7%C3%B5es%20da%20sociedade%20civil", "termo%20de%20fomento%20chamamento", "%22chamamento%20p%C3%BAblico%22%20%22organiza%C3%A7%C3%B5es%20da%20sociedade%20civil%22", "%22edital%20de%20chamamento%20p%C3%BAblico%22%20associa%C3%A7%C3%A3o", "%22termo%20de%20execu%C3%A7%C3%A3o%20cultural%22", "%22edital%20de%20premia%C3%A7%C3%A3o%22%20cultura", "%22termo%20de%20fomento%22%20%22chamamento%20p%C3%BAblico%22"]

[fonte.caminhos]
itens = "gazettes[*]"
titulo = "join('', [territory_name || '', ' (', state_code || '', '): ', excerpts[0] || ''])"
link = "url"
data = "date"
resumo = "excerpts[0]"
municipio = "territory_name"
uf = "state_code"
nivel = "'municipal'"

[acesso]
degraus = ["api", "leve"]

[leitura]
documentos = false                  # o diário inteiro tem centenas de atos: a certificação lê o ato, na Fase 8
