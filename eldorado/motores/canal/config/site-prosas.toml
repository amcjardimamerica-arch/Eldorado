[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 36, grupo «Sites de divulgação — terceiro setor»; reúne site-mapa-osc", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): prosas.com.br/editais (e ?natureza=premio) redireciona para a página comercial produtos.prosas.com.br; a lista pública está em /selecao/widgets/listagem-editais; o Mapa das OSC só incorpora esse widget (fusão site-mapa-osc → site-prosas confirmada; decisão da titular, R19).", "08/11/2026 (parecer): 2 de 3 erros fora da abrangência (editais municipais de SP na vitrine nacional): regra territorial e idade (a lida na página) na entrada; o prazo vencido do título também sai. O acesso continua pelos caminhos decididos pela titular (o robots.txt proíbe robôs).", "Acesso por navegador que não denuncia robôs (skill do canivete): a escada começa no degrau 4, o Patchright (um Chromium real, sem as marcas de automação), e tem o degrau 5, o Camoufox (um Firefox anti-detecção), como reserva; a página é lida depois que os scripts montam a lista (rede ociosa). O robots.txt é informação (regra da titular): a espera que ele pede vira o intervalo do domínio.", "O Prosas carrega os editais por script: precisa do degrau de navegador (o extra navegador). Ele também replica e tem editais próprios (a origem é decidida por livro); a lista pública aparece pelo CapitaAI e pelo Observatório.", "2 fonte(s) abrem a página e não acham nada: verificar contra as publicações conhecidas; candidatas ao teste do copiloto de IA.", "O que este portal mostra é pista: a fonte oficial é confirmada na Certificação (regra da titular, 18/10).", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []", "08/11/2026 (parecer): a ficha de uma OSC (\"Associacao Dos Imigrantes De Santa Catarina - Aisc\") virava livro: o nome de entidade sem edital/chamada/prêmio sai pelo título; regra territorial e idade na entrada. O widget do Prosas é lido aqui e no site-prosas (o Cartório une o mesmo título, R22). DECISÃO PENDENTE DA TITULAR (R19): fundir este motor no site-prosas, como o parecer recomenda.", "Os editais do Mapa das OSC vêm do quadro do Prosas (iframe prosas.com.br/selecao/widgets/listagem-editais), em parceria; sem script, o quadro vem vazio.", "A página de editais do Mapa das OSC carrega a lista por script: a leitura direta traz pouco; o robots proíbe robôs (informação).", "Rota de acesso única para os domínios com bloqueio (mapaosc.ipea.gov.br): ponte pelo Brasil, navegador do titular ou espelho.", "Os 1 alvos são vigiados só na janela prevista da próxima edição."]
