# Prefeituras das 25 maiores cidades de Goiás — portais de editais — criado pela orientação eldorado/motores/skills/criar-motor/SKILL.md (a partir do estudo da titular, 19/10/2026).
# Rotas candidatas comentadas: só entra a que respondeu na sondagem (eldorado sondar).

[motor]
uf = "GO"
canal = "portal"
id = "prefeituras-50-go"
nome = "Prefeituras das 25 maiores cidades de Goiás — portais de editais"
categoria = "Executivo — diários e portais do governo"
categoria_estudo = "EXE"
finalidade = "encontrar nos portais das 25 maiores prefeituras de Goiás os editais, chamamentos e programas abertos a OSC (cultura, esporte, assistência, conselhos e fundos municipais)"
