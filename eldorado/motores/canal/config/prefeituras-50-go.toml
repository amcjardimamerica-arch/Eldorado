[lexico]
# o léxico próprio dos portais municipais, calibrado com os títulos reais da sondagem de 23/10/2026:
termos = ["re:chamamento|chamada p[uú]blica|credenciamento .{0,30}(entidades|organiza|osc|institui|oficin|artistas|agentes culturais|projetos|espa[çc]os culturais|cultur)|termo de (fomento|colabora)|aldir blanc|pnab|paulo gustavo|cmdca|\\bfia\\b|fundo municipal|subven[çc]|pr[êe]mio .{0,50}(cultur|arte|projeto|inscri|edital|osc|entidade|associa)|(edital|inscri[çc][õo]es|sele[çc][ãa]o) .{0,60}pr[êe]mio|premia[çc][ãa]o (de |para )?(projetos|iniciativas|agentes|artistas|cultur)|patroc[ií]n|sele[çc][ãa]o (p[uú]blica|de (projetos|propostas|organiza|entidades|artistas))|(lan[çc]a|abre|publica)\\w* (o |os )?edita|inscri[çc][õo]es abertas|edital (de|n[ºo°.]|para|do|da)"]
vetos = ["re:resultado|homologa|inexigibilidade|dispensa|extrato|lista de (inscri|inscritos|classifica)|inscritos|habilita[çc][ãa]o documental|concurso p[uú]blico|processo seletivo|contrata[çc][ãa]o tempor|convoca[çc][ãa]o|vacina|regulariza[çc][ãa]o fundi|permiss[ãa]o de uso|barracas|atividades comerciais|moradias|empresas que constru|licita[çc]|preg[ãa]o|audi[êe]ncia p[uú]blica|sess[ãa]o ordin|reuni[ãa]o|curso gratuito|aulas|matr[ií]cula|vagas|agentes de combate|sorteio|notifica[çc][ãa]o de lan[çc]amento|tabela de temporalidade|\\b(aluno|alunos|alunas|estudante|escola municipal|escola estadual|servidor|servidora)s?\\b|conquista|vence\\b|vencedor|pontua[çc][ãa]o t[ée]cnica|recebe(u)? (o )?pr[êe]mio|ganha(dor)?\\b|agrinho|infosfera|elimina[çc][ãa]o de documentos|cita[çc][ãa]o|\\bconcurso\\b|chamada p[uú]blica escolar|matr[íi]cula|ingresso na rede|transa[çc][ãa]o|guias de turismo|comerciantes|ambulantes|feirantes|campeonato|\\bcursos?\\b|vestibular|empresas para|intima[çc][ãa]o|diretor(es)? (escola|da rede)|banco de diretores|casamento|reforma agr[áa]ria|processo eleitoral|plano anual|certificados|aprovad", "re:notifica[çc][ãa]o|intima[çc][ãa]o|constata[çc][ãa]o|lan[çc]amento fiscal|^edital de \\d+ de \\w+ de \\d{4}$"]
termos_em = "titulo"
# 08/11/2026: a notícia velha não reabre (o WordPress já pede 120 dias; vale também para o mapa do site original)
idade_maxima_dias = 365

[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 19, grupo «Executivo municipal»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): passada no Chrome (wp-json de 25 prefeituras + páginas de editais): os achados de 30 d para OSC foram Santo Antônio do Descoberto (Chamamento 001/2026 Pontos de Cultura, 04/11), Quirinópolis (4 editais PNAB, 03/11), Valparaíso (Chamamento 32/2026 e S/N Cultura e Esporte — tabela com Início e Fim: a data de Fim é o prazo, ferramenta nova), Catalão (16/10), Novo Gama e Senador Canedo (conselhos do FUNDEB). Cristalina devolve aviso do PHP antes do JSON (ferramenta nova: JSON tolerante). Mortos: diariooficial.goiania.go.gov.br (DNS), itaberai.go.gov.br/aviso/ (redireciona para 2021). Luziânia confirmada: só fiscal e compras.", "08/11/2026 (estudo Claude × motores): navegando, os \"editais\" de 30 d de Luziânia e das buscas do DOU eram intimação, notificação e lançamento fiscal (ruído): vetados pelo título. O chamamento de Novo Gama para os representantes de conselho (01/11) não veio pela página inicial; a segunda etapa (mapa do site, R49) o traz.", "08/11/2026 (conferido pelo Chrome, do Brasil): Luziânia tem mapa do site e feed (a segunda etapa os lê pela ponte); o site de Mineiros é um aplicativo (\"Carregando...\") que só abre no navegador; Caldas Novas e Inhumas devolvem a busca do WordPress vazia, mas têm mapa do site com data (a segunda etapa cobre). Em 30 d, os mapas mostraram páginas novas com edital em Formosa (3), Quirinópolis (2), Anápolis, Trindade, Novo Gama e Senador Canedo (1 cada).", "08/11/2026 (parecer): o 'prêmio' solto trazia notícia de prêmio de aluno, escola e servidor (Agrinho, Infosfera); o prêmio agora só com cultura, projeto, inscrição ou edital, e a premiação de aluno/escola/servidor é vetada.", "08/11/2026: 27 das 59 rotas nunca deram pista (o WordPress de muitas cidades não publica edital como notícia); 63 de 93 execuções chegaram ao computador local — Goiânia e Luziânia são as que pedem o Brasil.", "23 das 25 cidades respondem da nuvem (sondagem de 23/10/2026); o registro antigo de 17 só pelo Brasil ficou para trás.", "A busca do WordPress marca o termo no título (<mark>); o título é limpo antes do léxico.", "Rota de acesso única para os domínios com bloqueio (acessoainformacao.cavalcante.go.gov.br, pncp.gov.br, queridodiario.ok.org.br, saude.goiania.go.gov.br, senadorcanedo.go.gov.br…): ponte pelo Brasil, navegador do titular ou espelho.", "O afinador já achou 15 rota(s) que funcionaram: entram como rotas do motor.", "2 fonte(s) abrem a página e não acham nada: verificar contra as publicações conhecidas; candidatas ao teste do copiloto de IA.", "Os 4 alvos são vigiados só na janela prevista da próxima edição.", "17 das 25 cidades só abrem pelo Brasil: leitura pela ponte da Hostgator quando os segredos ELDORADO_PONTE_URL e ELDORADO_PONTE_CHAVE estiverem gravados.", "17 das 25 cidades só abrem pelo Brasil: leitura pela ponte da Hostgator quando os segredos ELDORADO_PONTE_URL e ELDORADO_PONTE_CHAVE estiverem gravados.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []"]
