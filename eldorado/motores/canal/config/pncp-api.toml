# PNCP: as contratações recebendo proposta, por UF (Goiás) e pelas modalidades em que as seleções de OSC aparecem
# (12 credenciamento, 3 concurso, 10 manifestação de interesse, 11 pré-qualificação). Lição de 01/10: ler o país inteiro
# sem filtro trazia registros sem data de encerramento e fora de Goiás; o portão e a validação cuidam do resto.
[motor]
id = "pncp-api"
nome = "PNCP — contratações recebendo proposta"
categoria = "Plataformas federais"
finalidade = "credenciamentos, concursos e chamamentos com prazo oficial de encerramento"
canal = "api"
uf = "GO"
categoria_estudo = "EXE"
nomes_anteriores = ["pncp", "plat-pncp"]

[[fonte]]
nome = "API do PNCP — propostas abertas"
url = "https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal={hoje+500:%Y%m%d}&codigoModalidadeContratacao={mod}&uf={uf}&pagina={pagina}&tamanhoPagina=50"
tipo = "api"
valores = { mod = [12, 3, 10, 11], uf = ["GO"] }
paginacao = { inicio = 1, maximo = 5, total = "totalPaginas" }

[fonte.caminhos]
itens = "data[*]"
titulo = "join(' — ', [orgaoEntidade.razaoSocial || '', objetoCompra || ''])"
link = "join('', ['https://pncp.gov.br/app/editais/', orgaoEntidade.cnpj, '/', to_string(anoCompra), '/', to_string(sequencialCompra)])"
data = "dataPublicacaoPncp"
fim = "dataEncerramentoProposta"
orgao = "orgaoEntidade.razaoSocial"
uf = "unidadeOrgao.ufSigla"
municipio = "unidadeOrgao.municipioNome"
modalidade = "modalidadeNome"
resumo = "informacaoComplementar"

[acesso]
degraus = ["api", "leve"]

[leitura]
documentos = false                  # o edital do órgão (/arquivos) é lido pelo Interceptador (Fase 8)

[lexico]
# Do motor do PNCP do Eldorado0 (pncp_osc.py): só passa o que tem sinal de OSC; compra é vetada (no título).
termos = ["re:13\\.019|termo de (fomento|colaboracao)|organizac(ao|oes) da sociedade civil|\\boscs?\\b|mrosc|associac(ao|oes) (de )?estudant|gremios? estudant|centros? academic|\\bilpis?\\b|longa permanencia|cooperativas? (e|ou|/)? ?associac(ao|oes) de catadores|associac(ao|oes) de catadores|acordo de cooperacao(?! tecnica)|entidades? (socioassistencia|de assistencia social)|\\bcmas\\b|\\bcmdca\\b|pnab|aldir blanc|paulo gustavo|agentes? cultura|pontos? de cultura|(entidades|instituicoes) (de assistencia social|privadas sem fins|filantropicas|sem fins)|termo de execucao cultural"]
vetos = ["re:\\bpregao\\b|\\bconcorrencia\\b|\\bleilao\\b|registro de precos?|\\baquisicao de\\b|\\bfornecimento de\\b|contratacao de empresa|empresas? especializadas?|menor preco|\\bme/epp\\b|microempresas?|eventuais e futuras contratacoes|contratac(ao|oes) de servicos?|generos alimenticios|alimentacao escolar|\\bpnae\\b"]
salvos = ["re:13\\.019|termo de (fomento|colaboracao)|mrosc|termo de execucao cultural"]
