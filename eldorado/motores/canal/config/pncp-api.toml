# PNCP — contratações e chamamentos recebendo proposta — organização dos 43 motores (titular, 09/11/2026): motor 23, grupo «Executivo federal».
# O mesmo motor, renumerado e renomeado.

[motor]
id = "pncp-api"
numero = 23
grupo = "Executivo federal"
nome = "PNCP"   # 09/11/2026 (titular): o nome simplificado; antes «PNCP — contratações e chamamentos recebendo proposta»
categoria = "Plataformas federais"
categoria_estudo = "EXE"
finalidade = "credenciamentos, concursos e chamamentos com prazo oficial de encerramento"
canal = "api"
uf = "GO"
destino = "biblioteca"
nomes_anteriores = ["pncp", "plat-pncp"]

[[fonte]]
nome = "API do PNCP — propostas abertas"
url = "https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal={hoje+500:%Y%m%d}&codigoModalidadeContratacao={mod}&uf={uf}&pagina={pagina}&tamanhoPagina=50"
tipo = "api"
valores = { mod = [12, 3, 10, 11], uf = ["GO", "DF"] }   # 08/11/2026: + DF (os órgãos federais e a capital)
paginacao = { inicio = 1, maximo = 5, total = "totalPaginas" }

[fonte.caminhos]
itens = "data[*]"
titulo = "join(' — ', [orgaoEntidade.razaoSocial || '', objetoCompra || ''])"
link = "join('', ['https://pncp.gov.br/app/editais/', orgaoEntidade.cnpj, '/', to_string(anoCompra), '/', to_string(sequencialCompra)])"
data = "dataPublicacaoPncp"
fim = "dataEncerramentoProposta"
orgao = "orgaoEntidade.razaoSocial"
uf = "unidadeOrgao.ufSigla"
municipio = "unidadeOrgao.municipioNome"
modalidade = "modalidadeNome"
resumo = "informacaoComplementar"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "PNCP — busca de editais (termo \"chamamento\")"
url = "https://pncp.gov.br/app/editais?q=chamamento%20p%C3%BAblico&status=recebendo_proposta"
tipo = "pagina"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "PNCP — documentação da API de consulta"
url = "https://pncp.gov.br/api/consulta/swagger-ui/index.html"
tipo = "pagina"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "Compras.gov.br — API de dados abertos"
url = "https://dadosabertos.compras.gov.br/swagger-ui/index.html"
tipo = "pagina"
papel = "alternativa"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
documentos = false                  # o edital do órgão (/arquivos) é lido pelo Interceptador (Fase 8)

[lexico]
# Do motor do PNCP do Eldorado0 (pncp_osc.py): só passa o que tem sinal de OSC; compra é vetada (no título).
termos = ["re:13\\.019|termo de (fomento|colaboracao)|organizac(ao|oes) da sociedade civil|\\boscs?\\b|mrosc|associac(ao|oes) (de )?estudant|gremios? estudant|centros? academic|\\bilpis?\\b|longa permanencia|cooperativas? (e|ou|/)? ?associac(ao|oes) de catadores|associac(ao|oes) de catadores|acordo de cooperacao(?! tecnica)|entidades? (socioassistencia|de assistencia social)|\\bcmas\\b|\\bcmdca\\b|pnab|aldir blanc|paulo gustavo|agentes? cultura|pontos? de cultura|(entidades|instituicoes) (de assistencia social|privadas sem fins|filantropicas|sem fins)|termo de execucao cultural"]
vetos = ["re:\\bpregao\\b|\\bconcorrencia\\b|\\bleilao\\b|registro de precos?|\\baquisicao de\\b|\\bfornecimento de\\b|contratacao de empresa|empresas? especializadas?|menor preco|\\bme/epp\\b|microempresas?|eventuais e futuras contratacoes|contratac(ao|oes) de servicos?|generos alimenticios|alimentacao escolar|\\bpnae\\b"]
# 08/11/2026 (parecer: 18 decididos, 0 acertos — 16 "fora da abrangência"): a API já pede uf=GO (e agora DF); o ruído vinha
# dos 17 alvos "espalhados" de prefeituras de outros estados. Com o território de Goiás, esses alvos não são lidos (R27) e
# as pistas de município de outro estado não entram. Os alvos ficam na configuração porque são do estudo da titular.
territorio = "goias"
salvos = ["re:13\\.019|termo de (fomento|colaboracao)|mrosc|termo de execucao cultural"]

[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 23, grupo «Executivo federal»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): os 17 alvos são portais de órgãos compradores de outros estados (RS, CE, MT, RO, RJ, PR, SE, MG, SP) e o CRC-GO, abertos um a um no Chrome: nenhum é fonte de oportunidade para OSC de Goiás (municipais de outro estado saem pela R27). Recomendação: retirar (decisão da titular, R19). A busca do PNCP com UF=GO trouxe Abadia de Goiás (PNAB, 03/11) e o chamamento de OSC do FMAS de Senador Canedo (ainda recebendo).", "08/11/2026 (parecer): 0 acertos em 18 — 16 eram de prefeituras de outros estados vigiadas pelos alvos espalhados do PNCP; com o território de Goiás esses alvos não são lidos.", "08/11/2026: a API de propostas falhou em 19 de 128 leituras com XML malformado (resposta de erro do PNCP); a próxima passagem relê.", "08/11/2026: a consulta passou a incluir o DF (os órgãos federais e a capital)."]
