[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 25, grupo «Sistema S e bancos públicos»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): rotas mortas na passada: BNDES Fundo Social (404), BNDES Periferias (redireciona para /onde-atuamos/social), Sebrae GO (página de erro), BNB ConveniosWeb e Portal do Cliente BNDES (login). Os 22 itens \"só Claude\" atribuídos a este motor vêm da busca do DOU (alvo comum). Decisão da titular para trocar/retirar (R19).", "08/11/2026 (parecer): o Banco do Nordeste só financia projetos na sua área (Nordeste, norte de MG e ES) — para Goiás é fonte de baixa aderência; a Caixa (patrocínio) não respondeu da nuvem nem da sandbox em 08/11 e fica a localizar pela ponte. A rota que mais rende é a busca no DOU de um alvo (7 de 7 aceitas).", "Rota de acesso única para os domínios com bloqueio (sebraego.com.br, www.bnb.gov.br, www.bndes.gov.br): ponte pelo Brasil, navegador do titular ou espelho.", "Os 5 alvos são vigiados só na janela prevista da próxima edição."]
