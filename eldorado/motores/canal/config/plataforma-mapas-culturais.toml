# Mapas Culturais — Mapa da Cultura, Mapa Goiano, CultBR e Editais Goiás — organização dos 43 motores (titular, 09/11/2026): motor 39, grupo «Sites de divulgação — cultura».
# Reúne: site-mapas-culturais.

[motor]
id = "plataforma-mapas-culturais"
numero = 39
grupo = "Sites de divulgação — cultura"
nome = "Mapas Culturais"   # 09/11/2026 (titular): o nome simplificado; antes «Mapas Culturais — Mapa da Cultura, Mapa Goiano, CultBR e Editais Goiás»
categoria = "Plataformas de cultura"
categoria_estudo = "POR"
finalidade = "editais e chamadas culturais de órgãos federais, estaduais e municipais publicados no Mapa da Cultura"
canal = "api"
destino = "biblioteca"
nomes_anteriores = ["mapas-culturais", "site-mapas-culturais"]

[[fonte]]
nome = "Mapa da Cultura — API de oportunidades"
url = "https://mapa.cultura.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo,owner.name,ownerEntity.name&registrationTo=GTE({hoje:%Y-%m-%d})&@order=registrationTo%20ASC&@limit=200"
tipo = "api"
# 08/11/2026 (parecer): a maior parte das oportunidades abertas do Mapa da Cultura é de pessoas (oficinas, consultorias, shows,
# "teste edital"): só seguem as de dono institucional (órgão, prefeitura, fundação, instituto, universidade, conselho, rede)
filtro = { orgao = '(?i)secretari|minist[ée]ri|prefeitur|munic[íi]pio|governo|funda[çc][ãa]o|instituto|universidade|conselho|funarte|iphan|ancine|secult|cultura viva|rede |associa[çc][ãa]o|f[óo]rum|fundo |programa ' }

[fonte.caminhos]
itens = "[*]"
titulo = "name"
link = "join('', ['https://mapa.cultura.gov.br/oportunidade/', to_string(id)])"
data = "registrationFrom.date || registrationFrom"
fim = "registrationTo.date || registrationTo"
resumo = "shortDescription"
orgao = "join(' · ', [owner.name || '', ownerEntity.name || ''])"

# 09/11/2026: veio do motor site-mapas-culturais (organização dos 43 motores)

# ---- rotas confirmadas nas sondagens de 23/10/2026 (testes/paginas/sondagem-a, -b, -c, -farol)

# 08/11/2026 (parecer): o motor lia só o Ceará (57 livros, 1 acerto; 22 fora da abrangência). O Mapa Goiano da Cultura
# (Secult-GO) é uma instância do Mapas Culturais e responde da nuvem: o Goyazes, o FAC e os editais dos municípios goianos
# (ex.: Alto Paraíso de Goiás) passam a ser as rotas principais. O Ceará fica como alternativa (R38: outros estados por
# último), com a regra territorial na entrada (a municipal cearense sai; a estadual fica — R27).
[[fonte]]
nome = "Mapa Goiano da Cultura — oportunidades com inscrição aberta (API do Mapas Culturais)"
url = "https://mapagoiano.cultura.go.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo,singleUrl,owner.name&registrationTo=GTE({hoje:%Y-%m-%d})&@order=registrationTo%20ASC&@limit=100"
tipo = "api"
papel = "principal"
caminhos = { itens = "@", titulo = "name", link = "singleUrl", resumo = "shortDescription", data = "registrationFrom.date || registrationFrom", inicio = "registrationFrom.date || registrationFrom", fim = "registrationTo.date || registrationTo", orgao = "owner.name", uf = "'GO'" }
lexico = { termos = ["re:edital|editais|chamad|chamamento|sele[çc][ãa]o|pr[êe]mio|inscri[çc]|fomento|apoio a projetos|financiamento|programa de (apoio|acelera)|doa[çc][ãa]o|grant|call for|proposals?|funding|fellowship|how to apply|oportunidades"], vetos = ["re:^(editais|oportunidades|editais abertos|editais em curso|editais e projetos|nossos editais|central de editais|veja os editais abertos|grants and fellowships|grants|fellowship|financiamento e entrega|apply for funding|processo de sele[çc][ãa]o|projetos e editais|chamadas|chamadas p[úu]blicas|editais do ano|portal de chamadas|our grants|grant-making)$|presta[çc][ãa]o de contas?|resultado|selecionad|homologa|vagas|emprego|trabalhe conosco|licita[çc]|preg[ãa]o|awarded|past grants|newsletter|privacidade|cookies|^entrar$|^login|imprensa|podcast|concurso p[úu]blico|est[áa]gio"], termos_em = "titulo", idade_maxima_dias = 120, territorio = "goias" }   # 09/11/2026: o léxico do motor site-mapas-culturais (cada fonte reunida mantém o próprio filtro)

