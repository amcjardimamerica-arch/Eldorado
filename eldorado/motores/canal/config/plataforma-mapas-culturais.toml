# Mapa da Cultura (Ministério da Cultura): as oportunidades com inscrição aberta, pela API padrão do Mapas Culturais.
[motor]
id = "plataforma-mapas-culturais"
nome = "Mapa da Cultura — oportunidades com inscrição aberta"
categoria = "Plataformas de cultura"
finalidade = "editais e chamadas culturais de órgãos federais, estaduais e municipais publicados no Mapa da Cultura"
canal = "api"
categoria_estudo = "POR"
nomes_anteriores = ["mapas-culturais"]

[[fonte]]
nome = "Mapa da Cultura — API de oportunidades"
url = "https://mapa.cultura.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo&registrationTo=GTE({hoje:%Y-%m-%d})&@order=registrationTo%20ASC&@limit=200"
tipo = "api"

[fonte.caminhos]
itens = "[*]"
titulo = "name"
link = "join('', ['https://mapa.cultura.gov.br/oportunidade/', to_string(id)])"
data = "registrationFrom.date || registrationFrom"
fim = "registrationTo.date || registrationTo"
resumo = "shortDescription"

[acesso]
degraus = ["api", "leve"]

[leitura]
documentos = false

[lexico]
# O Mapa da Cultura mistura editais com chamadas para artistas, vagas, cursos e oficinas: só passa o que é seleção
# de projetos, prêmio, fomento ou edital.
termos = ["re:edital|chamamento|chamada publica|premio|premiacao|fomento|selecao de (projetos|propostas|iniciativas)|subsidio|bolsa|pnab|aldir blanc|paulo gustavo|cultura viva|pontos? de cultura|termo de execucao cultural"]
vetos = ["re:\\bvagas?\\b|\\bcurso\\b|\\boficinas?\\b|arte-?educador|contratacao|processo seletivo para|resultado|homologa|\\bteste\\b|ficha de avaliacao|prestacao de informac|\\bguia\\b|mapeamento|formulario|escuta"]
termos_em = "titulo"
