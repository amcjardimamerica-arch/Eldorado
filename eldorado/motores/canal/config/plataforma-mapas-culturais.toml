[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 39, grupo «Sites de divulgação — cultura»; reúne site-mapas-culturais", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): a lista \"Editais abertos\" do MinC tem 4 (Ciclo de Saberes, 2º Cultura Viva Pontões, Biblioteca Comunitária é Cultura Viva, Rouanet nas Favelas 2), sem data: estar na lista é o sinal de aberto.", "08/11/2026 (estudo Claude × motores): a página \"editais\" do MinC deu 0 pista em 126 leituras; navegando, a rota certa é a subpágina \"inscrições abertas\" — trocada.", "08/11/2026 (parecer): 130 execuções para dois livros da Bahia; das 62 oportunidades abertas na API, a maioria é de pessoas (oficina, consultoria, show, \"TESTE EDITAL\"). Agora só seguem as de dono institucional (o filtro da fonte sobre owner.name e ownerEntity.name) e a municipal de outro estado sai na entrada.", "23/10/2026: o Mapa da Cultura não tem WordPress nem mapa do site (404); a única rota conhecida é a API; a segunda rota fica pendente.", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): Mapa Goiano: ZERO oportunidades criadas em 30 d (a Secult GO passou para o Baru 2.0, com login); Mapa CE: 40 novas, quase todas municipais do Ceará (R27 barra) e 2 estaduais (Frei Tito, Artista Presente!).", "08/11/2026 (parecer): o motor lia só o Ceará (57 livros, 1 acerto). Localizado o Mapa Goiano da Cultura (mapagoiano.cultura.go.gov.br, Mapas Culturais, API pública): rota principal pelas inscrições abertas e alternativa pelas mais recentes; o Ceará virou alternativa, com a regra territorial e a idade na entrada.", "Outras redes estaduais do Mapas Culturais entram aqui quando o endereço for confirmado na sondagem.", "Ler primeiro pela API do Mapas Culturais (20 de 20); as páginas ficam como reserva.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []", "14/11/2026 (análise externa em 3 grupos, pelo Claude no Chrome): 4 livros: 0 válidos, 0 encerradas, 4 descartes — sem mudança no léxico: os vetos propostos não barravam nenhum descarte deste lote (só risco)"]
