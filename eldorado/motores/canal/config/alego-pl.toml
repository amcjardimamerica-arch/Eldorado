# Assembleia Legislativa de Goiás — proposições — criado pela orientação eldorado/motores/skills/criar-motor/SKILL.md (a partir do estudo da titular, 19/10/2026).
# Rotas candidatas comentadas: só entra a que respondeu na sondagem (eldorado sondar).

[motor]
uf = "GO"
canal = "portal"
orgao = "Assembleia Legislativa do Estado de Goiás"
id = "alego-pl"
nome = "Assembleia Legislativa de Goiás — proposições"
categoria = "Legislativo"
categoria_estudo = "LEG"
finalidade = "monitorar na Assembleia de Goiás os projetos de lei e os atos do terceiro setor e das OSC, as emendas impositivas estaduais, as declarações de utilidade pública e as oportunidades para entidades"
tipo_finalidade = "descoberta"
nomes_anteriores = []

# ---- rotas (23/10/2026): o portal da ALEGO responde à nuvem (o Eldorado0 o tinha como bloqueado); o sistema de consulta
# (alegodigital) derruba a conexão da nuvem: computador local. As emendas impositivas estaduais têm janela em outubro e novembro.

[[fonte]]
nome = "ALEGO — portal (notícias)"
url = "https://portal.al.go.leg.br/"
tipo = "pagina"
seletor = "main"
papel = "principal"

[[fonte]]
nome = "ALEGO — consulta cronológica das proposições (alegodigital)"
url = "https://alegodigital.al.go.leg.br/spl/consulta-cronologico.aspx"
tipo = "pagina"
papel = "alternativa"
exige_brasil = true


[[fonte]]
nome = "Diário Oficial do Estado — os atos legislativos do terceiro setor (leis de utilidade pública, subvenções, entidades)"
url = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/edicoes_from_data/{hoje:%Y-%m-%d}.json"
tipo = "cadeia"
papel = "alternativa"

[[fonte.cadeia]]
formato = "json"
itens = "itens"
campos = { edicao = "id", numero = "numero" }

[[fonte.cadeia]]
formato = "html"
url = "https://diariooficial.abc.go.gov.br/portal/visualizacoes/view_html_diario/{edicao}"
itens = "a.linkMateria"
campos = { materia = "attr:data-materia-id", titulo = 're:#\d+\s*-\s*(.*?)\s*</a>', caminho = "ancestrais:span.folder" }
filtro = { titulo = '(?i)utilidade p[úu]blica|terceiro setor|sociedade civil|subven[çc]|sem fins lucrativos|entidade|filantr|associa[çc][ãa]o|lei n' }

[fonte.pista]
titulo = "{titulo}"
link = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/publicacoes_ver_conteudo/{materia}"
resumo = "{caminho} · edição {numero}"

[[alvo]]
id = "f260-captacao-068"
nome = "Emenda estadual para projeto educativo em Goiás"
enderecos = ["https://portal.al.go.leg.br/", "https://goias.gov.br/educacao/"]   # corrigido: começa pela casa legislativa do alvo
orgao = "ALEGO — Assembleia Legislativa de Goiás (emendas e orçamento)"

[[alvo]]
id = "f260-captacao-151"
nome = "Emenda estadual para saúde comunitária"
enderecos = ["https://portal.al.go.leg.br/", "https://goias.gov.br/saude/"]   # corrigido: começa pela casa legislativa do alvo
orgao = "ALEGO — Assembleia Legislativa de Goiás (emendas e orçamento)"

[acesso]
