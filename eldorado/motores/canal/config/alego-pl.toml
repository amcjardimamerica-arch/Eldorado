# Assembleia Legislativa de Goiás — proposições, leis e emendas estaduais — organização dos 43 motores (titular, 09/11/2026): motor 06, grupo «Legislativo».
# O mesmo motor, renumerado e renomeado.

[motor]
id = "alego-pl"
numero = 6
grupo = "Legislativo"
nome = "Assembleia Legislativa de Goiás"   # 09/11/2026 (titular): o nome simplificado; antes «Assembleia Legislativa de Goiás — proposições, leis e emendas estaduais»
categoria = "Legislativo"
categoria_estudo = "LEG"
finalidade = "monitorar na Assembleia de Goiás os projetos de lei e os atos do terceiro setor e das OSC, as emendas impositivas estaduais, as declarações de utilidade pública e as oportunidades para entidades"
tipo_finalidade = "descoberta"
canal = "portal"
uf = "GO"
orgao = "Assembleia Legislativa do Estado de Goiás"
destino = "biblioteca"
nomes_anteriores = []

# ---- rotas (23/10/2026): o portal da ALEGO responde à nuvem (o Eldorado0 o tinha como bloqueado); o sistema de consulta
# (alegodigital) derruba a conexão da nuvem: computador local. As emendas impositivas estaduais têm janela em outubro e novembro.

# 08/11/2026 (parecer): a rota principal passa a ser a legislação estadual da Casa Civil (API pública, responde da nuvem):
# as leis e decretos mais recentes com a ementa — as declarações de utilidade pública, as leis de fomento, as organizações
# sociais. O Diário do Estado só traz "Lei 24.601 - Sanção ao Autógrafo de Lei nº 497" (sem o assunto), por isso nunca
# passou no léxico; a ALEGO Digital não responde da nuvem (exige o Brasil).
[[fonte]]
nome = "Casa Civil de Goiás — a legislação estadual mais recente (leis e decretos, com a ementa)"
url = "https://legisla.casacivil.go.gov.br/api/v2/pesquisa/legislacoes?qtd_por_pagina=50"
tipo = "cadeia"
papel = "principal"

[[fonte.cadeia]]
formato = "json"
itens = "resultados"
campos = { id = "id", numero = "numero", tipo = "tipo_legislacao.nome", ementa = "ementa", data = "data_legislacao", diario = "diarios[0].numero" }
limite = 50

[fonte.pista]
titulo = "{tipo} nº {numero}, de {data} — {ementa}"
link = "https://legisla.casacivil.go.gov.br/api/v2/pesquisa/legislacoes/{id}/pdf"
resumo = "Legislação do Estado de Goiás (Casa Civil) · Diário Oficial nº {diario}"

[[fonte]]
nome = "ALEGO — portal (notícias)"
url = "https://portal.al.go.leg.br/"
tipo = "pagina"
seletor = "main"
papel = "alternativa"

# 08/11/2026 (conferido pelo Chrome, do Brasil): a página "consulta-cronologico.aspx" é só o índice dos anos; a lista das
# proposições do ano (2.519 em 2026, as mais novas primeiro, com a ementa) é "consulta-producao.aspx?ano=AAAA" — cada
# proposição em um bloco com o título, a ementa e o link "processo.aspx?id=…". Só responde do Brasil (ponte/computador local).
[[fonte]]
nome = "ALEGO — proposições do ano, as mais novas (alegodigital, consulta por ano)"
url = "https://alegodigital.al.go.leg.br/spl/consulta-producao.aspx?ano={hoje:%Y}"
tipo = "cadeia"
papel = "alternativa"
exige_brasil = true

[[fonte.cadeia]]
formato = "html"
itens = "div.kt-widget5__item"
campos = { titulo = "texto", processo = 're:href="([^"]*processo\.aspx[^"]*)"' }
filtro = { processo = "processo" }
limite = 50

[fonte.pista]
titulo = "{titulo}"
link = "https://alegodigital.al.go.leg.br/spl/{processo}"
resumo = "ALEGO — proposição do ano"

