vetos = ["re:denomina|t[íi]tulo de cidad[ãa]o|honra ao m[ée]rito|medalha|comenda|sess[ãa]o solene|homenage|campanhas? de utilidade p|informa[çc][õo]es de utilidade p|emissoras de (r[áa]dio|televis)|decreto or[çc]ament|cr[ée]dito (suplementar|especial)|abre (ao|cr[ée]dito)|servid[ãa]o administrativa|nomea|exonera|f[ée]rias|aposentadoria|pens[ãa]o|licen[çc]a|dia (estadual|municipal) d"]
