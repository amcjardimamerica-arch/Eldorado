# Mapas Culturais — editais das redes estaduais e municipais de cultura que usam a plataforma — criado pela orientação eldorado/motores/skills/criar-motor/SKILL.md (a partir do estudo da titular, 19/10/2026).
# Rotas candidatas comentadas: só entra a que respondeu na sondagem (eldorado sondar).

[motor]
uf = "BR"
canal = "portal"
id = "site-mapas-culturais"
nome = "Mapas Culturais — editais das redes estaduais e municipais de cultura que usam a plataforma"
categoria = "Portais e fontes do terceiro setor"
categoria_estudo = "POR"
finalidade = "editais das redes estaduais e municipais de cultura que usam a plataforma"
tipo_finalidade = "descoberta"
nomes_anteriores = []

# ---- rotas confirmadas nas sondagens de 23/10/2026 (testes/paginas/sondagem-a, -b, -c, -farol)

# 08/11/2026 (parecer): o motor lia só o Ceará (57 livros, 1 acerto; 22 fora da abrangência). O Mapa Goiano da Cultura
# (Secult-GO) é uma instância do Mapas Culturais e responde da nuvem: o Goyazes, o FAC e os editais dos municípios goianos
# (ex.: Alto Paraíso de Goiás) passam a ser as rotas principais. O Ceará fica como alternativa (R38: outros estados por
# último), com a regra territorial na entrada (a municipal cearense sai; a estadual fica — R27).
[[fonte]]
nome = "Mapa Goiano da Cultura — oportunidades com inscrição aberta (API do Mapas Culturais)"
url = "https://mapagoiano.cultura.go.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo,singleUrl,owner.name&registrationTo=GTE({hoje:%Y-%m-%d})&@order=registrationTo%20ASC&@limit=100"
tipo = "api"
papel = "principal"
caminhos = { itens = "@", titulo = "name", link = "singleUrl", resumo = "shortDescription", data = "registrationFrom.date || registrationFrom", inicio = "registrationFrom.date || registrationFrom", fim = "registrationTo.date || registrationTo", orgao = "owner.name", uf = "'GO'" }

[[fonte]]
nome = "Mapa Goiano da Cultura — as oportunidades mais recentes (API do Mapas Culturais)"
url = "https://mapagoiano.cultura.go.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo,singleUrl,owner.name&@order=id%20DESC&@limit=30"
tipo = "api"
papel = "alternativa"
caminhos = { itens = "@", titulo = "name", link = "singleUrl", resumo = "shortDescription", data = "registrationFrom.date || registrationFrom", inicio = "registrationFrom.date || registrationFrom", fim = "registrationTo.date || registrationTo", orgao = "owner.name", uf = "'GO'" }

[[fonte]]
nome = "Mapa Cultural do Ceará — oportunidades (API do Mapas Culturais)"
url = "https://mapacultural.secult.ce.gov.br/api/opportunity/find?@select=id,name,shortDescription,registrationFrom,registrationTo,singleUrl,owner.name,ownerEntity.name&@order=id%20DESC&@limit=50"
tipo = "api"
papel = "alternativa"
caminhos = { itens = "@", titulo = "name", link = "singleUrl", resumo = "shortDescription", data = "registrationFrom.date || registrationFrom", fim = "registrationTo.date || registrationTo", orgao = "join(' · ', [owner.name || '', ownerEntity.name || ''])", uf = "'CE'" }
# quase tudo no Mapa do Ceará é de secretaria municipal do interior ou de pessoa (a regra territorial não vê pelo título):
# só segue o que é do Estado do Ceará ou da capital (R27)
filtro = { orgao = '(?i)estado do cear|secultc|c[ée]lula d[oa]|coordenadoria de economia criativa|fortaleza|secultfor' }

[[fonte]]
nome = "Mapa Cultural do Ceará — página de oportunidades"
url = "https://mapacultural.secult.ce.gov.br/oportunidades/"
tipo = "pagina"
papel = "alternativa"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true
seguir_oficial = false   # a página do Mapas tem modelos ({{...}}) que a busca cega seguiria

[lexico]
termos = ["re:edital|editais|chamad|chamamento|sele[çc][ãa]o|pr[êe]mio|inscri[çc]|fomento|apoio a projetos|financiamento|programa de (apoio|acelera)|doa[çc][ãa]o|grant|call for|proposals?|funding|fellowship|how to apply|oportunidades"]
vetos = ["re:^(editais|oportunidades|editais abertos|editais em curso|editais e projetos|nossos editais|central de editais|veja os editais abertos|grants and fellowships|grants|fellowship|financiamento e entrega|apply for funding|processo de sele[çc][ãa]o|projetos e editais|chamadas|chamadas p[úu]blicas|editais do ano|portal de chamadas|our grants|grant-making)$|presta[çc][ãa]o de contas?|resultado|selecionad|homologa|vagas|emprego|trabalhe conosco|licita[çc]|preg[ãa]o|awarded|past grants|newsletter|privacidade|cookies|^entrar$|^login|imprensa|podcast|concurso p[úu]blico|est[áa]gio"]
termos_em = "titulo"
# 08/11/2026: a oportunidade aberta há mais de quatro meses sai na entrada (as listas por id trazem o histórico)
idade_maxima_dias = 120
# 08/11/2026: a municipal de outro estado (Morada Nova-CE, Hidrolândia-CE) sai na entrada (R27)
territorio = "goias"

[aprendizado]
licoes = ["08/11/2026 (parecer): o motor lia só o Ceará (57 livros, 1 acerto). Localizado o Mapa Goiano da Cultura (mapagoiano.cultura.go.gov.br, Mapas Culturais, API pública): rota principal pelas inscrições abertas e alternativa pelas mais recentes; o Ceará virou alternativa, com a regra territorial e a idade na entrada.", "Outras redes estaduais do Mapas Culturais entram aqui quando o endereço for confirmado na sondagem.", "Ler primeiro pela API do Mapas Culturais (20 de 20); as páginas ficam como reserva.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []"]
bloqueios_conhecidos = []
alternativas_para_bloqueio = []
rotas_que_falharam = ["mapa.cultura.go.gov.br, mapacultural.go.gov.br e mapadacultura.go.gov.br (não existem, 23/10/2026); localizado em 08/11/2026: mapagoiano.cultura.go.gov.br"]

[metrica]
cadencia_h = 24
periodo_dias = 14
