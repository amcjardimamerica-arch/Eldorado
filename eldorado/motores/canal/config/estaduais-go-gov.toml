# Sites oficiais do Governo de Goiás em WordPress, pela API pública (as secretarias de Cultura e Social).
[motor]
id = "estaduais-go-gov"
nome = "Oportunidades estaduais governamentais de Goiás"
categoria = "Executivo — portais do governo"
finalidade = "editais, chamamentos e programas das secretarias e fundos de Goiás, pela API do WordPress (a rota principal) e pelas páginas oficiais"
canal = "api"
uf = "GO"
categoria_estudo = "EXE"
nomes_anteriores = ["wordpress-goias", "goyazes", "plataforma-wordpress", "plat-estaduais-go-gov", "plat-fapeg", "plat-fundos-estaduais-go", "plat-goias-social", "plat-ovg", "plat-secult-go"]


# O Programa Goyazes é um ALVO deste motor (estudo da titular, 19/10/2026), com as regras de extração das normas só para ele.
[programa]
titulo = "Programa Goyazes (Lei estadual 13.613/2000) — incentivo fiscal à cultura em Goiás"
orgao = "Secretaria de Estado da Cultura de Goiás"
modalidade = "incentivo fiscal estadual (ICMS)"
link_divulgacao = "https://goias.gov.br/cultura/programa-goyazes/"
link_oficial = "https://goias.gov.br/cultura/programa-goyazes/legislacao/"
documentos = ["https://goias.gov.br/cultura/programa-goyazes/legislacao/", "https://goias.gov.br/cultura/programa-goyazes/inscricoes/",
              "https://goias.gov.br/cultura/programa-goyazes/"]   # a página de inscrições traz as datas (sondagem de 22/10)

[programa.normas]
padrao = "resolucao|instrucao normativa|portaria"
maximo = 3

[legislacao]
leis = ["lei-go-13613-2000"]
notas = "Prazos de inscrição, limites e contrapartidas vêm da legislação e das portarias vigentes, lidas na página oficial."

[[fonte]]
nome = "Secretaria de Cultura de Goiás"
url = "https://goias.gov.br/cultura/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "edital"

[[fonte]]
nome = "Secretaria de Desenvolvimento Social de Goiás"
url = "https://goias.gov.br/social/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "edital"

[[fonte]]
nome = "Programa Goyazes — página do programa"
url = "https://goias.gov.br/cultura/programa-goyazes/"
tipo = "pagina"

[[fonte]]
nome = "Secult — publicações sobre o Goyazes"
url = "https://goias.gov.br/cultura/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "goyazes"

[[fonte]]
nome = "FAPEG — Fundação de Amparo à Pesquisa do Estado de Goiás"
url = "https://goias.gov.br/fapeg/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "chamada"

[[fonte]]
nome = "PNAB Goiás — Política Nacional Aldir Blanc no estado (alvo do estudo)"
url = "https://pnab.cultura.go.gov.br/"
tipo = "pagina"

[[fonte]]
nome = "FICA — Festival Internacional de Cinema e Vídeo Ambiental (alvo do estudo)"
url = "https://fica.go.gov.br/"
tipo = "pagina"

[acesso]
degraus = ["api", "leve"]

[leitura]
paginas_dos_achados = true
seguir_oficial = true               # do post de divulgação ao edital oficial
max_documentos = 20

[lexico]
termos = ["re:inscric|instrucao normativa|cartas? de intencao|reabert|prorroga|edital|chamamento|chamada publica|abre (selecao|inscric|chamada)|inscricoes abertas|premio|premiacao|selecao de (projetos|propostas|organizac)|seleciona (projetos|propostas)|fomento|credenciamento de (osc|organizac|entidades)"]
termos_em = "titulo"            # site de notícias: o título de um edital diz que é edital
vetos = ["re:resultado|homologa|pregao|licitac|tomada de precos|concorrencia|contemplad|selecionad|aprovad|habilitad|edital pe\\b|\\bvagas?\\b|cadastro de reserva|pareceristas?|oficinas?|eleic|plano de acao final|lista final"]

[programa.extracao]
# A análise própria do motor de incentivo, para o texto das NORMAS (resoluções, instruções normativas, portarias).
nao_certificar = ["Resultado", "Prazo de recurso", "Anexos", "Esfera", "Modalidade", "Órgão / financiador", "Território", "Área de atuação"]

[programa.extracao.itens]
"Prazo de inscrição" = [
  # calibrada na IN Secult nº 3/2026: "não implica reabertura de prazo" (as inscrições comuns do exercício estão encerradas)
  '((?:sem|n[ãa]o implica) reabertura de prazo[^.;]{0,140})',
  'inscri[çc][õo]es[^.;]{0,100}?(?:prorrogad[ao]s? )?at[ée] (?:o dia )?(\d{1,2}[ºo°]?\s+de\s+[a-zç]+(?:\s+de\s+\d{4})?)',
  '(?:apresenta[çc][ãa]o de (?:propostas|projetos)|inscri[çc][ãa]o de (?:propostas|projetos)|(?:propostas|projetos) (?:culturais )?(?:poder[ãa]o ser|ser[ãa]o) (?:apresentad|inscrit)[oa]s)[^.;]{0,200}?((?:de|entre|no per[íi]odo de)\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?\s+(?:a|e|at[ée])\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?)',
  '(?:prazo|per[íi]odo) (?:para|de) (?:a )?(?:apresenta[çc][ãa]o|inscri[çc][ãa]o)[^.;]{0,160}?(\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?\s+(?:a|at[ée])\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?)',
]
"Valor" = [
  # calibrada na IN Secult nº 3/2026: "o montante global do benefício fiscal ... para o exercício de 2026 foi fixado em R$ 40.000.000,00"
  '(montante global do benef[íi]cio fiscal[^.;]{0,180}?R\$\s*[\d.,]+)',
  '((?:limite|valor m[áa]ximo|teto|n[ãa]o poder[áa] ultrapassar|at[ée] o (?:limite|valor) de)[^.;]{0,120}?R\$\s*[\d.,]+(?:\s*(?:mil|milh[õo]es))?)',
]
"Requisitos" = [
  '((?:poder[ãa]o (?:apresentar|propor|inscrever)|s[ãa]o (?:proponentes|eleg[íi]veis)|o proponente (?:dever[áa]|deve))[^.;]{15,300})',
]
"Objeto" = ['(Programa Estadual de Incentivo [àa] Cultura\s*[–-]\s*GOYAZES)', '((?:incentivo|apoio) (?:fiscal )?(?:a|à|aos) projetos culturais[^.;]{10,200})']
