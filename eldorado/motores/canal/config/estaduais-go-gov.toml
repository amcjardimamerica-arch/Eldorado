# Sites oficiais do Governo de Goiás em WordPress, pela API pública (as secretarias de Cultura e Social).
[motor]
id = "estaduais-go-gov"
nome = "Oportunidades estaduais governamentais de Goiás"
categoria = "Executivo — portais do governo"
finalidade = "editais, chamamentos e programas das secretarias e fundos de Goiás, pela API do WordPress (a rota principal) e pelas páginas oficiais"
canal = "api"
uf = "GO"
categoria_estudo = "EXE"
nomes_anteriores = ["wordpress-goias", "goyazes", "plataforma-wordpress", "plat-estaduais-go-gov", "plat-fapeg", "plat-fundos-estaduais-go", "plat-goias-social", "plat-ovg", "plat-secult-go"]


# O Programa Goyazes é um ALVO deste motor (estudo da titular, 19/10/2026), com as regras de extração das normas só para ele.
[programa]
titulo = "Programa Goyazes (Lei estadual 13.613/2000) — incentivo fiscal à cultura em Goiás"
orgao = "Secretaria de Estado da Cultura de Goiás"
modalidade = "incentivo fiscal estadual (ICMS)"
link_divulgacao = "https://goias.gov.br/cultura/programa-goyazes/"
