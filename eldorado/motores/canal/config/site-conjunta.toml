# 09/11/2026 (titular, R51): um motor por site de divulgação — criado com a sondagem de 09/11 (API do WordPress).
[motor]
id = "site-conjunta"
numero = 51
grupo = "Sites de divulgação — terceiro setor"
nome = "Plataforma Conjunta"
categoria = "Portais e fontes do terceiro setor"
categoria_estudo = "POR"
finalidade = "os editais divulgados pela Plataforma Conjunta"
canal = "api"
uf = "BR"
destino = "biblioteca"
nomes_anteriores = []

[[fonte]]
nome = "Plataforma Conjunta — publicações (API do WordPress)"
url = "https://conjunta.org/wp-json/wp/v2/posts?orderby=date&per_page=50"
tipo = "wordpress"
papel = "principal"

[[fonte]]
nome = "Plataforma Conjunta — página de editais"
url = "https://conjunta.org/conteudo/editais-2/"
tipo = "pagina"
papel = "alternativa"

[[fonte]]
nome = "mapa do site (conjunta.org)"
url = "https://conjunta.org/wp-sitemap.xml"
tipo = "mapa"
papel = "alternativa"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true
seguir_oficial = true               # a busca cega: do post de divulgação a um documento candidato à origem
max_documentos = 20

[lexico]
territorio = "goias"
exige_prazo = true   # 10/11/2026 (titular): só vira livro a página com prazo de inscrição vigente
termos = ["re:edital|chamada|chamamento|abre (selecao|inscric)|inscricoes abertas|premio|premiacao|selecao de (projetos|propostas|organizac|iniciativas)|seleciona (projetos|propostas|iniciativas)|fomento|fundo de apoio|lanca fundo|fundo de r\\$|abre (edital|inscric|chamada)|recebe (inscric|projetos|propostas)|apoiar projetos|financiar projetos|apoio a (projetos|iniciativas|organizac)"]
termos_em = "titulo"            # site de notícias: o título de um edital diz que é edital
vetos = ["re:resultado|selecionad[ao]s|contemplad|^confira|editais (com inscricoes )?abert|oportunidades (do|da|de) (mes|semana)|finalistas|vencedor"]
# 08/11/2026: 25 editais de ano anterior em 30 d, quase todos do mapa do site — a idade (do mapa ou lida na página) barra o acervo
idade_maxima_dias = 120
vetos_endereco = ["re:/conteudo/(?!editais)"]

[aprendizado]
licoes = ["09/11/2026: criado pela decisão da titular (R51) — motor 51, grupo «Sites de divulgação — terceiro setor»; site de divulgação (replicador): o motor segue até o edital oficial", "14/11/2026 (análise externa em 3 grupos, pelo Claude no Chrome): 6 livros: 2 válidos, 0 encerradas, 4 descartes — vetos_endereco +1"]
