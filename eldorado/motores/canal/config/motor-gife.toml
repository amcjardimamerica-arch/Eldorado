# Motor Incentivos Fiscais — empresas da base ICMS/RFB/SALIC (Goiás) — criado pela orientação eldorado/motores/skills/criar-motor/SKILL.md (a partir do estudo da titular, 19/10/2026).
# Rotas candidatas comentadas: só entra a que respondeu na sondagem (eldorado sondar).

[motor]
destino = "especial"
uf = "GO"
canal = "api"
id = "motor-gife"
nome = "Motor Incentivos Fiscais — empresas da base ICMS/RFB/SALIC (Goiás)"
categoria = "Executivo — diários e portais do governo"
categoria_estudo = "EXE"
finalidade = "empresas da base ICMS/RFB/SALIC de Goiás com potencial de destinação incentivada e os sites das maiores contribuintes do ICMS (editais incentivados)"
tipo_finalidade = "descoberta"
nomes_anteriores = ["motor-patrocinio"]

# ---- destino ESPECIAL: este motor alimenta a base de empresas (quem pode destinar incentivo) e os incentivos (o que
# cada uma já destinou). Rotas confirmadas (23/10/2026, testes/paginas/motor-gife/): o PDF dos 500 maiores contribuintes
# do ICMS de Goiás (um por ano, com a raiz do CNPJ) e os incentivadores pessoa jurídica de Goiás no Salic (358, com o
# CNPJ completo e o total doado pela Rouanet).
[[fonte]]
nome = "Economia de Goiás — os 500 maiores contribuintes do ICMS (o PDF do ano mais recente)"
url = "https://goias.gov.br/economia/os-maiores-contribuintes-do-icms/"
tipo = "cadeia"
papel = "principal"

[[fonte.cadeia]]
formato = "html"
itens = 'a[href*="MAIORES_DO_ICMS"]'
campos = { pdf = "attr:href", ano = 're:OFICIAL_(\d{4})' }
limite = 1

[[fonte.cadeia]]
formato = "linhas"
url = "{pdf}"
itens = '(?m)^(?P<posicao>\d+) º\n(?P<raiz>\d{8})\n(?P<nome>[^\n]+)\n(?P<localidade>[^\n]+)\n(?P<uf>[A-Z]{2})\n(?P<atividade>[^\n]+)'
limite = 500

[fonte.pista]
titulo = "{nome}"
link = "{pdf}#{posicao}"

[fonte.especial]
cnpj = "{raiz}"
razao_social = "{nome}"
uf = "{uf}"
atividade_principal = "{atividade}"
incentivo = { lei = "ICMS", ano = "{ano}" }   # 500 maiores contribuintes do ICMS de Goiás

[[fonte]]
nome = "Salic — incentivadores pessoa jurídica de Goiás (registros 1 a 100)"
url = "https://api.salic.cultura.gov.br/api/v1/incentivadores/?UF=GO&tipo_pessoa=juridica&limit=100&offset=0&format=json"
tipo = "cadeia"
papel = "principal"

[[fonte.cadeia]]
formato = "json"
itens = "_embedded.incentivadores"
campos = { cnpj = "cgccpf", nome = "nome", localidade = "municipio", uf = "UF", valor = "total_doado", tipo_pessoa = "tipo_pessoa" }
limite = 100

[fonte.pista]
titulo = "{nome}"
link = "https://api.salic.cultura.gov.br/api/v1/incentivadores/?UF=GO&tipo_pessoa=juridica#{cnpj}"

[fonte.especial]
cnpj = "{cnpj}"
razao_social = "{nome}"
uf = "{uf}"
tipo_pessoa = "{tipo_pessoa}"
incentivo = { lei = "Rouanet", valor = "{valor}" }   # Salic: o total doado

[[fonte]]
nome = "Salic — incentivadores pessoa jurídica de Goiás (registros 101 a 200)"
url = "https://api.salic.cultura.gov.br/api/v1/incentivadores/?UF=GO&tipo_pessoa=juridica&limit=100&offset=100&format=json"
