# Financiadores do terceiro setor com site em WordPress (API pública). Alguns publicam editais num tipo próprio
# (chamadas, edital), que já é só de oportunidades.
[motor]
id = "wordpress-financiadores"
nome = "Financiadores do terceiro setor (WordPress)"
categoria = "Financiadores privados"
finalidade = "editais de fundos, institutos e fundações para organizações da sociedade civil"
canal = "api"
uf = "BR"

[[fonte]]
nome = "Fundo Casa Socioambiental — chamadas"
url = "https://casa.org.br/wp-json/wp/v2/chamadas"
tipo = "wordpress"

[[fonte]]
nome = "CESE — editais"
url = "https://cese.org.br/wp-json/wp/v2/edital"
tipo = "wordpress"

[[fonte]]
nome = "Fundo Brasil — editais"
url = "https://www.fundobrasil.org.br/wp-json/wp/v2/edital"
tipo = "wordpress"

[[fonte]]
nome = "Captadores (Capta)"
url = "https://capta.org.br/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "edital"

[[fonte]]
nome = "GIFE"
url = "https://gife.org.br/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "edital"

[[fonte]]
nome = "Anater"
url = "https://www.anater.org/wp-json/wp/v2/posts"
tipo = "wordpress"
termos = "chamada"

[acesso]
degraus = ["api", "leve"]

[leitura]
paginas_dos_achados = true
seguir_oficial = true               # do post de divulgação ao edital oficial
max_documentos = 20

[lexico]
termos = ["re:edital|chamada|chamamento|abre (selecao|inscric)|inscricoes abertas|premio|premiacao|selecao de (projetos|propostas|organizac|iniciativas)|seleciona (projetos|propostas|iniciativas)|fomento|fundo de apoio|apoio a (projetos|iniciativas|organizac)"]
termos_em = "titulo"            # site de notícias: o título de um edital diz que é edital
vetos = ["re:resultado|selecionad[ao]s|contemplad|^confira|editais (com inscricoes )?abert|oportunidades (do|da|de) (mes|semana)|finalistas|vencedor"]
