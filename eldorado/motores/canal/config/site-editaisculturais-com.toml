# 09/11/2026 (titular, R51): um motor por site de divulgação — criado com a sondagem de 09/11 (API do WordPress).
[motor]
id = "site-editaisculturais-com"
numero = 60
grupo = "Sites de divulgação — cultura"
nome = "Editais Culturais (.com)"
categoria = "Portais e fontes do terceiro setor"
categoria_estudo = "POR"
finalidade = "os editais de cultura divulgados pelo Editais Culturais (.com)"
canal = "api"
uf = "BR"
destino = "biblioteca"
nomes_anteriores = []

[[fonte]]
nome = "Editais Culturais (.com) — página de editais"
url = "https://editaisculturais.com/editais"
tipo = "pagina"
papel = "alternativa"

[[fonte]]
nome = "mapa do site (editaisculturais.com)"
url = "https://editaisculturais.com/wp-sitemap.xml"
tipo = "mapa"
papel = "alternativa"

[[fonte]]
nome = "Editais Culturais (.com) — editais abertos a OSC (API pública)"
url = "https://editaisculturais.com/api/public/editais"
tipo = "api"
papel = "principal"
caminhos = { itens = "items[?(contains(tipo_participacao, 'pessoa_juridica_sem_fins') || contains(tipo_participacao, 'coletivo')) && !contains(nome, 'TESTE') && !contains(nome, 'Teste')]", titulo = "nome", link = "join('', ['https://editaisculturais.com/editais/', slug])", data = "data_abertura", inicio = "data_abertura", fim = "data_encerramento_prorrogacao || data_encerramento", resumo = "join(' · ', [cidade_edital || '', estado_edital || '', tipo || ''])", uf = "estado_edital" }

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true
seguir_oficial = true

[lexico]
idade_maxima_dias = 120
exige_prazo = true   # 10/11/2026 (titular): só vira livro a página com prazo de inscrição vigente
termos = ["re:edital|editais|chamad|chamamento|sele[çc][ãa]o|pr[êe]mio|inscri[çc]|fomento|apoio a projetos|financiamento|programa de (apoio|acelera)|doa[çc][ãa]o|grant|call for|proposals?|funding|fellowship|how to apply|oportunidades"]
vetos = ["re:^(editais|oportunidades|editais abertos|editais em curso|editais e projetos|nossos editais|central de editais|veja os editais abertos|grants and fellowships|grants|fellowship|financiamento e entrega|apply for funding|processo de sele[çc][ãa]o|projetos e editais|chamadas|chamadas p[úu]blicas|editais do ano|portal de chamadas|our grants|grant-making)$|presta[çc][ãa]o de contas?|resultado|selecionad|homologa|vagas|emprego|trabalhe conosco|licita[çc]|preg[ãa]o|awarded|past grants|newsletter|privacidade|cookies|^entrar$|^login|imprensa|podcast|concurso p[úu]blico|est[áa]gio", "re:contrata[çc][ãa]o|presta[çc][ãa]o de servi[çc]os|prestadores de servi|microempreendedor|\\bmei\\b|pessoas? jur[íi]dicas? especializad|ocupa[çc][ãa]o de estandes|^of[íi]cio|pol[íi]tica de cotas"]
termos_em = "titulo"
# 08/11/2026: a municipal de outro estado sai na entrada, pela UF do item (R27)
territorio = "goias"

[metrica]
cadencia_h = 24
periodo_dias = 14

[aprendizado]
rotas_que_falharam = ["https://editaisculturais.com/wp-json/wp/v2/posts?orderby=date&per_page=50 — retirada em 14/11/2026 (o site não é WordPress: o endereço devolve a página do aplicativo; parecer dos motores da Bússola)"]
licoes = ["09/11/2026: criado pela decisão da titular (R51) — motor 60, grupo «Sites de divulgação — cultura»; site de divulgação (replicador): o motor segue até o edital oficial"]
