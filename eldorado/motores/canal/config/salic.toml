# Lei Rouanet (Lei 8.313/1991): incentivo fiscal federal à cultura. A oportunidade é o próprio mecanismo: a apresentação
# de propostas culturais no Salic, nas condições da instrução normativa vigente. Nenhuma data ou limite fica fixado
# aqui: o motor lê a página oficial de legislação e o Cartório certifica a partir do texto. Lição do Eldorado0: o
# www.gov.br bloqueou 223 vezes clientes que não pareciam navegador (o motor começa pela assinatura de navegador).
[motor]
id = "salic"
nome = "Lei Rouanet — incentivo fiscal federal à cultura"
categoria = "Incentivos fiscais"
finalidade = "o mecanismo de incentivo (propostas no Salic) e os editais publicados no âmbito da Lei Rouanet"
canal = "portal"
uf = "BR"
categoria_estudo = "EXE"
nomes_anteriores = ["rouanet", "plat-salic", "f260-espalhado-rouanet-cultura-gov-br"]

[programa]
titulo = "Lei Rouanet (Lei 8.313/1991) — apresentação de propostas culturais no Salic"
orgao = "Ministério da Cultura"
modalidade = "incentivo fiscal (mecenato)"
link_divulgacao = "https://www.gov.br/cultura/pt-br/assuntos/acoes-programas-e-politicas/lei-rouanet"
link_oficial = "https://www.gov.br/cultura/pt-br/assuntos/acoes-programas-e-politicas/lei-rouanet/legislacao"
documentos = ["https://www.gov.br/cultura/pt-br/assuntos/acoes-programas-e-politicas/lei-rouanet/legislacao",
              "https://www.gov.br/cultura/pt-br/assuntos/acoes-programas-e-politicas/lei-rouanet"]

[programa.normas]
padrao = "instrucao normativa|portaria|decreto"
maximo = 2

[legislacao]
leis = ["lei-8313-1991"]
notas = "A janela anual de propostas, os limites e as regras vêm da instrução normativa vigente, lida na página oficial."

[[fonte]]
nome = "Lei Rouanet — página do programa (editais e normas)"
url = "https://www.gov.br/cultura/pt-br/assuntos/acoes-programas-e-politicas/lei-rouanet"
tipo = "pagina"

[acesso]
degraus = ["leve", "api"]

[leitura]
paginas_dos_achados = true
seguir_oficial = true
max_documentos = 10

[lexico]
termos = ["re:edital|chamada|chamamento|selecao|instrucao normativa|calendario|prazo|apresentacao de propostas"]
vetos = ["re:resultado|homologa|aprovad|contemplad"]
termos_em = "titulo"

[programa.extracao]
# A análise própria do motor de incentivo, para o texto das NORMAS (resoluções, instruções normativas, portarias).
nao_certificar = ["Resultado", "Prazo de recurso", "Anexos", "Esfera", "Modalidade", "Órgão / financiador", "Território", "Área de atuação"]

[programa.extracao.itens]
"Prazo de inscrição" = [
  '(?:apresenta[çc][ãa]o de (?:propostas|projetos)|inscri[çc][ãa]o de (?:propostas|projetos)|(?:propostas|projetos) (?:culturais )?(?:poder[ãa]o ser|ser[ãa]o) (?:apresentad|inscrit)[oa]s)[^.;]{0,200}?((?:de|entre|no per[íi]odo de)\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?\s+(?:a|e|at[ée])\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?)',
  '(?:prazo|per[íi]odo) (?:para|de) (?:a )?(?:apresenta[çc][ãa]o|inscri[çc][ãa]o)[^.;]{0,160}?(\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?\s+(?:a|at[ée])\s+\d{1,2}[ºo°]?(?:\s*de\s+[a-zç]+|/\d{1,2})(?:\s*de\s+\d{4}|/\d{2,4})?)',
]
"Valor" = [
  '((?:limite|valor m[áa]ximo|teto|n[ãa]o poder[áa] ultrapassar|at[ée] o (?:limite|valor) de)[^.;]{0,120}?R\$\s*[\d.,]+(?:\s*(?:mil|milh[õo]es))?)',
]
"Requisitos" = [
  '((?:poder[ãa]o (?:apresentar|propor|inscrever)|s[ãa]o (?:proponentes|eleg[íi]veis)|o proponente (?:dever[áa]|deve))[^.;]{15,300})',
]
"Objeto" = ['((?:apresenta[çc][ãa]o|propostas?) de (?:projetos|propostas) culturais[^.;]{10,200})']
