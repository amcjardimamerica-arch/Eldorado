# Diário Oficial do Estado de Goiás — criado pela orientação eldorado/motores/skills/criar-motor/SKILL.md (a partir do estudo da titular, 19/10/2026).
# Rotas candidatas comentadas: só entra a que respondeu na sondagem (eldorado sondar).

[motor]
uf = "GO"
canal = "diario"
id = "do-goias"
nome = "Diário Oficial do Estado de Goiás"
categoria = "Executivo — diários e portais do governo"
categoria_estudo = "EXE"
finalidade = "encontrar oportunidade aberta para OSC em diário oficial estadual — SECULT, SEDS, SES, SEEL e decretos de emenda"
tipo_finalidade = "descoberta"
nomes_anteriores = []

# ---- rotas confirmadas na sondagem e nas páginas gravadas (23/10/2026, testes/paginas/do-goias/):
# as edições do dia (JSON) → o sumário de cada edição (árvore por órgão e seção) → o texto integral de cada matéria.
[[fonte]]
nome = "Diário Oficial de Goiás — edições de hoje"
url = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/edicoes_from_data/{hoje:%Y-%m-%d}.json"
tipo = "cadeia"
papel = "principal"

[[fonte.cadeia]]
formato = "json"
itens = "itens"
campos = { edicao = "id", numero = "numero", suplemento = "suplemento" }

[[fonte.cadeia]]
formato = "html"
url = "https://diariooficial.abc.go.gov.br/portal/visualizacoes/view_html_diario/{edicao}"
itens = "a.linkMateria"
campos = { materia = "attr:data-materia-id", protocolo = "attr:data-protocolo", titulo = 're:#\d+\s*-\s*(.*?)\s*</a>', caminho = "ancestrais:span.folder" }

[fonte.pista]
titulo = "{titulo}"
link = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/publicacoes_ver_conteudo/{materia}"
resumo = "{caminho} · edição {numero} · protocolo {protocolo}"

[[fonte]]
nome = "Diário Oficial de Goiás — edições de ontem (os suplementos publicados depois)"
url = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/edicoes_from_data/{hoje-1:%Y-%m-%d}.json"
tipo = "cadeia"
papel = "alternativa"

[[fonte.cadeia]]
formato = "json"
itens = "itens"
campos = { edicao = "id", numero = "numero", suplemento = "suplemento" }

[[fonte.cadeia]]
formato = "html"
url = "https://diariooficial.abc.go.gov.br/portal/visualizacoes/view_html_diario/{edicao}"
itens = "a.linkMateria"
campos = { materia = "attr:data-materia-id", protocolo = "attr:data-protocolo", titulo = 're:#\d+\s*-\s*(.*?)\s*</a>', caminho = "ancestrais:span.folder" }

[fonte.pista]
titulo = "{titulo}"
link = "https://diariooficial.abc.go.gov.br/apifront/portal/edicoes/publicacoes_ver_conteudo/{materia}"
resumo = "{caminho} · edição {numero} · protocolo {protocolo}"


# 08/11/2026 (passada no Chrome): a busca de texto completo do próprio DOE (a mesma do formulário "Buscar no ABC", Elasticsearch)
# com período — nos 30 d achou 13 chamamentos para OSC e cultura (Santo Antônio do Descoberto, DGPP, SEDS, CMDCA Catalão, PNAB de
# Quirinópolis, Vianópolis, Mossâmedes, Piracanjuba, Panamá…) que a leitura da edição do dia trazia com título genérico ("Edital").
[[fonte]]
nome = "Diário Oficial de Goiás — busca de texto completo: avisos de chamamento público (ontem e hoje)"
url = "https://diariooficial.abc.go.gov.br/busca/busca/buscar/query/1/di:{hoje-1:%Y-%m-%d}/df:{hoje:%Y-%m-%d}/?1=1&q=%22{termo}%22"
tipo = "cadeia"
papel = "alternativa"
valores = { termo = ["chamamento%20p%C3%BAblico", "termo%20de%20fomento", "termo%20de%20colabora%C3%A7%C3%A3o", "organiza%C3%A7%C3%A3o%20da%20sociedade%20civil"] }

[[fonte.cadeia]]
formato = "json"
itens = "hits.hits"
campos = { id = "_id", conteudo = "_source.conteudo" }
limite = 50

[[fonte.cadeia]]
formato = "linhas"
itens = '(?i)(?P<titulo>(?:aviso|edital) de chamamento p[uú]blico[^.]{0,220}|torna p[uú]blic[oa] (?:a abertura|o edital)[^.]{0,220})'
campos = { de = "conteudo" }
filtro = { titulo = '^(?!.*(credenciamento (de|para) (pessoas|empresas|profissionais|cl[ií]nicas|restaurantes|fornec)|para o credenciamento|resultado|errata|suspens|retifica|lista de classificados|inexigibilidade))' }
limite = 40

[fonte.pista]
titulo = "DOE-GO: {titulo}"
link = "https://diariooficial.abc.go.gov.br/buscanova/#/p=1&q={id}"
resumo = "Diário Oficial do Estado de Goiás — aviso achado pela busca de texto completo (página {id})"

[[alvo]]
id = "f260-captacao-034"
nome = "Fundo de Arte e Cultura de Goiás - projeto cultural geral"
enderecos = ["https://goias.gov.br/cultura/", "https://diariooficial.abc.go.gov.br/", "https://www.goias.gov.br/cultura/pnab/edital-2026-pnab/"]
orgao = "Secretaria de Estado da Cultura de Goiás (Secult-GO)"

[[alvo]]
id = "f260-captacao-206"
nome = "Convênio com órgão público estadual"
enderecos = ["https://diariooficial.abc.go.gov.br/"]   # 08/11/2026: a página inicial do PNCP não tem conteúdo de oportunidade (entregava a própria home)
orgao = "PNCP / Diário Oficial de Goiás"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true          # o texto integral da matéria, como publicado (divulgação; a origem é decidida por livro)
seguir_oficial = false
max_documentos = 40

[lexico]
# o léxico próprio do Diário de Goiás (camada de direcionamento, nos títulos das matérias), das páginas reais de 22/10.
# 08/11/2026 (parecer: 28 decididos, 4 acertos; erros: compra/contrato 5, não é para OSC 4): o "credenciamento" solto trazia
# credenciamento de prestadores dos municípios; o "edital de comunicação/publicação" é aviso de licença ambiental de empresa;
# o "edital de convocação" é assembleia. O credenciamento fica só o de entidades, organizações e agentes culturais.
termos = ["re:chamamento|chamada p[uú]blica|credenciamento (de |para )?(entidades|organiza|osc|institui|agentes culturais|artistas|projetos|espa[çc]os culturais)|termo de (fomento|colabora)|acordo de coopera|sele[çc][ãa]o (p[uú]blica|de (projetos|propostas|organiza|entidades))|pr[êe]mio|premia[çc][ãa]o|patroc[ií]nio|aldir blanc|pnab|paulo gustavo|fundo (estadual|de arte)|apoio a projetos|^edital$|edital (de|n[ºo°])"]
vetos = ["re:cita[çc][ãa]o|intima[çc][ãa]o|notifica[çc][ãa]o|penalidade|convoca[çc][ãa]o de (candidatos|aprovados)|aprovados no processo seletivo|processo seletivo simplificado|concurso|resultado|homologa|preg[ãa]o|tomada de pre[çc]os|concorr[êe]ncia|extrato|aditivo|apostilamento|portaria|exonera|nomea|aposenta|leil[ãa]o|aliena[çc][ãa]o|inexigibilidade|dispensa de licita",
         "re:edital de (comunica[çc][ãa]o|publica[çc][ãa]o|convoca[çc][ãa]o|cita[çc][ãa]o|notifica)|convoca[çc][ãa]o (de |da |para )?(age|ago|assembl)|assembl[ée]ia|licen[çc]a (ambiental|pr[ée]via|de instala|de opera)|\\bdispensa\\b"]   # a retificação de um chamamento aberto fica (pode mudar o prazo)
termos_em = "titulo"

[aprendizado]
licoes = ["08/11/2026 (passada completa no Chrome, Claude × motores 30 d): a edição do dia (JSON) dá títulos genéricos (\"Edital\", \"Chamamentos Públicos\") que não casam com nada; a busca de texto completo do DOE (/busca/busca/buscar/query/{p}/di:/df:/?q=\"…\") devolve a página inteira e o aviso de chamamento é recortado dela (ferramenta nova: cadeia \"linhas\" sobre um campo já lido). 30 d: 13 avisos para OSC/cultura, nenhum casou com os 55 achados do motor.", "08/11/2026 (parecer): a edição 'de hoje' rende mais (30 pistas acumuladas) que a 'de ontem' (8); a de ontem fica para os suplementos.", "08/11/2026: o 'edital de comunicação/publicação' é aviso de licença ambiental de empresa e o 'edital de convocação' é assembleia: vetados pelo título; o credenciamento só o de entidades e agentes culturais.", "Rota de acesso única para os domínios com bloqueio (diariooficial.abc.go.gov.br, goias.gov.br): ponte pelo Brasil, navegador do titular ou espelho.", "O afinador já achou 1 rota(s) que funcionaram: entram como rotas do motor.", "1 fonte(s) abrem a página e não acham nada: verificar contra as publicações conhecidas; candidatas ao teste do copiloto de IA.", "Os 2 alvos são vigiados só na janela prevista da próxima edição.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: ['https://goias.gov.br/social/cedca/']"]
bloqueios_conhecidos = ["diariooficial.abc.go.gov.br", "goias.gov.br"]
alternativas_para_bloqueio = []
rotas_que_falharam = ["https://diariooficial.abc.go.gov.br/apifront/portal/visualizacoes/view_html_diario/{edicao} (404, 23/10/2026)",
                      "https://diariooficial.abc.go.gov.br/portal/visualizacoes/view_html_materia/{materia} (404, 23/10/2026)",
                      "/portal/edicoes e /portal/visualizacoes/pesquisa (caminhos que não existem: o motor antigo ficou um mês sem ler)"]

[metrica]
cadencia_h = 12
periodo_dias = 14
