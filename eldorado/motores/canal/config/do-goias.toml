# 08/11/2026 (passada no Chrome): a busca de texto completo do próprio DOE (a mesma do formulário "Buscar no ABC", Elasticsearch)
# com período — nos 30 d achou 13 chamamentos para OSC e cultura (Santo Antônio do Descoberto, DGPP, SEDS, CMDCA Catalão, PNAB de
# Quirinópolis, Vianópolis, Mossâmedes, Piracanjuba, Panamá…) que a leitura da edição do dia trazia com título genérico ("Edital").
[[fonte]]
nome = "Diário Oficial de Goiás — busca de texto completo: avisos de chamamento público (ontem e hoje)"
url = "https://diariooficial.abc.go.gov.br/busca/busca/buscar/query/1/di:{hoje-1:%Y-%m-%d}/df:{hoje:%Y-%m-%d}/?1=1&q=%22{termo}%22"
tipo = "cadeia"
papel = "alternativa"
valores = { termo = ["chamamento%20p%C3%BAblico", "termo%20de%20fomento", "termo%20de%20colabora%C3%A7%C3%A3o", "organiza%C3%A7%C3%A3o%20da%20sociedade%20civil"] }

[[fonte.cadeia]]
formato = "json"
itens = "hits.hits"
campos = { id = "_id", conteudo = "_source.conteudo" }
limite = 50

[[fonte.cadeia]]
formato = "linhas"
itens = '(?i)(?P<titulo>(?:aviso|edital) de chamamento p[uú]blico[^.]{0,220}|torna p[uú]blic[oa] (?:a abertura|o edital)[^.]{0,220})'
campos = { de = "conteudo" }
filtro = { titulo = '^(?!.*(credenciamento (de|para) (pessoas|empresas|profissionais|cl[ií]nicas|restaurantes|fornec)|para o credenciamento|resultado|errata|suspens|retifica|lista de classificados|inexigibilidade))' }
limite = 40

[fonte.pista]
titulo = "DOE-GO: {titulo}"
link = "https://diariooficial.abc.go.gov.br/buscanova/#/p=1&q={id}"
resumo = "Diário Oficial do Estado de Goiás — aviso achado pela busca de texto completo (página {id})"

