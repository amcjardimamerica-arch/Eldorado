[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true
seguir_oficial = true               # a busca cega: do post de divulgação a um documento candidato à origem
max_documentos = 20

[lexico]
territorio = "goias"
exige_prazo = true   # 10/11/2026 (titular): só vira livro a página com prazo de inscrição vigente
termos = ["re:edital|chamada|chamamento|abre (selecao|inscric)|inscricoes abertas|premio|premiacao|selecao de (projetos|propostas|organizac|iniciativas)|seleciona (projetos|propostas|iniciativas)|fomento|fundo de apoio|apoio a (projetos|iniciativas|organizac)|inscricoes abertas ate|seleciona ate|recebe (inscric|propostas|projetos)"]
termos_em = "titulo"            # site de notícias: o título de um edital diz que é edital
vetos = ["re:resultado|selecionad[ao]s|contemplad|^confira|editais (com inscricoes )?abert|oportunidades (do|da|de) (mes|semana)|finalistas|vencedor"]
# 08/11/2026: o mapa do site trazia o acervo inteiro (181 de 184 achados); a data do mapa e a lida na página barram o antigo
idade_maxima_dias = 120

[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 30, grupo «Sites de divulgação — terceiro setor»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): o post-resumo mensal (\"Confira editais com inscrições abertas para novembro\", 02/11) traz 3 editais com prazos próprios (Plan até 11/11; SoMar Azul até 05/11; AngloGold até 06/11) — o motor precisa desmembrar o post por seção (proposta de ferramenta).", "08/11/2026 (parecer): 83 livros de notícia, 181 de 184 achados do mapa do site (o acervo inteiro). Agora: idade máxima de 120 dias (pela data do mapa e pela lida na página), a API do WordPress pelos mais novos, e a seleção mensal \"Confira editais com inscrições abertas\" lida edital por edital, cada um com o link do financiador ou do PDF."]
