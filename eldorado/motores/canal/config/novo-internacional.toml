licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 29, grupo «Editais de fundações»; reúne site-undef", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): alvos sem valor na passada: USAID (desmontada desde fev/2025), UNESCO FIDC (404), facebook.com/community (indisponível e exige login pessoal), UNDEF (última rodada fechou em 28/02/2025). O Chrome da titular traduz páginas em inglês: o léxico do motor (sem tradução) precisa de \"open call\", \"request for proposals\", \"deadline\". Decisão da titular para retirar (R19).", "08/11/2026 (parecer): 24 páginas institucionais (\"our grants\", \"Central de Editais | Prosas\") viraram livro; Ford, Open Society e Rockefeller funcionam por convite (as páginas ficam como vigilância, sem livro); a rota do Erasmus+ saiu (nunca rendeu); entraram as buscas dos pequenos fundos das embaixadas (Japão, Canadá, Austrália) e a busca em espanhol; idade máxima de 180 dias e o prazo vencido do título na entrada.", "Rota de acesso única para os domínios com bloqueio (sgp.undp.org, www.facebook.com, www.globalfundforwomen.org, www.undp.org, www.unesco.org): ponte pelo Brasil, navegador do titular ou espelho.", "O afinador já achou 6 rota(s) que funcionaram: entram como rotas do motor.", "17 fonte(s) abrem a página e não acham nada: verificar contra as publicações conhecidas; candidatas ao teste do copiloto de IA.", "Os 21 alvos são vigiados só na janela prevista da próxima edição.", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): apply-for-funding: a última rodada encerrou em 28/02/2025, nenhuma aberta — fonte parada (fusão → novo-internacional recomendada no parecer).", "08/11/2026 (parecer): os seis livros eram páginas de ajuda da candidatura (\"How Proposals are Assessed\", \"Technical Guidance\", \"blank project proposal form\"): vetadas pelo título. A chamada é anual: fonte esporádica (vigilância sem erro). DECISÃO PENDENTE DA TITULAR (R19): fundir em novo-internacional, como o parecer recomenda.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []"]
