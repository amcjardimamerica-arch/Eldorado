filtro = { link = '^(?!.*(credenciamento-(?!.*(entidade|osc|organizac|cultur|artist|projeto))|leiloeir|prestacao-servicos|servicos-(medic|laborator|limpeza|vigilan|hospital)|medicos|combustiv|laboratori|residencia-medica|registro-precos|aquisicao|contratacao|locacao|teleconsulta|pregao|lavagem|logistica)).*' }

