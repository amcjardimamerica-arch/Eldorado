papel = "principal"
# 08/11/2026 (parecer): o CapitaAI lista também as compras públicas (credenciamento de médicos, laboratórios, combustível,
# leiloeiros, lavagem de veículos, TI): o endereço de cada página diz o objeto; só segue o que não é compra/contratação
