# Diário Oficial da União: a "Leitura do Jornal" de cada dia (seções 1 e 3), com o filtro calibrado pelo Eldorado0
# com as 55.567 matérias de setembro/2026. A página pode ter até 12 MB; só vale o <script id="params"> EXATO.
[motor]
id = "dou"
nome = "Diário Oficial da União"
categoria = "Diários oficiais"
finalidade = "chamamentos, fomento, prêmios e programas federais para organizações da sociedade civil"
canal = "diario"
uf = "BR"
categoria_estudo = "EXE"
nomes_anteriores = []

[[fonte]]
nome = "DOU — Leitura do Jornal"
url = "https://www.in.gov.br/leiturajornal?data={dia}&secao={secao}"
tipo = "api"
json_em = "script#params"
valores = { dia = ["{hoje:%d-%m-%Y}", "{hoje-1:%d-%m-%Y}"], secao = ["do1", "do3"] }

[fonte.caminhos]
itens = "jsonArray[*]"
titulo = "join(' — ', [artType || '', title || ''])"
link = "join('', ['https://www.in.gov.br/web/dou/-/', urlTitle])"
data = "pubDate"
resumo = "content"
orgao = "hierarchyStr"
secao = "pubName"

# ---- os alvos do estudo (19/10/2026): pontos de captação vigiados na janela prevista; endereços do cadastro.

[[alvo]]
id = "f260-captacao-134"
nome = "MDHC - editais de direitos humanos"
enderecos = ["https://www.in.gov.br/"]
orgao = "Diário Oficial da União — Seção 3 (avisos e editais)"

[[alvo]]
id = "f260-captacao-207"
nome = "Acordo de cooperação sem transferência financeira"
enderecos = ["https://www.in.gov.br/"]
orgao = "Diário Oficial da União — Seção 3 (avisos e editais)"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)
intervalo_s = 1.0

[leitura]
documentos = false
paginas_dos_achados = true          # a íntegra da matéria é a página /web/dou/-/<urlTitle>
max_documentos = 40

[lexico]
termos = ["re:chamamento|chamada publica|termo de fomento|termo de colabora|13\\.019|sociedade civil|\\boscs?\\b|sem fins lucrativos|filantrop|conanda|\\bfnca\\b|fundo nacional (dos direitos )?da crianca|fundo nacional d[oa] (pessoa )?idos|\\bpnab\\b|aldir blanc|paulo gustavo|rouanet|pronon|pronas|incentivo ao esporte|emendas? parlamentar|premio|premiacao|selecao de projetos|edital de selecao|pontos? de cultura|cultura viva|doacao|patrocinio|direitos difusos|fundo nacional do meio ambiente"]
vetos = ["re:licitacao|pregao|adjudica|registro de precos|^extrato de contrato|termo aditivo|apostilamento|rescisao|penalidade|intimacao|notificacao|citacao|registro de diploma|suspensao|distrato|comodato|permissao de uso|ato declaratorio|acordao|pauta|ordem de fornecimento|fornecimento de|revogacao|anulacao|homologacao"]
salvos = ["re:chamamento|fomento|colabora"]
