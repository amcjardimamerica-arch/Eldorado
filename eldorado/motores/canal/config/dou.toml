# Diário Oficial da União — organização dos 43 motores (titular, 09/11/2026): motor 04, grupo «Diários oficiais».
# O mesmo motor, renumerado e renomeado.

[motor]
id = "dou"
numero = 4
grupo = "Diários oficiais"
nome = "Diário Oficial da União"   # 09/11/2026 (titular): o nome simplificado; antes «Diário Oficial da União»
categoria = "Diários oficiais"
categoria_estudo = "EXE"
finalidade = "chamamentos, fomento, prêmios e programas federais para organizações da sociedade civil"
canal = "diario"
uf = "BR"
destino = "biblioteca"
nomes_anteriores = []

[[fonte]]
nome = "DOU — Leitura do Jornal"
url = "https://www.in.gov.br/leiturajornal?data={dia}&secao={secao}"
tipo = "api"
json_em = "script#params"
valores = { dia = ["{hoje:%d-%m-%Y}", "{hoje-1:%d-%m-%Y}"], secao = ["do1", "do3"] }

[fonte.caminhos]
itens = "jsonArray[*]"
titulo = "join(' — ', [artType || '', title || ''])"
link = "join('', ['https://www.in.gov.br/web/dou/-/', urlTitle])"
data = "pubDate"
resumo = "content"
orgao = "hierarchyStr"
secao = "pubName"

# 08/11/2026 (parecer; inspirado no Ro-DOU, github.com/gestaogovbr/Ro-dou, o clipping do DOU do Ministério da Gestão): a
# rota ALTERNATIVA pela busca do próprio DOU, que traz também as EDIÇÕES EXTRAS (a Leitura do Jornal só lê do1 e do3) e
# continua lendo quando o bloco script#params da Leitura do Jornal não vem (14 de 108 leituras em 30 dias). Conferida ao
# vivo em 08/11/2026 com a edição de 06/11: 50 resultados por consulta, os mesmos campos (artType, title, urlTitle).
[[fonte]]
nome = "DOU — busca por termo (ontem e hoje, todas as seções e extras)"
url = "https://www.in.gov.br/consulta/-/buscar/dou?q={q}&s=todos&exactDate=personalizado&publishFrom={hoje-1:%d-%m-%Y}&publishTo={hoje:%d-%m-%Y}&sortType=0&delta=75"
tipo = "api"
papel = "alternativa"
json_em = "script#_br_com_seatecnologia_in_buscadou_BuscaDouPortlet_params"
valores = { q = ["chamamento", "fomento"] }

[fonte.caminhos]
itens = "jsonArray[*]"
titulo = "join(' — ', [artType || '', title || ''])"
link = "join('', ['https://www.in.gov.br/web/dou/-/', urlTitle])"
data = "pubDate"
resumo = "content"
orgao = "hierarchyStr"
secao = "pubName"

