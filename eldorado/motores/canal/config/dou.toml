[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 04, grupo «Diários oficiais»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): na busca do DOU, frases compostas com aspas (\"A\" \"B\") e \"termo de fomento\" devolvem 0; o teto é 75 por consulta (75 resultados cobriram só ~10 dias) — fatiar o período ou consultar uma frase por vez (\"edital de chamamento público\", \"aviso de chamamento público\", s=do3). Nos 30 d: Goiandira, Funarte nº 7 e 8, Quirinópolis, Vianópolis, Piracanjuba, Mossâmedes, Rubiataba, FUNAI.", "08/11/2026 (parecer): 1.317 extratos de parceria já firmada descartados em 30 dias — o veto pelo título agora pega todo extrato, e o salvo só vale para o título que anuncia o chamamento.", "08/11/2026: a busca do DOU (como o Ro-DOU) é a rota alternativa: traz as edições extras e lê quando o script#params da Leitura do Jornal falha (14 de 108 leituras).", "08/11/2026: a prefeitura de outro estado (não capital) sai na entrada pelo hierarchyStr (R27); a federal e a de Goiás ficam.", "14/11/2026 (análise externa em 3 grupos, pelo Claude no Chrome): 15 livros: 0 válidos, 1 encerradas, 14 descartes — vetos +1; vetos_endereco +4; idade_maxima_dias=180"]
bloqueios_conhecidos = []
alternativas_para_bloqueio = ["DOU — busca por termo (a mesma base, outro endereço)"]
rotas_que_falharam = ["os alvos na página inicial in.gov.br (sem conteúdo de oportunidade; 11 de 101 leituras no computador local)"]

[leitura]
documentos = false
paginas_dos_achados = true          # a íntegra da matéria é a página /web/dou/-/<urlTitle>
max_documentos = 40

[lexico]
# 08/11/2026 (parecer: 82 decididos, 4 acertos — a pior precisão entre os motores de volume; em 30 dias a pertinência
# descartou 1.317 extratos de parceria já firmada, 154 extratos/dispensas e 146 de município de outro estado):
# - todo EXTRATO sai pelo título (o tipo do ato vem no começo: "Extrato de Termo de Fomento — ...");
# - o "salvo" fica só para o título que anuncia o chamamento (antes "fomento|colabora" salvava os extratos);
# - a regra territorial do portão (R27) já na entrada: a prefeitura de outro estado que não é capital não entra.
termos = ["re:chamamento|chamada publica|termo de fomento|termo de colabora|13\\.019|sociedade civil|\\boscs?\\b|sem fins lucrativos|filantrop|conanda|\\bfnca\\b|fundo nacional (dos direitos )?da crianca|fundo nacional d[oa] (pessoa )?idos|\\bpnab\\b|aldir blanc|paulo gustavo|rouanet|pronon|pronas|incentivo ao esporte|emendas? parlamentar|premio|premiacao|selecao de projetos|edital de selecao|pontos? de cultura|cultura viva|doacao|patrocinio|direitos difusos|fundo nacional do meio ambiente"]
vetos = ["re:licitacao|pregao|adjudica|registro de precos|\\bextrato\\b|termo aditivo|apostilamento|rescisao|penalidade|intimacao|notificacao|citacao|registro de diploma|suspensao|distrato|comodato|permissao de uso|ato declaratorio|acordao|pauta|ordem de fornecimento|fornecimento de|revogacao|anulacao|homologacao|\\bresultado\\b|habilitacao|convocacao|dispensa de chamamento|inexigibilidade|^despacho", "re:\\b(noticia|licitacao|pregao|credenciamento de (fornecedor|prestador)|processo seletivo|concurso|curso)\\b"]
# o salvo: só o título que anuncia o chamamento (e não o resultado, o extrato do termo ou a homologação dele); a prorrogação
# e a retificação de um chamamento aberto ficam (podem mudar o prazo)
salvos = ["re:^(aviso|edital|aviso de licitacao|aviso de chamamento publico|chamamento publico|retificacao)\\s*—\\s*(?!.*(resultado|termo de (fomento|colabora)|homologa|habilita|convenio))(.*)(chamamento|chamada publica|edital de selecao)"]
territorio = "goias"
vetos_endereco = ["re:/noticias?/", "re:/agora/", "re:/eventos?/", "re:/cursos?/"]
idade_maxima_dias = 180
