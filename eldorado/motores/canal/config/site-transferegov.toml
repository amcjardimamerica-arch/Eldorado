[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 22, grupo «Executivo federal»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): capa do Transferegov: comunicado 33/2026 (2º cronograma das emendas individuais RP6, 2º ciclo) — sinal para a associação procurar parlamentar; programas abertos ficam no sistema, não na capa.", "08/11/2026 (parecer): 2.316 dos 2.324 achados de 30 dias eram links dos menus dos ministérios colhidos pelos alvos sem léxico; o alvo sem léxico agora entrega só a própria página.", "08/11/2026: o arquivo siconv_programa.zip (11 MB) era cortado pela ponte em 6 MB (108 de 118 leituras em erro); a ponte agora pede até 15 MB e cai no pedido direto se falhar."]
rotas_que_falharam = ["a leitura dos links dos portais www.gov.br/mds, /esporte, /mma e bndes.gov.br como oportunidades (menus)"]
