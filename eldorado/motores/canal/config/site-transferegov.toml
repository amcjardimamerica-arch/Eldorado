# Transferegov (dados abertos): os programas federais com recebimento de propostas aberto que aceitam entidades
# privadas sem fins lucrativos. Uma leitura por dia (o arquivo é atualizado diariamente).
[motor]
id = "site-transferegov"
nome = "Transferegov — programas abertos a OSC"
categoria = "Plataformas federais"
finalidade = "programas federais com propostas abertas para organizações da sociedade civil"
canal = "api"
uf = "BR"
categoria_estudo = "EXE"
nomes_anteriores = ["transferegov"]

[[fonte]]
nome = "Transferegov — programas (dados abertos)"
url = "https://api-publica.transferegov.gestao.gov.br/downloads/dadosgov/siconv_programa.zip"
tipo = "siconv"

