canal = "portal"
uf = "BR"
destino = "biblioteca"
nomes_anteriores = ["outros-agregadores", "outras-oportunidades-1", "outras-oportunidades-2", "outras-oportunidades-3", "outras-oportunidades-4", "outras-oportunidades-5", "outras-oportunidades-6", "outras-oportunidades-7", "outras-oportunidades-8", "plat-captamos", "outras-oportunidades"]

# 09/11/2026: veio do motor outros-agregadores (organização dos 43 motores)

# ---- rotas (23/10/2026, testes/paginas/agregadores-sondagem/): os agregadores que divulgam oportunidades de terceiros (a
# origem é decidida por livro) e a busca aberta. As 48 páginas avulsas dos antigos blocos "Outras oportunidades" eram
# oportunidades achadas uma a uma: hoje são livros, e o site original de cada uma é vigiado pelo mapa do site.

[[fonte]]
nome = "Editais do Brasil — oportunidades (fomento, bolsas, prêmios)"
url = "https://editaisdobrasil.com/oportunidades"
tipo = "pagina"
papel = "principal"

# 09/11/2026: veio do motor outros-agregadores (organização dos 43 motores)

# 08/11/2026 (passada no Chrome): /oportunidades é só o índice das categorias; os editais (sem data, listados como abertos)
# estão nas subpáginas — Cultura trouxe 7 do MinC/CNPq abertos.
[[fonte]]
nome = "Editais do Brasil — categoria Cultura"
url = "https://editaisdobrasil.com/oportunidades/cultura"
tipo = "pagina"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
