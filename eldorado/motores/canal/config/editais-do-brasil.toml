# Editais do Brasil — oportunidades — organização dos 43 motores (titular, 09/11/2026): motor 37, grupo «Sites de divulgação — terceiro setor».
# Criado a partir do MOTOR MODELO (eldorado/base/motor_modelo/modelo.toml); as seções de acesso, leitura, léxico, canivete e métrica vêm do motor irmão outros-agregadores, com a finalidade própria.

[motor]
id = "editais-do-brasil"
numero = 37
grupo = "Sites de divulgação — terceiro setor"
