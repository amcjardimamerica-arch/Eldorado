itens = '(?s)Processo (?P<processo>\d{5}\.\d{6}\.\d{4}-\d{2}).{0,80}?Assunto:\s*(?P<titulo>Projeto de Lei n[ºo°] ?\d+/\d{4}[^\n]{0,240}?)\s*Tipo:.{0,200}?Data de cria[çc][ãa]o:\s*(?P<data>\d{2}/\d{2}/\d{4})'
