[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 05, grupo «Legislativo»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): o SUAP respondeu do Brasil por GET (consulta_publica?classificacao=PL&assunto=utilidade pública&ano=AAAA): fonte acrescentada com exige_brasil; nos 30 d trouxe 4 PLs que o motor não tinha (só tinha as notícias/diários). A busca @@search do Plone expira (>7 s); o search_rss continua sendo a rota rápida.", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): o Querido Diário mudou de endereço (queridodiario.ok.org.br/api → 302 → api.queridodiario.org.br/gazettes) e estava 503 em 08/11 no Chrome e na nuvem; endereço trocado e rotas alternativas mantidas.", "08/11/2026 (experimento, edições de 04 e 05/11): 102 atos em dois dias, 56 despachos e portarias (o expediente interno: designa gestor, autoriza aditivo) — vetados pelo título; ficam os extratos e termos de fomento e colaboração, os chamamentos, as resoluções, as leis e as emendas (R14).", "08/11/2026 (parecer): o motor é de acompanhamento (R14): os atos vão à tela Legislativo e ficam na Biblioteca (R35), por isso a precisão do Cartório não o mede. A cadeia do Querido Diário passou a buscar também as emendas impositivas (a execução delas para entidades sai no diário: \"Recursos Ordinários para Atender Emenda Impositiva\"); o pagamento por indenização sai pelo título. O SUAP e o site da Câmara só respondem do Brasil (ponte ou computador local); a consulta do PL 288/2026 pelo número fica para a ponte.", "Acompanhar o Projeto de Lei nº 288/2026 (utilidade pública da A.M.C. Jardim América): a sanção sai no Diário do Município.", "Rota de acesso única para os domínios com bloqueio (saude.goiania.go.gov.br, www.goiania.go.gov.br, www.goiania.go.leg.br): ponte pelo Brasil, navegador do titular ou espelho.", "O afinador já achou 14 rota(s) que funcionaram: entram como rotas do motor.", "Os 4 alvos são vigiados só na janela prevista da próxima edição.", "Leitura pela ponte da Hostgator (IP brasileiro) quando os segredos ELDORADO_PONTE_URL e ELDORADO_PONTE_CHAVE estiverem gravados; até lá, só no computador do titular.", "Acompanhar o Projeto de Lei nº 288/2026 (utilidade pública da A.M.C. Jardim América).", "Leitura pela ponte da Hostgator (IP brasileiro) quando os segredos ELDORADO_PONTE_URL e ELDORADO_PONTE_CHAVE estiverem gravados; até lá, só no computador do titular.", "Acompanhar o Projeto de Lei nº 288/2026 (utilidade pública da A.M.C. Jardim América).", "robots_proibe: None", "ponte_brasil_aprendida: {'www.goiania.go.leg.br': True}", "alternativas_conhecidas: None"]
