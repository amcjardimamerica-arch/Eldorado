numero = 26
grupo = "Leis de incentivo fiscal"
nome = "Leis de Incentivo"   # 09/11/2026 (titular): o nome simplificado; antes «Leis e fundos de incentivo — empresas participantes (FIA, Idoso, Esporte, Pronas, Pronon e Goyazes)»
