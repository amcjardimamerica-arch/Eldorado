# Financiadores do terceiro setor com site em WordPress (API pública). Alguns publicam editais num tipo próprio
# (chamadas, edital), que já é só de oportunidades.
[motor]
id = "site-fundo-casa"
nome = "Fundo Casa Socioambiental"
categoria = "Portais e fontes do terceiro setor"
finalidade = "chamadas socioambientais"
canal = "api"
uf = "BR"
categoria_estudo = "POR"
nomes_anteriores = []

[[fonte]]
nome = "Fundo Casa Socioambiental — chamadas"
url = "https://casa.org.br/wp-json/wp/v2/chamadas?orderby=date"    # 08/11/2026: os mais novos primeiro
tipo = "wordpress"


# a rota alternativa (sondagem de 23/10/2026): o mapa do site, outro tipo de rota no mesmo órgão (o léxico filtra pelos endereços)
[[fonte]]
nome = "mapa do site (casa.org.br)"
url = "https://casa.org.br/sitemap_index.xml"
tipo = "mapa"
papel = "alternativa"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
paginas_dos_achados = true
seguir_oficial = true               # a busca cega: do post de divulgação a um documento candidato à origem
max_documentos = 20

[lexico]
termos = ["re:edital|chamada|chamamento|abre (selecao|inscric)|inscricoes abertas|premio|premiacao|selecao de (projetos|propostas|organizac|iniciativas)|seleciona (projetos|propostas|iniciativas)|fomento|fundo de apoio|apoio a (projetos|iniciativas|organizac)"]
termos_em = "titulo"            # site de notícias: o título de um edital diz que é edital
vetos = ["re:resultado|selecionad[ao]s|contemplad|^confira|editais (com inscricoes )?abert|oportunidades (do|da|de) (mes|semana)|finalistas|vencedor"]
# 08/11/2026: chamadas de 2025 (Mata Atlântica Viva, Amazônia Resiliente) entravam: a publicação com mais de seis meses, a do mapa do site e o prazo vencido do título saem na entrada
idade_maxima_dias = 180

[aprendizado]
licoes = ["08/11/2026 (parecer): 48,6% de precisão; os erros eram chamadas encerradas de 2025 (o tipo chamadas lista todas). Agora: o tipo chamadas pelos mais novos, idade máxima de 180 dias e o prazo vencido do título na entrada; o mapa do site só rende o que é novo."]
