# MPT-GO — editais de destinação (PRT 18ª Região) — organização dos 43 motores (titular, 09/11/2026): motor 12, grupo «Ministério Público».
# O mesmo motor, renumerado e renomeado.

[motor]
id = "mptgo-destinacao"
numero = 12
grupo = "Ministério Público"
nome = "MPT-GO — editais de destinação (PRT 18ª Região)"
categoria = "Judiciário e Ministérios Públicos"
categoria_estudo = "JUD"
finalidade = "editais de 5 dias do MPT-GO (todo dia) e habilitação da A.M.C."
tipo_finalidade = "descoberta"
canal = "portal"
uf = "GO"
orgao = "Ministério Público do Trabalho em Goiás (PRT 18ª Região)"
destino = "biblioteca"
nomes_anteriores = []

# ---- rotas (23/10/2026, testes/paginas/ministerios-publicos/): a página dos editais de destinação da PRT 18ª Região
# carrega a tabela por POST (Joomla, com o código de sessão da página e o cookie); por GET, 404. A cadeia abre a sessão
# na página (elo 1) e pede a tabela (elo 2). A alternativa é a busca em RSS do MPT nacional.
[[fonte]]
nome = "MPT-GO (PRT 18ª Região) — editais de destinação de recursos ou bens (os 30 mais recentes)"
url = "https://www.prt18.mpt.mp.br/servicos/editais-de-destinacao-de-recursos-bens"
tipo = "cadeia"
papel = "principal"

[[fonte.cadeia]]
formato = "html"
itens = "html"
campos = { codigo = 're:"name"\s*:\s*"([0-9a-f]{32})"\s*,\s*"value"\s*:\s*"1"' }
limite = 1

[[fonte.cadeia]]
formato = "json"
url = "https://www.prt18.mpt.mp.br/index.php"
itens = "aaData"
campos = { regiao = "[0]", data = "[1]", numero = "[2]", procedimento = "[3]", arquivo = "[4]" }
corpo = { option = "com_mpt", task = "editaisdestinacaorecursosoubens", format = "raw", "{codigo}" = "1", sEcho = "1", iDisplayStart = "0", iDisplayLength = "30", iSortCol_0 = "1", sSortDir_0 = "desc" }
limite = 30

[fonte.pista]
titulo = "Edital de destinação de recursos ou bens nº {numero} — {procedimento}"
link = "https://www.prt18.mpt.mp.br/servicos/editais-de-destinacao-de-recursos-bens?task=baixa&format=raw&arq={arquivo}"
resumo = "{regiao} · publicado em {data}"

[[fonte]]
nome = "MPT nacional — busca em RSS por editais de destinação"
url = "https://mpt.mp.br/search_rss?SearchableText=edital+destina%C3%A7%C3%A3o&sort_on=Date&sort_order=reverse"
tipo = "feed"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "MPT — Sistema de Destinações (cadastro nacional de entidades)"
url = "https://destinacoes.mpt.mp.br/"
tipo = "pagina"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "MPT-GO — cadastro de entidades"
url = "https://www.prt18.mpt.mp.br/15-servicos/99-cadastro-de-entidades"
tipo = "pagina"
papel = "alternativa"

# 09/11/2026: local novo (novo — pesquisa Chrome 09/11) — fonte
[[fonte]]
nome = "MPT-GO — notícias"
url = "https://www.prt18.mpt.mp.br/informe-se/noticias-do-mpt-go"
tipo = "pagina"
papel = "alternativa"

[acesso]
degraus = ["api", "leve", "lightpanda", "patchright", "camoufox", "arquivo", "local"]   # a escada completa (o motor padrão)

[leitura]
documentos = true                    # o edital de 5 dias (o arquivo da própria página)
paginas_dos_achados = true
seguir_oficial = false

[lexico]
termos = ["re:edital|destina|indica[çc][ãa]o|cadastr|entidade|bens|recursos"]
vetos = ["re:resultado da sele|homologa"]
termos_em = "titulo"

[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 12, grupo «Ministério Público»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): na tabela da PRT18 o link do edital se chama \"abrir/salvar\": o título vem da linha (Região + Data + Número) — ferramenta nova (título do item quando o link é genérico). 30 d: Goiânia 27/10 (094312.2026) e Anápolis 23/10 (010513.2026). O RSS nacional mistura datas dd/mm/aaaa e aaaa/mm/dd.", "08/11/2026 (parecer): o RSS nacional do MPT traz editais de outras regionais (MPT-SE, MPT/AL, MPT-CE): ficam (R27: a estadual de outro estado fica; R38: por último na ordem); a cláusula de quem pode participar é lida no edital (R30). O título que era nome de arquivo (\"edital...Gerado-em...pdf\") e o \"arquivo.pdf/view\" do Plone agora são lidos como o próprio edital.", "Rota de acesso única para os domínios com bloqueio (mpt.mp.br, www.gov.br): ponte pelo Brasil, navegador do titular ou espelho.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: ['https://www.gov.br/receitafederal/pt-br/assuntos/leiloes-e-destinacao-de-mercadorias']"]
bloqueios_conhecidos = ["mpt.mp.br", "www.gov.br"]
alternativas_para_bloqueio = []
rotas_que_falharam = ["a tabela da PRT 18 por GET (404): só por POST, na sessão da página (23/10/2026)", "https://www.gov.br/receitafederal/pt-br/assuntos/leiloes-e-destinacao-de-mercadorias (quebrada, no Eldorado0)"]

[metrica]
esporadica = true   # R48 (titular, 08/11/2026): o Judiciário e os MPs publicam raramente; a vigilância sem erro cumpre a finalidade
cadencia_h = 12   # os editais de 5 dias pedem leitura diária
periodo_dias = 14
