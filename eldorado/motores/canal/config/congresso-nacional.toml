[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 07, grupo «Legislativo»", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): na API da Câmara, ano=AAAA&ordenarPor=id devolve as proposições mais novas pela numeração (as de 2026 com os termos são de jul–ago: nada nos 30 d); dataInicio/dataFim filtram o que TRAMITOU no período (sociedade civil 8, sem fins lucrativos 12 nos 30 d). Trocado para dataInicio=ontem&dataFim=hoje; \"13.019\" e \"filantrópicas\" não casam como palavra-chave → \"Marco Regulatório\" e \"sem fins lucrativos\".", "08/11/2026 (parecer): o motor é de acompanhamento (R14): os atos vão à tela Legislativo e ficam na Biblioteca (R35); a recusa \"ato legislativo\" do portão é o caminho certo, não erro. A saída principal é o prazo das emendas da CMO (ex.: \"LOA 2027 — MANUAL DE EMENDAS e ORIENTAÇÕES\", 06/11/2026). O RSS do Senado repetia cada notícia em \"Áudio: …\": vetado pelo título.", "O prazo das emendas da LOA sai nos comunicados da CMO (por exemplo, 21/10/2026: Matérias Novas/Relatórios Entregues e prazo de emendas).", "Ler primeiro pela dados abertos da Câmara e do Senado; as páginas ficam como reserva.", "O afinador já achou 3 rota(s) que funcionaram: entram como rotas do motor.", "Os 1 alvos são vigiados só na janela prevista da próxima edição.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: []", "14/11/2026 (análise externa em 3 grupos, pelo Claude no Chrome): 10 livros: 0 válidos, 0 encerradas, 10 descartes — sem mudança no léxico: o veto por endereço /noticias/ cortava as notícias da Câmara e do Senado, que trazem as matérias e os prazos de emenda (a trava do legislativo)"]
bloqueios_conhecidos = []
alternativas_para_bloqueio = []
rotas_que_falharam = ["https://dadosabertos.camara.leg.br/api/v2/proposicoes?keywords=sociedade civil (vazio desde 01/09/2026: a palavra-chave da Câmara precisa de outro termo)"]

[metrica]
