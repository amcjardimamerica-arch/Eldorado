[aprendizado]
licoes = ["09/11/2026: organização dos 43 motores (titular) — motor 27, grupo «Editais de empresas privadas»; reúne motor-gife", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): 30 institutos e fundações abertos um a um: só o Funbio tinha chamadas abertas datadas (11/2026 Articulação Institucional até 04/12; Floresta Viva São Francisco até 02/12; TCSA Porto Sul até 09/11). Erros no Chrome: Fundação Bradesco, Instituto Localiza e Fundação ArcelorMittal (página de erro), Coca-Cola (domínio protegido). Lojas Renner: só editais encerrados.", "08/11/2026 (estudo Claude × motores): as rotas da Lojas Renner e da Maria Emília apontavam para a página de UM edital (por isso \"sem mudança\" em 120 leituras); navegando, as páginas certas são /editais-abertos/ e /editais/; a Tide Setubal tem /editais-para-as-periferias/ — trocadas.", "08/11/2026 (conferido pelo Chrome, do Brasil): institutolocaliza.com.br não abre (domínio fora do ar: localizar o endereço novo); o Instituto Sicoob não publica edital (só programas próprios). A segunda etapa (R49) lê o mapa do site dos institutos: em 30 d, iCS 273 páginas novas (11 com edital), Fundação BB 42 (24), Lojas Renner 18 (1), Funbio 6 (1), Tide Setubal 24 (1), Maria Emília 9 (1), Instituto Claro 3 (1).", "08/11/2026 (parecer): um dos três melhores motores (11 estrelas), vivendo da metabusca; a lista mensal do GIFE (replicador) entrava como livro — vetada. Recebeu do motor-gife a busca dos editais de patrocínio e investimento social das empresas de Goiás e a dos institutos com atuação em Goiás (Unimed, Equatorial, Saneago, Sicoob/Sicredi, Fundação Jaime Câmara). O Banrisul (RS) fica: é alvo do estudo da titular e é privado (R27: as privadas ficam).", "Os institutos e fundações das empresas (do levantamento de destinação) também são deste canal.", "Rota de acesso única para os domínios com bloqueio (banrisulcultural.com.br, chamadas.funbio.org.br, climaesociedade.org, conteudo.fundacaotidesetubal.org.br, fundacao.bradesco…): ponte pelo Brasil, navegador do titular ou espelho.", "O afinador já achou 35 rota(s) que funcionaram: entram como rotas do motor.", "10 fonte(s) abrem a página e não acham nada: verificar contra as publicações conhecidas; candidatas ao teste do copiloto de IA.", "Os 24 alvos são vigiados só na janela prevista da próxima edição.", "08/11/2026 (passada completa no Chrome, Claude × motores 30 d): o VerSalic (página humana da API do SALIC) está \"em migração\" para https://aplicacoes.cultura.gov.br/comparar/salicnet/; a api.salic.cultura.gov.br ainda responde (só redireciona a barra final). A lista de maiores contribuintes de ICMS não mudou (atualização de 28/01/2026).", "08/11/2026 (parecer): a base está cheia (873 empresas e 856 incentivos na cópia de 25/10), mas a segunda etapa — os editais de patrocínio das empresas — nunca existiu neste motor (destino especial: só empresas). Ela passou ao novo-fundacoes-institutos (metabusca de patrocínio e investimento social das empresas de Goiás).", "O patrocínio da Zurich (zurich.com.br), que só o Motor de Recorrência lia, fica para quando houver rota de patrocínio confirmada.", "Rota de acesso única para os domínios com bloqueio (goias.gov.br, html.duckduckgo.com, salic.cultura.gov.br): ponte pelo Brasil, navegador do titular ou espelho.", "Recebe como alvo o patrocínio da Zurich (zurich.com.br), que só o Motor de Recorrência lia.", "robots_proibe: None", "ponte_brasil_aprendida: None", "alternativas_conhecidas: None", "rotas_quebradas: ['https://goias.gov.br/social/cedca/']", "14/11/2026 (análise externa em 3 grupos, pelo Claude no Chrome): 24 livros: 4 válidos, 5 encerradas, 15 descartes — vetos +1; vetos_endereco +7; exige_prazo=True"]
