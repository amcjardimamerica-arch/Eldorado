# Institutos e fundações empresariais — e as empresas incentivadoras de Goiás — organização dos 43 motores (titular, 09/11/2026): motor 27, grupo «Editais de empresas privadas».
# Reúne: motor-gife.

[motor]
id = "novo-fundacoes-institutos"
numero = 27
grupo = "Editais de empresas privadas"
nome = "Institutos Empresariais"   # 09/11/2026 (titular): o nome simplificado; antes «Institutos e fundações empresariais — e as empresas incentivadoras de Goiás»
categoria = "Portais e fontes do terceiro setor"
categoria_estudo = "POR"
finalidade = "encontrar os editais das entidades mantidas por empresas (institutos e fundações empresariais) e manter a base das empresas incentivadoras de Goiás (ICMS e Salic, destino especial por fonte)"
tipo_finalidade = "recorrencia"
canal = "portal"
uf = "BR"
destino = "biblioteca"
nomes_anteriores = ["site-fundacao-banco-do-brasil", "site-itau-social", "motor-gife", "motor-patrocinio"]

# 09/11/2026: veio do motor motor-gife (organização dos 43 motores)

# ---- destino ESPECIAL: este motor alimenta a base de empresas (quem pode destinar incentivo) e os incentivos (o que
# cada uma já destinou). Rotas confirmadas (23/10/2026, testes/paginas/motor-gife/): o PDF dos 500 maiores contribuintes
# do ICMS de Goiás (um por ano, com a raiz do CNPJ) e os incentivadores pessoa jurídica de Goiás no Salic (358, com o
# CNPJ completo e o total doado pela Rouanet).
[[fonte]]
nome = "Economia de Goiás — os 500 maiores contribuintes do ICMS (o PDF do ano mais recente)"
url = "https://goias.gov.br/economia/os-maiores-contribuintes-do-icms/"
tipo = "cadeia"
destino = "especial"                # 09/11/2026: a base de empresas (era o motor-gife)
papel = "principal"
lexico = { termos = [], vetos = [] }   # 09/11/2026: o léxico do motor motor-gife (cada fonte reunida mantém o próprio filtro)

[[fonte.cadeia]]
formato = "html"
itens = 'a[href*="MAIORES_DO_ICMS"]'
campos = { pdf = "attr:href", ano = 're:OFICIAL_(\d{4})' }
limite = 1

[[fonte.cadeia]]
formato = "linhas"
url = "{pdf}"
itens = '(?m)^(?P<posicao>\d+) º\n(?P<raiz>\d{8})\n(?P<nome>[^\n]+)\n(?P<localidade>[^\n]+)\n(?P<uf>[A-Z]{2})\n(?P<atividade>[^\n]+)'
limite = 500

[fonte.pista]
titulo = "{nome}"
link = "{pdf}#{posicao}"

[fonte.especial]
cnpj = "{raiz}"
razao_social = "{nome}"
uf = "{uf}"
atividade_principal = "{atividade}"
incentivo = { lei = "ICMS", ano = "{ano}" }   # 500 maiores contribuintes do ICMS de Goiás

