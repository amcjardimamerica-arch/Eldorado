<!doctype html>
<html lang="pt-BR">
<head>
<!-- O giroscópio Serpentes de Jade, embutido no calendário do Eldorado (28/10/2026): sem o painel lateral, fundo transparente, sem o zoom pela roda; recebe os prazos e a seleção por postMessage. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpentes de Jade: Giroscópio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>:root{color-scheme:light;--bg:#ece7dc;--stage:radial-gradient(ellipse at 50% 45%,#2c4a3c 0%,#0d120c 75%);--panel:#f6f2e9;--ink:#221c14;--muted:#655a48;--line:#ddd3c0;--line-strong:#b9ab90;--well:#ebe4d5;--accent:#1f7a64;--on-accent:#f3fff9;--radius:3px;--font-display:'Marcellus',Georgia,serif;--font-body:'Alegreya Sans','Segoe UI',sans-serif;--display-weight:400;--h1:38px;--h1-track:0;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0d0a;--stage:radial-gradient(ellipse at 50% 45%,#1f3a30 0%,#0a0b08 72%);--panel:#11130e;--ink:#f0e7d1;--muted:#a9b39a;--line:#2a2f22;--line-strong:#434b36;--well:#181b14;--accent:#ff9f1c;--on-accent:#1a0d02;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0d0a;--stage:radial-gradient(ellipse at 50% 45%,#1f3a30 0%,#0a0b08 72%);--panel:#11130e;--ink:#f0e7d1;--muted:#a9b39a;--line:#2a2f22;--line-strong:#434b36;--well:#181b14;--accent:#ff9f1c;--on-accent:#1a0d02;}

*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);height:100%}
#stage{position:relative;min-height:0;background:var(--stage)}
#stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hint{position:absolute;left:18px;bottom:14px;margin:0;font-size:13px;color:var(--muted);pointer-events:none;max-width:60%}
#part-tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);padding:5px 9px;font-size:13px;border-radius:var(--radius);max-width:280px}
#panel{overflow-y:auto;padding:28px 26px;border-left:1px solid var(--line);background:var(--panel)}
.ui-head h1{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--h1);line-height:1.05;margin:0 0 10px;letter-spacing:var(--h1-track)}
.ui-sub{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:34em}
.sel{margin-top:22px;padding:18px;background:var(--well);border:1px solid var(--line);border-radius:var(--radius)}
.sel-status{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--muted)}
.sel-status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent))}
.sel h2{font-family:var(--font-display);font-weight:var(--display-weight);font-size:26px;line-height:1.15;margin:0}
.sel-date{margin:6px 0 0;color:var(--muted);font-size:14px}
.sel-count{margin:14px 0 0;font-family:var(--font-display);line-height:1}
#s-big{font-size:62px;font-variant-numeric:tabular-nums}
#s-unit{font-size:22px;color:var(--muted)}
.sel-small{margin:6px 0 14px;font-size:14px}
.ui-btns{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;font-size:14px;color:var(--ink)}
button{padding:7px 12px;border:1px solid var(--line-strong);background:transparent;border-radius:var(--radius);cursor:pointer}
button:hover{background:var(--well)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.ui-check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px}
.ui-field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-top:12px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.lista{margin-top:24px}
.lista-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lista-head h3{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);font-size:22px}
#l-count{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;margin:10px 0;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
#l-list{list-style:none;margin:0;padding:0;max-height:min(46vh,430px);overflow-y:auto;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:10px 1fr;column-gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 6px;background:transparent}
.item::before{content:"";grid-row:1 / span 2;align-self:center;width:9px;height:9px;border-radius:50%;background:var(--c)}
.item[aria-current=true]{background:var(--well)}
.i-nome{font-weight:600;font-size:14.5px}
.i-meta{font-size:13px;color:var(--muted)}
.vazio{padding:12px 4px;color:var(--muted);font-size:14px}
.box{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius)}
.box summary{cursor:pointer;padding:10px 14px;font-weight:600}
.box>*:not(summary){margin-left:14px;margin-right:14px}
.box[open]{padding-bottom:14px}
.ui-note{color:var(--muted);font-size:13.5px;margin:4px 0 10px}
textarea{display:block;width:calc(100% - 28px);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px;margin-bottom:10px}
pre{white-space:pre-wrap;font-size:12.5px;background:var(--well);padding:10px;border-radius:var(--radius);overflow-x:auto}
code{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ui-error{margin:0;padding:32px;max-width:32em;color:var(--ink)}
@media (max-width:760px){
 body{height:auto;min-height:100%}
 .app{grid-template-columns:1fr;grid-template-rows:minmax(380px,64svh) auto;height:auto}
 #panel{border-left:0;border-top:1px solid var(--line);padding:22px 18px}
}
.compacto,.compacto body,.compacto #stage{background:transparent}
.compacto .app{grid-template-columns:1fr;height:100%}
.compacto #panel,.compacto .hint{display:none}

.sel h2{margin-top:2px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{padding:10px 12px;font-weight:600}
.legend,.views{margin-top:20px}
.legend h3,.views h3{margin:0 0 8px;font-family:var(--font-display);font-weight:var(--display-weight);font-size:20px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend i.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.legend i.pulse{animation:none}}
.views .seg{margin:0}
#l-list{max-height:min(48vh,460px);overflow-y:auto;border-top:1px solid var(--line)}
#l-list h4{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;font-size:14px;font-weight:700;text-transform:none}
#l-list h4 small{font-weight:500;color:var(--muted)}
#l-list ul{list-style:none;margin:0;padding:0}
.item{grid-template-columns:30px 1fr;row-gap:1px}
.item::before{display:none}
.i-dia{grid-row:1 / span 2;align-self:center;justify-self:center;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--c);color:#14100b}
.app{grid-template-columns:1fr!important}#panel{display:none!important}#stage{background:transparent!important}.hint{display:none!important}html,body{background:transparent!important}</style>
</head>
<body>
<div class="app">
  <main id="stage" aria-label="Astrolábio-mostrador de prazos: Serpentes de Jade: Giroscópio"><p class="hint">Arraste para girar em qualquer direção. O calendário fica sempre de frente; clique num dia ou num mês para ver os prazos.</p></main>
  <aside id="panel"></aside>
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="RoomEnvironment.js"></script>
<script>(function (G) {
  'use strict';
  const C = G.AstroCore, D2R = Math.PI / 180, St = {};
  let T;
  St.init = function (three) { T = three; };

  // ---------- Maya / Andean calendar math ----------
  St.TZ = ['Imix', 'Ik’', 'Ak’bal', 'K’an', 'Chikchan', 'Kimi', 'Manik’', 'Lamat', 'Muluk', 'Ok', 'Chuwen', 'Eb', 'Ben', 'Ix', 'Men', 'Kib', 'Kaban', 'Etz’nab', 'Kawak', 'Ajaw'];
  St.HAAB = ['Pop', 'Wo’', 'Sip', 'Sotz’', 'Sek', 'Xul', 'Yaxk’in', 'Mol', 'Ch’en', 'Yax', 'Sak’', 'Keh', 'Mak', 'K’ank’in', 'Muwan', 'Pax', 'K’ayab', 'Kumk’u', 'Wayeb'];
  St.maya = function (date) {
    const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    const jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    const n = jdn - 584283, md = (x, k) => ((x % k) + k) % k;
    const lc = [Math.floor(n / 144000), Math.floor(md(n, 144000) / 7200), Math.floor(md(n, 7200) / 360), Math.floor(md(n, 360) / 20), md(n, 20)];
    const tzNum = md(n + 3, 13) + 1, tzIdx = md(n + 19, 20), hp = md(n + 348, 365);
    return { n: n, lc: lc, tzNum: tzNum, tzIdx: tzIdx, tzName: St.TZ[tzIdx], haabPos: hp, haabMonth: Math.floor(hp / 20), haabDay: hp % 20,
      haabName: St.HAAB[Math.floor(hp / 20)], text: lc.join('.') };
  };

  // ---------- materials & primitives ----------
  St.noise = function () {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    x.fillStyle = '#9a9a9a'; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2600; i++) { const v = 110 + Math.random() * 120 | 0; x.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; x.globalAlpha = 0.35; x.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3); }
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(3, 3); return t;
  };
  St.mats = function (th) {
    const rough = St.noise();
    const m = (color, metal, r) => new T.MeshStandardMaterial({ color: color, metalness: metal, roughness: r, roughnessMap: rough });
    return {
      brass: m(th.brass || 0xb8893d, 1, 0.36), brassDark: m(th.brassDark || 0x7d5a26, 1, 0.48), copper: m(th.copper || 0xb86b3e, 1, 0.38),
      iron: m(th.iron || 0x2f2b26, 0.8, 0.6), stone: m(th.stone || 0x7a6a55, 0, 0.92),
      jade: new T.MeshStandardMaterial({ color: th.jade || 0x2e8b6a, roughness: 0.3, metalness: 0 }),
      turq: new T.MeshStandardMaterial({ color: th.turq || 0x3bb3a3, roughness: 0.4, metalness: 0 }),
      obsidian: new T.MeshStandardMaterial({ color: 0x141414, roughness: 0.14, metalness: 0.4 }),
      glass: new T.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.14, roughness: 0.04, metalness: 0, clearcoat: 1, depthWrite: false }),
      lampLeft: new T.MeshStandardMaterial({ color: th.lamp || 0xffb347, emissive: th.lamp || 0xffa53a, emissiveIntensity: 1.5, roughness: 0.3 }),
      lampToday: new T.MeshStandardMaterial({ color: 0xffffff, emissive: th.today || 0xffe2a0, emissiveIntensity: 2.2, roughness: 0.2 }),
      lampPast: new T.MeshStandardMaterial({ color: 0x2b2520, roughness: 0.25, metalness: 0.3 })
    };
  };
  St.gear = function (o) {
    const n = o.teeth, r = o.r, th = o.th || r * 0.12, rr = r - th, sh = new T.Shape();
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2, a = Math.PI * 2 / n;
      [[rr, 0], [r, 0.2], [r, 0.48], [rr, 0.68]].forEach(([rad, f], j) => { const ang = a0 + a * f, x = rad * Math.cos(ang), y = rad * Math.sin(ang); (i === 0 && j === 0) ? sh.moveTo(x, y) : sh.lineTo(x, y); });
    }
    sh.closePath();
    if (o.hole) { const h = new T.Path(); h.absarc(0, 0, o.hole, 0, Math.PI * 2, true); sh.holes.push(h); }
    if (o.spokes) {
      const ri = (o.hole || 0) + rr * 0.2, ro = rr * 0.78;
      for (let s = 0; s < o.spokes; s++) {
        const a0 = s / o.spokes * Math.PI * 2 + 0.14, a1 = (s + 1) / o.spokes * Math.PI * 2 - 0.14, p = new T.Path();
        p.absarc(0, 0, ro, a0, a1, false); p.absarc(0, 0, ri, a1, a0, true); p.closePath(); sh.holes.push(p);
      }
    }
    const depth = o.depth || 0.06;
    const g = new T.ExtrudeGeometry(sh, { depth: depth, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: Math.max(12, Math.round(40 * r)) });
    g.translate(0, 0, -depth / 2);
    return new T.Mesh(g, o.mat);
  };
  St.bolts = function (r, count, z, mat, size) {
    const s = size || 0.022, im = new T.InstancedMesh(new T.CylinderGeometry(s, s, s * 0.9, 6), mat, count), m4 = new T.Matrix4(), q = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2);
    for (let i = 0; i < count; i++) { const a = i / count * Math.PI * 2; m4.compose(new T.Vector3(r * Math.sin(a), r * Math.cos(a), z), q, new T.Vector3(1, 1, 1)); im.setMatrixAt(i, m4); }
    return im;
  };
  St.pipe = function (pts, r, mat) { return new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts.map(p => new T.Vector3(...p))), 64, r, 12, false), mat); };
  St.canvasMesh = function (geo, size, draw, matOpts) {
    const tex = C.canvasTexture(size, draw);
    const mesh = new T.Mesh(geo, new T.MeshStandardMaterial(Object.assign({ map: tex, metalness: 0.35, roughness: 0.5 }, matOpts || {})));
    mesh.userData.tex = tex; return mesh;
  };

  // ---------- central information sphere ----------
  St.InfoSphere = function (o) {
    const g = new T.Group(), W = 1024, H = 512;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
    const tex = new T.CanvasTexture(cv); tex.anisotropy = 8;
    const infoMat = new T.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.9, roughness: 0.22, metalness: 0.05 });
    const mc = document.createElement('canvas'); mc.width = 512; mc.height = 256; const mx = mc.getContext('2d');
    mx.fillStyle = '#b9b5ad'; mx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 160; i++) { const r = 2 + Math.random() * 16; mx.fillStyle = 'rgba(70,66,60,' + (0.12 + Math.random() * 0.25) + ')'; mx.beginPath(); mx.arc(Math.random() * 512, 30 + Math.random() * 196, r, 0, 7); mx.fill(); }
    const moonMat = new T.ShaderMaterial({
      uniforms: { map: { value: new T.CanvasTexture(mc) }, Lv: { value: new T.Vector3(0, 0, 1) } },
      vertexShader: 'varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform sampler2D map; uniform vec3 Lv; varying vec2 vUv; varying vec3 vN; void main(){ vec3 c = texture2D(map, vUv).rgb; float d = dot(normalize(vN), normalize(Lv)); float k = smoothstep(-0.03, 0.06, d); gl_FragColor = vec4(c * (0.05 + 0.95 * k), 1.0); }'
    });
    const core = new T.Mesh(new T.SphereGeometry(o.r, 64, 32), infoMat); g.add(core);
    g.add(new T.Mesh(new T.SphereGeometry(o.r * 1.07, 48, 24), o.mats.glass));
    const cage = o.cage || o.mats.brass;
    const r1 = new T.Mesh(new T.TorusGeometry(o.r * 1.12, o.r * 0.035, 10, 96), cage); g.add(r1);
    const r2 = r1.clone(); r2.rotation.y = Math.PI / 2; g.add(r2);
    const r3 = new T.Mesh(new T.TorusGeometry(o.r * 1.12, o.r * 0.025, 10, 96), cage); r3.rotation.x = Math.PI / 2; g.add(r3);
    [1, -1].forEach(s => { const cap = new T.Mesh(new T.SphereGeometry(o.r * 0.1, 16, 8), cage); cap.position.y = s * o.r * 1.12; g.add(cap); });
    let mode = 'info', lastKey = '';
    function fit(text, weight, size, max) { let s = size; do { ctx.font = weight + ' ' + s + 'px ' + o.font; s -= 2; } while (ctx.measureText(text).width > max && s > 12); }
    function draw(L, single) {
      const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, o.colors.bg0); gr.addColorStop(0.5, o.colors.bg1); gr.addColorStop(1, o.colors.bg0);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = o.colors.grid; ctx.globalAlpha = 0.3; ctx.lineWidth = 2;
      for (let i = 0; i < 24; i++) { ctx.beginPath(); ctx.moveTo(i * W / 24, 0); ctx.lineTo(i * W / 24, H); ctx.stroke(); }
      for (let j = 1; j < 8; j++) { ctx.beginPath(); ctx.moveTo(0, j * H / 8); ctx.lineTo(W, j * H / 8); ctx.stroke(); }
      ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = o.colors.ink; ctx.shadowColor = o.colors.glow; ctx.shadowBlur = 16;
      [W * 0.25, W * 0.75].forEach(cx => {
        if (single) { fit(L[0], '700', 72, 460); ctx.fillText(L[0], cx, H * 0.5); return; }
        if (L[3]) { fit(L[3], '600', 30, 440); ctx.fillText(L[3], cx, H * 0.33); }
        fit(L[0], '700', 112, 440); ctx.fillText(L[0], cx, H * 0.45);
        fit(L[1], '600', 40, 440); ctx.fillText(L[1], cx, H * 0.575);
        fit(L[2], '600', 34, 440); ctx.fillText(L[2], cx, H * 0.65);
      });
      ctx.shadowBlur = 0; tex.needsUpdate = true;
    }
    return {
      group: g, core: core,
      setMode(m) { mode = m; core.material = m === 'lua' ? moonMat : infoMat; lastKey = ''; },
      update(lines, phaseDeg, south, msg) {
        if (mode === 'lua') { const a = phaseDeg * D2R; moonMat.uniforms.Lv.value.set((south ? -1 : 1) * Math.sin(a), 0, -Math.cos(a)); return; }
        const L = mode === 'mensagem' ? [msg && msg.trim() ? msg.trim() : 'Escreva sua mensagem no painel'] : lines, key = mode + L.join('|');
        if (key !== lastKey) { lastKey = key; draw(L, mode === 'mensagem'); }
      }
    };
  };
  St.lines = function (f, s, extra) {
    const d = f.date, dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), left = dim - d.getDate();
    const hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return [hh, C.fmtShort.format(d), St.leftText(left), extra || ('Sol a ' + C.deg(f.sun.alt, 0) + ', ' + s.phaseName.toLowerCase())];
  };
  St.leftText = n => n === 0 ? 'último dia do mês' : n === 1 ? 'falta 1 dia no mês' : 'faltam ' + n + ' dias no mês';

  // ---------- month ring with lamps ----------
  const MESES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  St.MonthRing = function (o) {
    const g = new T.Group(), S = 1024, start = o.start || 15, span = o.span || 330, w = o.rOut - o.rIn;
    const ang = i => (start + i * span / 30) * D2R, k = (S / 2) / o.rOut;
    const rN = o.rIn + w * 0.34, rL = o.rIn + w * 0.76;
    const ring = St.canvasMesh(new T.RingGeometry(o.rIn, o.rOut, 160, 1), S, () => { }, { transparent: true, metalness: 0.3, roughness: 0.55 });
    g.add(ring);
    const lamps = [];
    for (let i = 0; i < 31; i++) {
