# A missão ativa: oportunidades de recursos para organizações da sociedade civil.
# Trocar a finalidade do Eldorado é trocar esta declaração e os arquivos da missão (itens, chave, portão).
[missao]
id = "oportunidades"
livro = "um programa de recursos (edital, chamamento, prêmio, emenda, incentivo), com as suas edições ao longo dos anos"
destino = "o Farol (segunda metade), pela transferência de livros finalizados"
etapas = ["recepcao", "certificacao", "preparacao", "validacao", "analise externa", "farol", "arquivo"]
itens = 12
territorio = "Goiás (municipais e estaduais), outros estados (estaduais e as capitais), nacionais e internacionais"
dados = ["config/missao/territorio_goias.json", "config/missao/municipios_brasil.json", "config/missao/republicadores.json", "config/missao/dispensas_por_regime.json"]
