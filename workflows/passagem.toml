# A passagem: planejar, acionar, decidir, aplicar, certificar no Cartório, aprender, conferir a completude e medir.
[workflow]
id = "passagem"
descricao = "A passagem completa do Eldorado (fases 1 a 4)"

[[no]]
id = "planejar"
tipo = "eldorado.base.cerebro.regencia:no_planejar"
parametros = { agenda = "config/agenda.toml", modulos = "config/modulos.toml", dados = "dados" }

[[no]]
id = "acionar"
tipo = "eldorado.base.cerebro.regencia:no_acionar"
parametros = { modulos = "config/modulos.toml", dados = "dados" }

[[no]]
id = "decidir"
tipo = "eldorado.base.cerebro.pertinencia:no_decidir"
parametros = { missao = "eldorado.base.missao.oportunidades:MissaoOportunidades", modulos = "config/modulos.toml" }

[[no]]
id = "aplicar_coleta"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "cartorio"
tipo = "eldorado.base.cartorio.cartorio:no_cartorio"
parametros = { dados = "dados", missao = "eldorado.base.missao.oportunidades:MissaoOportunidades" }

[[no]]
id = "aplicar_cartorio"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "auditar"
tipo = "eldorado.base.cartorio.auditoria:no_auditar"
parametros = { dados = "dados" }

[[no]]
id = "encaminhar"
tipo = "eldorado.base.cerebro.encaminhamento:no_encaminhar"
parametros = { dados = "dados", modulos = "config/modulos.toml", orcamento_s = 300, intervalo_s = 1.0 }

[[no]]
id = "decidir_rede"
tipo = "eldorado.base.cerebro.pertinencia:no_decidir"
parametros = { missao = "eldorado.base.missao.oportunidades:MissaoOportunidades", modulos = "config/modulos.toml" }

[[no]]
id = "aplicar_rede"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "validar"
tipo = "eldorado.base.cartorio.cartorio:no_cartorio"
parametros = { dados = "dados", missao = "eldorado.base.missao.oportunidades:MissaoOportunidades" }

[[no]]
id = "aplicar_validacao"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "analise_externa"
tipo = "eldorado.base.cartorio.analise_externa:no_analise_externa"
parametros = { dados = "dados", pasta = "verificacao" }

[[no]]
id = "farol"
tipo = "eldorado.base.transferencia.farol:no_farol"
parametros = { dados = "dados", destino = "transferencia/farol" }

[[no]]
id = "analise"
tipo = "eldorado.base.analise.previsao:no_analise"
parametros = { dados = "dados" }

[[no]]
id = "rede"
tipo = "eldorado.base.cerebro.rede:no_rede"
parametros = { dados = "dados" }

[[no]]
id = "aprender"
tipo = "eldorado.base.cerebro.aprendizado:no_aprendizado"
parametros = { dados = "dados" }

[[no]]
id = "completude"
tipo = "eldorado.base.cerebro.completude:no_completude"

[[no]]
id = "medir"
tipo = "eldorado.base.cerebro.medicao:no_medir"
parametros = { catalogo = "config/arquivos.json" }

[[no]]
id = "maquina"
tipo = "eldorado.base.fluxo.nos:ler_maquina"
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "reler_documentos"
tipo = "eldorado.base.cartorio.releitura:no_reler"
parametros = { dados = "dados", limite = 15, orcamento_s = 90 }

[[no]]
id = "medir_arquivos"
tipo = "eldorado.base.cerebro.mapa_arquivos:no_medir_arquivos"
parametros = { dados = "dados", intervalo_min = 10 }

[[no]]
id = "aplicar_final"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
parametros = { dados = "dados", eventos = "eventos" }

[[conexao]]
de = "planejar"
para = "acionar"
[[conexao]]
de = "acionar"
para = "decidir"
[[conexao]]
de = "decidir"
para = "aplicar_coleta"
[[conexao]]
de = "aplicar_coleta"
para = "cartorio"
saida = "ordem"                 # aplicar antes de certificar, sem passar dados
[[conexao]]
de = "decidir"
para = "cartorio"
[[conexao]]
de = "cartorio"
para = "aplicar_cartorio"
[[conexao]]
de = "aplicar_cartorio"
para = "auditar"
[[conexao]]
de = "auditar"
para = "encaminhar"
[[conexao]]
de = "encaminhar"
para = "decidir_rede"
[[conexao]]
de = "decidir_rede"
para = "aplicar_rede"
[[conexao]]
de = "aplicar_rede"
para = "validar"
saida = "ordem"
[[conexao]]
de = "decidir_rede"
para = "validar"
[[conexao]]
de = "validar"
para = "analise_externa"
[[conexao]]
de = "analise_externa"
para = "aplicar_validacao"
[[conexao]]
de = "aplicar_validacao"
para = "rede"
[[conexao]]
de = "rede"
para = "aprender"
[[conexao]]
de = "aprender"
para = "completude"
[[conexao]]
de = "completude"
para = "medir"
[[conexao]]
de = "medir"
para = "aplicar_final"
