# A passagem: planejar, acionar, decidir, aplicar, certificar no Cartório, aprender, conferir a completude e medir.
[workflow]
id = "passagem"
descricao = "A passagem completa do Eldorado (fases 1 a 4)"

[[no]]
id = "regras"
tipo = "eldorado.base.cerebro.regras:no_regras"
parametros = { dados = "dados", raiz = "." }

[[no]]
id = "revisar_alarmes"
tipo = "eldorado.base.cerebro.revisao_alarmes:no_revisar_alarmes"
parametros = { dados = "dados" }

[[no]]
id = "medir_sala"
tipo = "eldorado.base.painel.sala:no_medir_sala"
parametros = { dados = "dados", modulos = "config/modulos.toml", intervalo_min = 15 }

[[no]]
id = "planejar"
tipo = "eldorado.base.cerebro.regencia:no_planejar"
parametros = { agenda = "config/agenda.toml", modulos = "config/modulos.toml", dados = "dados" }

[[no]]
id = "acionar"
tipo = "eldorado.base.cerebro.regencia:no_acionar"
parametros = { modulos = "config/modulos.toml", dados = "dados" }

[[no]]
id = "decidir"
tipo = "eldorado.base.cerebro.pertinencia:no_decidir"
parametros = { missao = "eldorado.base.missao.oportunidades:MissaoOportunidades", modulos = "config/modulos.toml" }

[[no]]
id = "aplicar_coleta"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "cartorio"
tipo = "eldorado.base.cartorio.cartorio:no_cartorio"
parametros = { dados = "dados", missao = "eldorado.base.missao.oportunidades:MissaoOportunidades" }

[[no]]
id = "aplicar_cartorio"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "unir_repetidos"
tipo = "eldorado.base.cartorio.identidade:no_unir_repetidos"
parametros = { dados = "dados" }

[[no]]
id = "auditar"
tipo = "eldorado.base.cartorio.auditoria:no_auditar"
parametros = { dados = "dados" }

[[no]]
id = "encaminhar"
tipo = "eldorado.base.cerebro.encaminhamento:no_encaminhar"
parametros = { dados = "dados", modulos = "config/modulos.toml", orcamento_s = 300, intervalo_s = 1.0 }

[[no]]
id = "espiao"
tipo = "eldorado.base.cerebro.encaminhamento:no_espiao"
parametros = { dados = "dados", modulos = "config/modulos.toml", orcamento_pilotos_s = 180, intervalo_s = 1.0 }

[[no]]
id = "originais"
tipo = "eldorado.base.cerebro.encaminhamento:no_originais"
parametros = { dados = "dados", modulos = "config/modulos.toml", orcamento_originais_s = 120, intervalo_s = 1.0 }

[[no]]
id = "decidir_rede"
tipo = "eldorado.base.cerebro.pertinencia:no_decidir"
# 29/10/2026: recuperar_pendentes: os achados órfãos (sem decisão: a passagem interrompida levou a decisão) voltam à decisão
parametros = { missao = "eldorado.base.missao.oportunidades:MissaoOportunidades", modulos = "config/modulos.toml", recuperar_pendentes = 150, dados = "dados" }

[[no]]
id = "aplicar_rede"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "validar"
tipo = "eldorado.base.cartorio.cartorio:no_cartorio"
parametros = { dados = "dados", missao = "eldorado.base.missao.oportunidades:MissaoOportunidades" }

[[no]]
id = "aplicar_validacao"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
tentativas = 3
esperas_s = [2, 5]
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "analise_externa"
tipo = "eldorado.base.cartorio.analise_externa:no_analise_externa"
parametros = { dados = "dados", pasta = "verificacao" }

[[no]]
id = "farol"
tipo = "eldorado.base.transferencia.farol:no_farol"
parametros = { dados = "dados", destino = "transferencia/farol" }

[[no]]
id = "analise"
tipo = "eldorado.base.analise.previsao:no_analise"
parametros = { dados = "dados" }

[[no]]
id = "rede"
tipo = "eldorado.base.cerebro.rede:no_rede"
parametros = { dados = "dados" }

[[no]]
id = "aprender"
tipo = "eldorado.base.cerebro.aprendizado:no_aprendizado"
parametros = { dados = "dados" }

[[no]]
id = "completude"
tipo = "eldorado.base.cerebro.completude:no_completude"

[[no]]
id = "medir"
tipo = "eldorado.base.cerebro.medicao:no_medir"
parametros = { catalogo = "config/arquivos.json" }

[[no]]
id = "maquina"
tipo = "eldorado.base.fluxo.nos:ler_maquina"
parametros = { dados = "dados", eventos = "eventos" }

[[no]]
id = "reler_documentos"
tipo = "eldorado.base.cartorio.releitura:no_reler"
parametros = { dados = "dados", limite = 15, orcamento_s = 90 }

[[no]]
id = "medir_arquivos"
tipo = "eldorado.base.cerebro.mapa_arquivos:no_medir_arquivos"
parametros = { dados = "dados", intervalo_min = 10 }

[[no]]
id = "organizar_livros"
tipo = "eldorado.base.comandante.organizar:no_organizar_livros"
parametros = { dados = "dados" }

[[no]]
id = "atualizar_biblioteca"
tipo = "eldorado.base.comandante.biblioteca:no_atualizar_biblioteca"
parametros = { dados = "dados" }

[[no]]
id = "comandante_escolher"
tipo = "eldorado.base.comandante.escolher:no_comandante_escolher"
parametros = { dados = "dados" }

[[no]]
id = "comandante_decidir"
tipo = "eldorado.base.comandante.decidir:no_comandante_decidir"
parametros = { dados = "dados", config = "config" }

[[no]]
id = "avaliar"
tipo = "eldorado.base.aprendizado.avaliar:no_avaliar"
parametros = { dados = "dados" }

[[no]]
id = "curar"
tipo = "eldorado.base.aprendizado.curador:no_curar"
parametros = { dados = "dados", skills = "skills" }

[[no]]
id = "conferir"
tipo = "eldorado.base.comandante.parametros:no_conferir"
parametros = { dados = "dados" }

[[no]]
id = "memorizar"
tipo = "eldorado.base.aprendizado.memoria:no_memorizar"
parametros = { dados = "dados" }

[[no]]
id = "apresentar"
tipo = "eldorado.base.comandante.apresentar:no_apresentar"
parametros = { dados = "dados", pasta = "verificacao/relatorios" }

[[no]]
id = "aplicar_final"
tipo = "eldorado.base.fluxo.nos:aplicar_eventos"
parametros = { dados = "dados", eventos = "eventos" }

[[conexao]]
de = "planejar"
para = "acionar"
[[conexao]]
de = "acionar"
para = "decidir"
[[conexao]]
de = "decidir"
para = "aplicar_coleta"
[[conexao]]
de = "aplicar_coleta"
para = "cartorio"
saida = "ordem"                 # aplicar antes de certificar, sem passar dados
[[conexao]]
de = "decidir"
para = "cartorio"
[[conexao]]
de = "cartorio"
para = "aplicar_cartorio"
[[conexao]]
de = "aplicar_cartorio"
para = "auditar"
[[conexao]]
de = "auditar"
para = "encaminhar"
[[conexao]]
de = "encaminhar"
para = "decidir_rede"
[[conexao]]
de = "decidir_rede"
para = "aplicar_rede"
[[conexao]]
de = "aplicar_rede"
para = "validar"
saida = "ordem"
[[conexao]]
de = "decidir_rede"
para = "validar"
[[conexao]]
de = "validar"
para = "analise_externa"
[[conexao]]
de = "analise_externa"
para = "aplicar_validacao"
[[conexao]]
de = "aplicar_validacao"
para = "rede"
[[conexao]]
de = "rede"
para = "aprender"
[[conexao]]
de = "aprender"
para = "completude"
[[conexao]]
de = "completude"
para = "medir"
[[conexao]]
de = "medir"
para = "aplicar_final"
# 24/10/2026: os nós acrescentados ligados na posição certa (soltos, rodavam no começo, fora da ordem do fluxo)
[[conexao]]
de = "medir_sala"
para = "planejar"
saida = "ordem"
[[conexao]]
de = "aplicar_validacao"
para = "farol"
saida = "ordem"
[[conexao]]
de = "farol"
para = "analise"
saida = "ordem"
[[conexao]]
de = "analise"
para = "rede"
saida = "ordem"
[[conexao]]
de = "medir"
para = "maquina"
saida = "ordem"
[[conexao]]
de = "maquina"
para = "reler_documentos"
saida = "ordem"
[[conexao]]
de = "reler_documentos"
para = "medir_arquivos"
saida = "ordem"
[[conexao]]
de = "medir_arquivos"
para = "aplicar_final"
saida = "ordem"
# o parecer do conselho (24/10/2026): o Espião e os sites originais em nós próprios, depois do Interceptador, entregando à
# mesma decisão da rede (a falha de um não apaga os outros; cada um com o seu passo e a sua medição)
[[conexao]]
de = "auditar"
para = "espiao"
saida = "ordem"
[[conexao]]
de = "espiao"
para = "decidir_rede"
[[conexao]]
de = "auditar"
para = "originais"
saida = "ordem"
[[conexao]]
de = "originais"
para = "decidir_rede"
# a revisão das oportunidades repetidas (24/10/2026): depois do Cartório, antes da auditoria (que recalcula a estrela do
# livro que ficou, com as certidões do unido)
[[conexao]]
de = "aplicar_cartorio"
para = "unir_repetidos"
saida = "ordem"
[[conexao]]
de = "unir_repetidos"
para = "auditar"
saida = "ordem"
# o ciclo de vida dos alarmes (25/10/2026): no início da passagem, os alarmes resolvidos são fechados
[[conexao]]
de = "revisar_alarmes"
para = "medir_sala"
saida = "ordem"
# a tabela única das regras da titular (25/10/2026): no início, depois do revisor dos alarmes
[[conexao]]
de = "revisar_alarmes"
para = "regras"
saida = "ordem"
[[conexao]]
de = "regras"
para = "medir_sala"
saida = "ordem"
# a memória do Aprendizado (25/10/2026): o que é novo no Cérebro entra na memória FTS5, antes da aplicação final
[[conexao]]
de = "medir_arquivos"
para = "memorizar"
saida = "ordem"
[[conexao]]
de = "memorizar"
para = "apresentar"
saida = "ordem"
# a apresentação à titular (o Comandante, C10; no máximo a cada 6 h), por último
[[conexao]]
de = "apresentar"
para = "aplicar_final"
saida = "ordem"
# o Comandante decide em paralelo com a ordem fixa, logo depois do planejamento (a fase 2, 25/10/2026)
[[conexao]]
de = "planejar"
para = "comandante_decidir"
[[conexao]]
de = "comandante_decidir"
para = "acionar"
saida = "ordem"
# o Aprendizado avalia as decisões maduras do Comandante, antes da memória
[[conexao]]
de = "medir_arquivos"
para = "avaliar"
saida = "ordem"
[[conexao]]
de = "avaliar"
para = "curar"
saida = "ordem"
# o curador das skills (A5) e os parâmetros do Comandante (C7; a conferência de 20 min roda também a cada minuto)
[[conexao]]
de = "curar"
para = "conferir"
saida = "ordem"
[[conexao]]
de = "conferir"
para = "memorizar"
saida = "ordem"
# o nó de agente do Comandante (a fase 3; em sombra até o parâmetro comandante.aciona = sim): escolhe as etapas da passagem
[[conexao]]
de = "planejar"
para = "comandante_escolher"
saida = "ordem"
[[conexao]]
de = "comandante_escolher"
para = "comandante_decidir"
saida = "ordem"
# o Comandante organiza os livros do Cartório (C6): o código LOCAL·ÁREA·NATUREZA·OBJETO, as uniões e as eliminações
[[conexao]]
de = "unir_repetidos"
para = "organizar_livros"
saida = "ordem"
[[conexao]]
de = "organizar_livros"
para = "atualizar_biblioteca"
saida = "ordem"
# o Comandante atualiza a Biblioteca (a base de cada livro, a fila de completar, o Chrome para os esgotados)
[[conexao]]
de = "atualizar_biblioteca"
para = "auditar"
saida = "ordem"
